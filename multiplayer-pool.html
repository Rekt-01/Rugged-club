<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Degen Pool - Online Multiplayer Match</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
 dual-action: manipulation;
    }

    body {
      background-color: #020205;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
      touch-action: manipulation;
    }

    .pool-container {
      background: #0d0d12;
      border: 3px solid #00ff66;
      border-radius: 12px;
      padding: 10px;
      width: 96vw;
      max-width: 480px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .title-text {
      color: #00ffcc;
      font-size: 0.65rem;
      font-weight: bold;
      text-shadow: 0 0 6px #00ffcc;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .room-input {
      background: #020205;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-family: monospace;
      font-size: 0.6rem;
      padding: 2px 4px;
      border-radius: 4px;
      width: 90px;
      outline: none;
    }

    .header-btns {
      display: flex;
      gap: 5px;
    }

    .nav-btn {
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 0.55rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
      border: none;
      font-family: monospace;
    }

    .whitepaper-btn {
      background: rgba(0, 255, 204, 0.1);
      border: 2px solid #00ffcc;
      color: #00ffcc;
      box-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
    }
    .whitepaper-btn:hover { background: #00ffcc; color: #000; }

    .exit-btn {
      background: rgba(255, 51, 51, 0.15);
      border: 2px solid #ff3333;
      color: #ff3333;
      box-shadow: 0 0 5px rgba(255, 51, 51, 0.3);
    }
    .exit-btn:hover { background: #ff3333; color: #000; }

    .status-panel {
      width: 100%;
      background: #121218;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 6px;
      font-size: 0.58rem;
      color: #ccc;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slippage-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #444;
      border-radius: 4px;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .toggle-btn {
      background: #ffe600;
      color: #000;
      border: none;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.55rem;
      font-weight: bold;
      cursor: pointer;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #222;
      background: #000;
    }

    canvas {
      display: block;
      background: #0f5220;
      touch-action: none;
    }

    .event-toast {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(0, 0, 0, 0.95);
      border: 2px solid #ff007a;
      border-radius: 8px;
      padding: 8px 14px;
      color: #ff007a;
      font-size: 0.65rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 122, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      width: 85%;
    }
    .event-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .role-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 2, 5, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      gap: 12px;
      font-family: monospace;
      padding: 20px;
    }

    .role-modal h2 {
      color: #00ffcc;
      font-size: 1.1rem;
      text-shadow: 0 0 10px #00ffcc;
      text-align: center;
    }

    .role-modal p {
      color: #aaa;
      font-size: 0.7rem;
      text-align: center;
      max-width: 300px;
    }

    .name-input {
      width: 80%;
      max-width: 260px;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #00ffcc;
      background: #020205;
      color: #00ffcc;
      font-family: monospace;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }

    .role-btn {
      width: 80%;
      max-width: 260px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: monospace;
      text-transform: uppercase;
      transition: transform 0.1s;
    }
    .role-btn:active { transform: scale(0.96); }

    .btn-p1 {
      background: rgba(0, 255, 204, 0.15);
      border: 2px solid #00ffcc;
      color: #00ffcc;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .btn-p2 {
      background: rgba(255, 230, 0, 0.15);
      border: 2px solid #ffe600;
      color: #ffe600;
      box-shadow: 0 0 10px rgba(255, 230, 0, 0.3);
    }

    .btn-spectator {
      background: rgba(255, 0, 122, 0.15);
      border: 2px solid #ff007a;
      color: #ff007a;
      box-shadow: 0 0 10px rgba(255, 0, 122, 0.3);
    }

    .role-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #555;
      color: #555;
      box-shadow: none;
    }

    .controls-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
    }

    .aim-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .btn-ctrl {
      flex: 1;
      max-width: 120px;
      height: 30px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #00ffcc;
      border-radius: 6px;
      color: #00ffcc;
      font-size: 0.7rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-ctrl:active {
      background: rgba(0, 255, 204, 0.3);
      transform: scale(0.96);
    }

    .btn-shoot {
      width: 100%;
      height: 34px;
      background: #00ff66;
      color: #000;
      font-weight: bold;
      font-size: 0.7rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
      touch-action: manipulation;
    }
    .btn-shoot:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- Role Selection Modal -->
  <div class="role-modal" id="roleModal" style="display:none;">
    <h2>CHOOSE YOUR SEAT</h2>
    <p>Room: <span id="modalRoomName" style="color:#00ffcc"></span></p>
    
    <input type="text" id="playerNameInput" class="name-input" placeholder="Enter your name" maxlength="12" />
    
    <button class="role-btn btn-p1" id="selectP1Btn" onclick="claimRole('Player 1')">PLAY AS PLAYER 1</button>
    <button class="role-btn btn-p2" id="selectP2Btn" onclick="claimRole('Player 2')">PLAY AS PLAYER 2</button>
    <button class="role-btn btn-spectator" onclick="claimRole('Spectator')">WATCH AS SPECTATOR</button>
  </div>

  <div class="pool-container">
    <div class="header-bar">
      <div class="title-text">
        🎱 ROOM: <input type="text" id="roomInput" class="room-input" value="degens_101" onchange="changeRoom(this.value)" />
      </div>
      <div class="header-btns">
        <a href="index.html" class="nav-btn whitepaper-btn">📖 HOME</a>
        <button class="nav-btn exit-btn" onclick="leaveRoom()">🚪 EXIT</button>
      </div>
    </div>

    <div class="status-panel">
      <div class="slippage-box">
        <span>ONLINE SYNC: <strong id="syncStatus" style="color:#ffe600;">CONNECTING...</strong></span>
        <button class="toggle-btn" onclick="toggleSlippageMode()">TOGGLE</button>
      </div>
      <div class="status-row">
        <span>YOUR ROLE: <strong id="myRoleDisplay" style="color:#00ffcc;">SELECTING...</strong></span>
        <span>SLIPPAGE: <strong id="slippageLabel" style="color:#00ffcc;">BIG POCKETS</strong></span>
      </div>
      <div class="status-row">
        <span>SHIFT: <strong id="turnDisplay" style="color:#ffe600;">PLAYER 1</strong></span>
        <span>BAGS: <strong id="groupDisplay" style="color:#00ffcc;">OPEN MARKET</strong></span>
      </div>
      <div class="status-row" style="margin-top:2px;">
        <span id="p1NameDisplay" style="color:#00ffcc;">P1: ---</span>
        <span id="p2NameDisplay" style="color:#ffe600;">P2: ---</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="poolCanvas" width="360" height="190"></canvas>
      <div class="event-toast" id="eventToast"></div>
    </div>

    <div class="controls-container">
      <div class="aim-row">
        <button class="btn-ctrl" onclick="adjustAim(-0.1)">◀ ROTATE</button>
        <button class="btn-ctrl" onclick="adjustAim(0.1)">ROTATE ▶</button>
      </div>
      <button class="btn-shoot" onclick="executeShot()">⚡ SEND THE LIQUIDITY</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://evlawscutifjpppbffbu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2bGF3c2N1dGlmanBwcGJmZmJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMTczMjcsImV4cCI6MjEwNDg5MzMyN30.kYvtFRDP_vTAWhWkzk7Q8MpepUrXJbWID_uWNXxstgk';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // === PERSISTENT DEVICE ID (fixes seat locking) ===
    let deviceId = localStorage.getItem('pool_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('pool_device_id', deviceId);
    }

    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = urlParams.get('room') || "degens_101";
    document.getElementById('roomInput').value = roomCode;

    let localRole = null;
    let localName = localStorage.getItem('pool_player_name') || '';
    let p1Device = null;
    let p2Device = null;
    let p1Name = null;
    let p2Name = null;
    let realTimeChannel = null;

    // Prefill name input
    if (localName) {
      document.getElementById('playerNameInput').value = localName;
    }

    function changeRoom(newRoom) {
      if (!newRoom) return;
      roomCode = newRoom.trim();
      localRole = null;
      if (realTimeChannel) supabaseClient.removeChannel(realTimeChannel);
      if (window.syncPollInterval) clearInterval(window.syncPollInterval);
      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + encodeURIComponent(roomCode);
      window.history.pushState({path:newUrl}, '', newUrl);
      showToast(`🔄 Joined Room: ${roomCode}`);
      initMultiplayer();
    }

    function leaveRoom() {
      window.location.href = 'index.html';
    }

    const canvas = document.getElementById('poolCanvas');
    const ctx = canvas.getContext('2d');
    const toast = document.getElementById('eventToast');

    let bigPockets = true;
    function toggleSlippageMode() {
      bigPockets = !bigPockets;
      document.getElementById('slippageLabel').innerText = bigPockets ? "BIG POCKETS" : "STANDARD";
      showToast(bigPockets ? "🟢 Big Pockets Activated!" : "💎 Standard Pockets Active!");
    }

    function getPocketRadius() { return bigPockets ? 18 : 13; }

    const pockets = [
      { x: 16, y: 16 }, { x: 180, y: 12 }, { x: 344, y: 16 },
      { x: 16, y: 174 }, { x: 180, y: 178 }, { x: 344, y: 174 }
    ];

    let shotFired = false;
    let turn = 'Player 1';
    let player1Group = null;
    let player2Group = null;
    let turnPocketedAny = false;
    let turnPocketedValid = false;
    let scratched = false;

    let cueBall = { x: 90, y: 95, vx: 0, vy: 0, r: 5.5, color: '#ffffff', isCue: true, type: 'cue', num: 0 };
    let balls = [cueBall];

    function generateInitialRack() {
      balls = [cueBall];
      let rackX = 240, rackY = 95, spacing = 11.5;
      let ballNumbers = [1, 2, 9, 3, 8, 10, 4, 11, 12, 5, 6, 13, 14, 15, 7];
      let numIdx = 0;
      for (let col = 0; col < 5; col++) {
        for (let row = 0; row <= col; row++) {
          if (numIdx >= ballNumbers.length) break;
          let n = ballNumbers[numIdx];
          let bx = rackX + (col * spacing * 0.866);
          let by = rackY + (row * spacing) - (col * spacing / 2);
          let bType = (n === 8) ? 'black' : (n <= 7 ? 'solids' : 'stripes');
          let bColor = '#ffffff';
          if (n === 8) bColor = '#111111';
          else if (n === 1 || n === 9) bColor = '#f1c40f'; 
          else if (n === 2 || n === 10) bColor = '#2980b9'; 
          else if (n === 3 || n === 11) bColor = '#e74c3c'; 
          else if (n === 4 || n === 12) bColor = '#8e44ad'; 
          else if (n === 5 || n === 13) bColor = '#d35400'; 
          else if (n === 6 || n === 14) bColor = '#27ae60'; 
          else if (n === 7 || n === 15) bColor = '#c0392b'; 
          balls.push({ x: bx, y: by, vx: 0, vy: 0, r: 5.5, color: bColor, isCue: false, type: bType, num: n, isStripe: n > 8 });
          numIdx++;
        }
      }
    }
    generateInitialRack();

    let aimAngle = 0;
    let power = 6.8;

    function showToast(text) {
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2200);
    }

    function adjustAim(amount) {
      if (!isAnyBallMoving() && !shotFired) aimAngle += amount;
    }

    function executeShot() {
      if (turn !== localRole) {
        showToast(`🛑 Wait your turn! (${localName || localRole})`);
        return;
      }
      if (!isAnyBallMoving() && !shotFired) {
        turnPocketedAny = false;
        turnPocketedValid = false;
        scratched = false;
        cueBall.vx = Math.cos(aimAngle) * power;
        cueBall.vy = Math.sin(aimAngle) * power;
        shotFired = true;
        pushStateToServer();
      }
    }

    function isAnyBallMoving() {
      return balls.some(b => Math.abs(b.vx) > 0.03 || Math.abs(b.vy) > 0.03);
    }

    function handleBallPocketed(b) {
      turnPocketedAny = true;
      if (b.num === 8) {
        let activeGroup = turn === 'Player 1' ? player1Group : player2Group;
        let remainingGroupBalls = balls.filter(item => !item.isCue && item.num !== 8 && item.type === activeGroup);
        if (remainingGroupBalls.length === 0 && activeGroup !== null) {
          showToast(`🏆 ${(turn === 'Player 1' ? p1Name : p2Name) || turn} wins!`);
        } else {
          showToast(`💀 Premature 8-ball!`);
        }
        return;
      }
      if (player1Group === null) {
        if (turn === 'Player 1') {
          player1Group = b.type;
          player2Group = b.type === 'solids' ? 'stripes' : 'solids';
        } else {
          player2Group = b.type;
          player1Group = b.type === 'solids' ? 'stripes' : 'solids';
        }
        document.getElementById('groupDisplay').innerText = `P1: ${player1Group.toUpperCase()} | P2: ${player2Group.toUpperCase()}`;
      }
      let activeGroup = turn === 'Player 1' ? player1Group : player2Group;
      if (b.type === activeGroup) {
        turnPocketedValid = true;
        showToast(`${(turn === 'Player 1' ? p1Name : p2Name) || turn} pocketed valid! 🎯`);
      } else {
        showToast(`Wrong group! 🛑`);
      }
    }

    async function pushStateToServer() {
      try {
        const payloadState = {
          balls: balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, num: b.num, isCue: b.isCue, color: b.color, type: b.type, isStripe: b.isStripe, r: b.r })),
          turn,
          player1Group,
          player2Group,
          p1Device,
          p2Device,
          p1Name,
          p2Name
        };
        await supabaseClient
          .from('pool_games')
          .upsert(
            { room_code: roomCode, game_state: payloadState, updated_at: new Date() },
            { onConflict: 'room_code' }
          );
      } catch (e) {
        console.error("Supabase Push error:", e);
      }
    }

    async function initMultiplayer() {
      try {
        let { data, error } = await supabaseClient
          .from('pool_games')
          .select('*')
          .eq('room_code', roomCode);
        
        if (!data || data.length === 0) {
          generateInitialRack();
          const initState = {
            balls: balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, num: b.num, isCue: b.isCue, color: b.color, type: b.type, isStripe: b.isStripe, r: b.r })),
            turn, player1Group, player2Group, 
            p1Device: null, p2Device: null,
            p1Name: null, p2Name: null
          };
          await supabaseClient
            .from('pool_games')
            .upsert(
              { room_code: roomCode, game_state: initState, updated_at: new Date() },
              { onConflict: 'room_code' }
            );
          
          p1Device = null;
          p2Device = null;
          p1Name = null;
          p2Name = null;
        } else {
          let state = data[0].game_state || {};
          p1Device = state.p1Device || null;
          p2Device = state.p2Device || null;
          p1Name = state.p1Name || null;
          p2Name = state.p2Name || null;
          applyRemoteState(state);
        }

        // Already claimed by this device?
        if (p1Device === deviceId) {
          localRole = 'Player 1';
          localName = p1Name || localName;
        } else if (p2Device === deviceId) {
          localRole = 'Player 2';
          localName = p2Name || localName;
        } else {
          document.getElementById('modalRoomName').innerText = roomCode;
          document.getElementById('selectP1Btn').disabled = (p1Device !== null && p1Device !== deviceId);
          document.getElementById('selectP2Btn').disabled = (p2Device !== null && p2Device !== deviceId);
          document.getElementById('roleModal').style.display = 'flex';
          return;
        }

        activateConnection();
      } catch (e) {
        document.getElementById('syncStatus').innerText = 'SYNC ERROR (FALLBACK)';
        document.getElementById('syncStatus').style.color = '#ff3333';
        console.error(e);
      }
    }

    async function claimRole(role) {
      const nameInput = document.getElementById('playerNameInput').value.trim();
      if (!nameInput && role !== 'Spectator') {
        showToast('✍️ Enter a name first!');
        return;
      }

      localRole = role;
      localName = nameInput || 'Anon';
      localStorage.setItem('pool_player_name', localName);

      document.getElementById('roleModal').style.display = 'none';

      let { data } = await supabaseClient
        .from('pool_games')
        .select('game_state')
        .eq('room_code', roomCode);

      let state = (data && data.length > 0 && data[0].game_state) ? data[0].game_state : {};
      
      if (role === 'Player 1') {
        state.p1Device = deviceId;
        state.p1Name = localName;
      }
      if (role === 'Player 2') {
        state.p2Device = deviceId;
        state.p2Name = localName;
      }

      p1Device = state.p1Device;
      p2Device = state.p2Device;
      p1Name = state.p1Name;
      p2Name = state.p2Name;

      await supabaseClient
        .from('pool_games')
        .upsert(
          { room_code: roomCode, game_state: state, updated_at: new Date() },
          { onConflict: 'room_code' }
        );

      activateConnection();
      showToast(`✅ ${localName} joined as ${role}`);
    }

    function activateConnection() {
      updateRoleUI();
      document.getElementById('syncStatus').innerText = 'HYBRID SYNC ACTIVE';
      document.getElementById('syncStatus').style.color = '#00ff66';

      if (realTimeChannel) supabaseClient.removeChannel(realTimeChannel);

      realTimeChannel = supabaseClient
        .channel(`room_${roomCode}`)
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'pool_games', filter: `room_code=eq.${roomCode}` },
          (payload) => {
            if (payload.new && payload.new.game_state) {
              applyRemoteState(payload.new.game_state);
            }
          }
        )
        .subscribe();

      if (window.syncPollInterval) clearInterval(window.syncPollInterval);
      window.syncPollInterval = setInterval(async () => {
        try {
          let { data } = await supabaseClient
            .from('pool_games')
            .select('game_state')
            .eq('room_code', roomCode);

          if (data && data.length > 0 && data[0].game_state) {
            applyRemoteState(data[0].game_state);
          }
        } catch (e) {}
      }, 1000);
    }

    function updateRoleUI() {
      const roleDisp = document.getElementById('myRoleDisplay');
      if (localRole === 'Spectator') {
        roleDisp.innerText = 'SPECTATOR';
        roleDisp.style.color = '#ff007a';
      } else {
        roleDisp.innerText = (localName || localRole).toUpperCase();
        roleDisp.style.color = localRole === 'Player 1' ? '#00ffcc' : '#ffe600';
      }

      document.getElementById('p1NameDisplay').innerText = `P1: ${p1Name || '---'}`;
      document.getElementById('p2NameDisplay').innerText = `P2: ${p2Name || '---'}`;
    }

    function applyRemoteState(remoteState) {
      if (remoteState.p1Device !== undefined) p1Device = remoteState.p1Device;
      if (remoteState.p2Device !== undefined) p2Device = remoteState.p2Device;
      if (remoteState.p1Name !== undefined) p1Name = remoteState.p1Name;
      if (remoteState.p2Name !== undefined) p2Name = remoteState.p2Name;

      document.getElementById('p1NameDisplay').innerText = `P1: ${p1Name || '---'}`;
      document.getElementById('p2NameDisplay').innerText = `P2: ${p2Name || '---'}`;

      if (remoteState.balls && Array.isArray(remoteState.balls) && remoteState.balls.length > 0 && !isAnyBallMoving() && !shotFired) {
        balls = remoteState.balls.map(rb => ({ ...rb }));
        cueBall = balls.find(b => b.isCue) || cueBall;
      } else if (remoteState.balls && remoteState.balls.length === 0) {
        generateInitialRack(); // safety restore
      }

      if (remoteState.turn) {
        turn = remoteState.turn;
        const displayName = turn === 'Player 1' ? (p1Name || 'PLAYER 1') : (p2Name || 'PLAYER 2');
        document.getElementById('turnDisplay').innerText = displayName.toUpperCase();
      }
      if (remoteState.player1Group !== undefined) {
        player1Group = remoteState.player1Group;
        player2Group = remoteState.player2Group;
        if (player1Group) {
          document.getElementById('groupDisplay').innerText = `P1: ${player1Group.toUpperCase()} | P2: ${player2Group.toUpperCase()}`;
        }
      }
    }

    function updateGame() {
      let currentPocketRadius = getPocketRadius();
      for (let i = balls.length - 1; i >= 0; i--) {
        let b = balls[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.988;
        b.vy *= 0.988;
        if (Math.abs(b.vx) < 0.02) b.vx = 0;
        if (Math.abs(b.vy) < 0.02) b.vy = 0;
        if (b.x - b.r < 20) { b.x = 20 + b.r; b.vx *= -1; }
        if (b.x + b.r > 340) { b.x = 340 - b.r; b.vx *= -1; }
        if (b.y - b.r < 20) { b.y = 20 + b.r; b.vy *= -1; }
        if (b.y + b.r > 170) { b.y = 170 - b.r; b.vy *= -1; }

        pockets.forEach(p => {
          if (Math.hypot(b.x - p.x, b.y - p.y) < currentPocketRadius + 2) {
            if (b.isCue) {
              b.x = 90; b.y = 95; b.vx = 0; b.vy = 0;
              scratched = true;
              showToast("🚨 Cue Ball Scratch!");
            } else {
              handleBallPocketed(b);
              balls.splice(i, 1);
            }
          }
        });
      }

      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          let b1 = balls[i], b2 = balls[j];
          let dx = b2.x - b1.x, dy = b2.y - b1.y;
          let dist = Math.hypot(dx, dy);
          let minDist = b1.r + b2.r;
          if (dist < minDist && dist > 0) {
            let nx = dx / dist, ny = dy / dist;
            let overlap = minDist - dist;
            b1.x -= nx * overlap * 0.5; b1.y -= ny * overlap * 0.5;
            b2.x += nx * overlap * 0.5; b2.y += ny * overlap * 0.5;
            let kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
            let p = 2 * (nx * kx + ny * ky) / 2;
            if (p > 0) {
              b1.vx -= p * nx * 0.96; b1.vy -= p * ny * 0.96;
              b2.vx += p * nx * 0.96; b2.vy += p * ny * 0.96;
            }
          }
        }
      }

      if (shotFired && !isAnyBallMoving()) {
        shotFired = false;
        let keepsTurn = turnPocketedValid && !scratched;
        if (!keepsTurn) {
          turn = turn === 'Player 1' ? 'Player 2' : 'Player 1';
          const displayName = turn === 'Player 1' ? (p1Name || 'PLAYER 1') : (p2Name || 'PLAYER 2');
          document.getElementById('turnDisplay').innerText = displayName.toUpperCase();
        } else {
          showToast(`🔥 ${(turn === 'Player 1' ? p1Name : p2Name) || turn} keeps turn!`);
        }
        pushStateToServer();
      }

      drawTable();
      requestAnimationFrame(updateGame);
    }

    function drawTable() {
      let currentPocketRadius = getPocketRadius();
      ctx.fillStyle = '#0f5220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      pockets.forEach(p => {
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(p.x, p.y, currentPocketRadius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.strokeStyle = '#4a2c11';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, canvas.width - 14, canvas.height - 14);

      balls.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        if (b.isStripe) {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * 0.55, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (!isAnyBallMoving() && !shotFired) {
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(cueBall.x, cueBall.y);
        ctx.lineTo(cueBall.x + Math.cos(aimAngle) * 65, cueBall.y + Math.sin(aimAngle) * 65);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    updateGame();
    initMultiplayer();
  </script>
</body>
</html>
