<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Degen Pool - Online Multiplayer Match</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #020205;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
      touch-action: manipulation;
    }

    .pool-container {
      background: #0d0d12;
      border: 3px solid #00ff66;
      border-radius: 12px;
      padding: 10px;
      width: 96vw;
      max-width: 480px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .title-text {
      color: #00ffcc;
      font-size: 0.65rem;
      font-weight: bold;
      text-shadow: 0 0 6px #00ffcc;
    }

    .header-btns {
      display: flex;
      gap: 5px;
    }

    .nav-btn {
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 0.55rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .whitepaper-btn {
      background: rgba(0, 255, 204, 0.1);
      border: 2px solid #00ffcc;
      color: #00ffcc;
      box-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
    }
    .whitepaper-btn:hover { background: #00ffcc; color: #000; }

    .exit-btn {
      background: rgba(255, 51, 51, 0.15);
      border: 2px solid #ff3333;
      color: #ff3333;
      box-shadow: 0 0 5px rgba(255, 51, 51, 0.3);
    }
    .exit-btn:hover { background: #ff3333; color: #000; }

    .status-panel {
      width: 100%;
      background: #121218;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 6px;
      font-size: 0.6rem;
      color: #ccc;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slippage-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #444;
      border-radius: 4px;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 0.58rem;
    }

    .toggle-btn {
      background: #ffe600;
      color: #000;
      border: none;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.55rem;
      font-weight: bold;
      cursor: pointer;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #222;
      background: #000;
    }

    canvas {
      display: block;
      background: #0f5220;
      touch-action: none;
    }

    .event-toast {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(0, 0, 0, 0.95);
      border: 2px solid #ff007a;
      border-radius: 8px;
      padding: 8px 14px;
      color: #ff007a;
      font-size: 0.65rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 122, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      width: 85%;
    }
    .event-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .controls-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
    }

    .aim-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .btn-ctrl {
      flex: 1;
      max-width: 120px;
      height: 30px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #00ffcc;
      border-radius: 6px;
      color: #00ffcc;
      font-size: 0.7rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-ctrl:active {
      background: rgba(0, 255, 204, 0.3);
      transform: scale(0.96);
    }

    .btn-shoot {
      width: 100%;
      height: 34px;
      background: #00ff66;
      color: #000;
      font-weight: bold;
      font-size: 0.7rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
      touch-action: manipulation;
    }
    .btn-shoot:active {
      transform: scale(0.97);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="pool-container">
    <div class="header-bar">
      <div class="title-text">🎱 <span id="roomTitleText">ROOM: room_degens_101</span></div>
      <div class="header-btns">
        <a href="index.html" class="nav-btn whitepaper-btn">📖 HOME</a>
        <a href="index.html" class="nav-btn exit-btn">🚪 EXIT</a>
      </div>
    </div>

    <div class="status-panel">
      <div class="slippage-box">
        <span>ONLINE STATUS: <strong id="syncStatus" style="color:#ffe600;">ACTIVE (LOCAL READY)</strong></span>
        <button class="toggle-btn" onclick="toggleSlippageMode()">TOGGLE</button>
      </div>
      <div class="status-row">
        <span>SLIPPAGE MODE: <strong id="slippageLabel" style="color:#00ffcc;">PAPER HAND (BIG POCKETS)</strong></span>
      </div>
      <div class="status-row">
        <span>SHIFT: <strong id="turnDisplay" style="color:#ffe600;">PLAYER 1</strong></span>
        <span>BAGS: <strong id="groupDisplay" style="color:#00ffcc;">OPEN MARKET</strong></span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="poolCanvas" width="360" height="190"></canvas>
      <div class="event-toast" id="eventToast"></div>
    </div>

    <div class="controls-container">
      <div class="aim-row">
        <button class="btn-ctrl" onclick="adjustAim(-0.1)">◀ ROTATE</button>
        <button class="btn-ctrl" onclick="adjustAim(0.1)">ROTATE ▶</button>
      </div>
      <button class="btn-shoot" onclick="executeShot()">⚡ SEND THE LIQUIDITY</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('poolCanvas');
    const ctx = canvas.getContext('2d');
    const toast = document.getElementById('eventToast');

    let bigPockets = true;
    function toggleSlippageMode() {
      bigPockets = !bigPockets;
      document.getElementById('slippageLabel').innerText = bigPockets ? "PAPER HAND (BIG POCKETS)" : "DIAMOND HAND (STANDARD)";
      document.getElementById('slippageLabel').style.color = bigPockets ? "#00ffcc" : "#ff007a";
      showToast(bigPockets ? "🟢 Paper Hand Mode: Huge Pockets Activated!" : "💎 Diamond Hand Mode: Pro Pockets Active!");
    }

    function getPocketRadius() {
      return bigPockets ? 18 : 13;
    }

    const pockets = [
      { x: 16, y: 16 }, { x: 180, y: 12 }, { x: 344, y: 16 },
      { x: 16, y: 174 }, { x: 180, y: 178 }, { x: 344, y: 174 }
    ];

    let shotFired = false;
    let turn = 'Player 1';
    let player1Group = null;
    let player2Group = null;
    let turnPocketedAny = false;
    let turnPocketedValid = false;
    let scratched = false;

    let cueBall = { x: 90, y: 95, vx: 0, vy: 0, r: 5.5, color: '#ffffff', isCue: true, type: 'cue', num: 0 };
    let balls = [cueBall];

    function generateInitialRack() {
      balls = [cueBall];
      let rackX = 240, rackY = 95, spacing = 11.5;
      let ballNumbers = [1, 2, 9, 3, 8, 10, 4, 11, 12, 5, 6, 13, 14, 15, 7];

      let numIdx = 0;
      for (let col = 0; col < 5; col++) {
        for (let row = 0; row <= col; row++) {
          if (numIdx >= ballNumbers.length) break;
          let n = ballNumbers[numIdx];
          let bx = rackX + (col * spacing * 0.866);
          let by = rackY + (row * spacing) - (col * spacing / 2);
          
          let bType = (n === 8) ? 'black' : (n <= 7 ? 'solids' : 'stripes');
          let bColor = '#ffffff';
          if (n === 8) bColor = '#111111';
          else if (n === 1 || n === 9) bColor = '#f1c40f'; 
          else if (n === 2 || n === 10) bColor = '#2980b9'; 
          else if (n === 3 || n === 11) bColor = '#e74c3c'; 
          else if (n === 4 || n === 12) bColor = '#8e44ad'; 
          else if (n === 5 || n === 13) bColor = '#d35400'; 
          else if (n === 6 || n === 14) bColor = '#27ae60'; 
          else if (n === 7 || n === 15) bColor = '#c0392b'; 

          balls.push({ x: bx, y: by, vx: 0, vy: 0, r: 5.5, color: bColor, isCue: false, type: bType, num: n, isStripe: n > 8 });
          numIdx++;
        }
      }
    }

    generateInitialRack();

    let aimAngle = 0;
    let power = 6.8;

    function showToast(text) {
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    function adjustAim(amount) {
      if (!isAnyBallMoving() && !shotFired) {
        aimAngle += amount;
      }
    }

    function executeShot() {
      if (!isAnyBallMoving() && !shotFired) {
        turnPocketedAny = false;
        turnPocketedValid = false;
        scratched = false;

        cueBall.vx = Math.cos(aimAngle) * power;
        cueBall.vy = Math.sin(aimAngle) * power;
        shotFired = true;
      }
    }

    function isAnyBallMoving() {
      return balls.some(b => Math.abs(b.vx) > 0.03 || Math.abs(b.vy) > 0.03);
    }

    function handleBallPocketed(b) {
      turnPocketedAny = true;

      if (b.num === 8) {
        let activeGroup = turn === 'Player 1' ? player1Group : player2Group;
        let remainingGroupBalls = balls.filter(item => !item.isCue && item.num !== 8 && item.type === activeGroup);

        if (remainingGroupBalls.length === 0 && activeGroup !== null) {
          showToast(`🏆 ${turn} cleared bags and sank the 8-Ball! Victory!`);
        } else {
          showToast(`💀 Premature 8-ball sink by ${turn}! Rugged!`);
        }
        return;
      }

      if (player1Group === null) {
        if (turn === 'Player 1') {
          player1Group = b.type;
          player2Group = b.type === 'solids' ? 'stripes' : 'solids';
        } else {
          player2Group = b.type;
          player1Group = b.type === 'solids' ? 'stripes' : 'solids';
        }
        document.getElementById('groupDisplay').innerText = `P1: ${player1Group.toUpperCase()} | P2: ${player2Group.toUpperCase()}`;
      }

      let activeGroup = turn === 'Player 1' ? player1Group : player2Group;
      if (b.type === activeGroup) {
        turnPocketedValid = true;
        showToast(`${turn} pocketed a valid ${b.type} ball! Extra shot! 🎯`);
      } else {
        showToast(`${turn} pocketed an opponent's ball! 🛑`);
      }
    }

    function updateGame() {
      let currentPocketRadius = getPocketRadius();

      for (let i = balls.length - 1; i >= 0; i--) {
        let b = balls[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.988;
        b.vy *= 0.988;

        if (Math.abs(b.vx) < 0.02) b.vx = 0;
        if (Math.abs(b.vy) < 0.02) b.vy = 0;

        if (b.x - b.r < 20) { b.x = 20 + b.r; b.vx *= -1; }
        if (b.x + b.r > 340) { b.x = 340 - b.r; b.vx *= -1; }
        if (b.y - b.r < 20) { b.y = 20 + b.r; b.vy *= -1; }
        if (b.y + b.r > 170) { b.y = 170 - b.r; b.vy *= -1; }

        pockets.forEach(p => {
          if (Math.hypot(b.x - p.x, b.y - p.y) < currentPocketRadius + 2) {
            if (b.isCue) {
              b.x = 90; b.y = 95; b.vx = 0; b.vy = 0;
              scratched = true;
              showToast("🚨 Cue Ball Scratch!");
            } else {
              handleBallPocketed(b);
              balls.splice(i, 1);
            }
          }
        });
      }

      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          let b1 = balls[i], b2 = balls[j];
          let dx = b2.x - b1.x, dy = b2.y - b1.y;
          let dist = Math.hypot(dx, dy);
          let minDist = b1.r + b2.r;

          if (dist < minDist && dist > 0) {
            let nx = dx / dist, ny = dy / dist;
            let overlap = minDist - dist;
            b1.x -= nx * overlap * 0.5; b1.y -= ny * overlap * 0.5;
            b2.x += nx * overlap * 0.5; b2.y += ny * overlap * 0.5;

            let kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
            let p = 2 * (nx * kx + ny * ky) / 2;
            if (p > 0) {
              b1.vx -= p * nx * 0.96; b1.vy -= p * ny * 0.96;
              b2.vx += p * nx * 0.96; b2.vy += p * ny * 0.96;
            }
          }
        }
      }

      if (shotFired && !isAnyBallMoving()) {
        shotFired = false;
        let keepsTurn = turnPocketedValid && !scratched;

        if (!keepsTurn) {
          turn = turn === 'Player 1' ? 'Player 2' : 'Player 1';
          document.getElementById('turnDisplay').innerText = turn.toUpperCase();
        } else {
          showToast(`🔥 ${turn} keeps the turn!`);
        }
      }

      drawTable();
      requestAnimationFrame(updateGame);
    }

    function drawTable() {
      let currentPocketRadius = getPocketRadius();

      ctx.fillStyle = '#0f5220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      pockets.forEach(p => {
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(p.x, p.y, currentPocketRadius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.strokeStyle = '#4a2c11';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, canvas.width - 14, canvas.height - 14);

      balls.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        if (b.isStripe) {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * 0.55, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (!isAnyBallMoving() && !shotFired) {
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(cueBall.x, cueBall.y);
        ctx.lineTo(cueBall.x + Math.cos(aimAngle) * 65, cueBall.y + Math.sin(aimAngle) * 65);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Start rendering right away
    updateGame();
  </script>
</body>
</html>
