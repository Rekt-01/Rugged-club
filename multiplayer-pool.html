<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Pool - Online Multiplayer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #020205;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
      touch-action: manipulation;
    }

    .pool-container {
      background: #0d0d12;
      border: 3px solid #00ff66;
      border-radius: 12px;
      padding: 10px;
      width: 96vw;
      max-width: 480px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .title-text {
      color: #00ffcc;
      font-size: 0.65rem;
      font-weight: bold;
      text-shadow: 0 0 6px #00ffcc;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .room-input {
      background: #020205;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-family: monospace;
      font-size: 0.6rem;
      padding: 2px 4px;
      border-radius: 4px;
      width: 90px;
      outline: none;
    }

    .header-btns {
      display: flex;
      gap: 5px;
    }

    .nav-btn {
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 0.55rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
      border: none;
      font-family: monospace;
    }

    .pocket-btn {
      background: rgba(255, 230, 0, 0.15);
      border: 2px solid #ffe600;
      color: #ffe600;
    }
    .pocket-btn:hover { background: #ffe600; color: #000; }

    .exit-btn {
      background: rgba(255, 51, 51, 0.15);
      border: 2px solid #ff3333;
      color: #ff3333;
    }
    .exit-btn:hover { background: #ff3333; color: #000; }

    .status-panel {
      width: 100%;
      background: #121218;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 6px;
      font-size: 0.58rem;
      color: #ccc;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #222;
      background: #000;
    }

    canvas {
      display: block;
      background: #0f5220;
      touch-action: none;
    }

    .event-toast {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(0, 0, 0, 0.95);
      border: 2px solid #ff007a;
      border-radius: 8px;
      padding: 8px 14px;
      color: #ff007a;
      font-size: 0.65rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 122, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      width: 85%;
    }
    .event-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .role-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 2, 5, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      gap: 12px;
      font-family: monospace;
      padding: 20px;
    }

    .role-modal h2 {
      color: #00ffcc;
      font-size: 1.1rem;
      text-shadow: 0 0 10px #00ffcc;
      text-align: center;
    }

    .role-modal p {
      color: #aaa;
      font-size: 0.7rem;
      text-align: center;
      max-width: 300px;
    }

    .name-input {
      width: 80%;
      max-width: 260px;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #00ffcc;
      background: #020205;
      color: #00ffcc;
      font-family: monospace;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }

    .role-btn {
      width: 80%;
      max-width: 260px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: monospace;
      text-transform: uppercase;
    }
    .role-btn:active { transform: scale(0.96); }

    .btn-p1 {
      background: rgba(0, 255, 204, 0.15);
      border: 2px solid #00ffcc;
      color: #00ffcc;
    }

    .btn-p2 {
      background: rgba(255, 230, 0, 0.15);
      border: 2px solid #ffe600;
      color: #ffe600;
    }

    .btn-spectator {
      background: rgba(255, 0, 122, 0.15);
      border: 2px solid #ff007a;
      color: #ff007a;
    }

    .controls-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .aim-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .btn-ctrl {
      flex: 1;
      max-width: 120px;
      height: 32px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #00ffcc;
      border-radius: 6px;
      color: #00ffcc;
      font-size: 0.75rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .btn-ctrl:active {
      background: rgba(0, 255, 204, 0.3);
      transform: scale(0.96);
    }

    .btn-shoot {
      width: 100%;
      height: 38px;
      background: #00ff66;
      color: #000;
      font-weight: bold;
      font-size: 0.8rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
      text-transform: uppercase;
    }
    .btn-shoot:active {
      transform: scale(0.97);
    }

    .btn-rack {
      width: 100%;
      height: 30px;
      margin-top: 6px;
      background: #333;
      color: #aaa;
      font-weight: bold;
      font-size: 0.7rem;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-rack:active {
      background: #444;
      transform: scale(0.97);
    }

    .timer-display {
      text-align: center;
      font-size: 0.7rem;
      color: #ffe600;
      margin-top: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Role Selection Modal -->
  <div class="role-modal" id="roleModal" style="display:none;">
    <h2>CHOOSE YOUR SEAT</h2>
    <p>Room: <span id="modalRoomName" style="color:#00ffcc"></span></p>
    
    <input type="text" id="playerNameInput" class="name-input" placeholder="Enter your name" maxlength="12" />
    
    <button class="role-btn btn-p1" id="selectP1Btn" onclick="claimRole('Player 1')">PLAY AS PLAYER 1</button>
    <button class="role-btn btn-p2" id="selectP2Btn" onclick="claimRole('Player 2')">PLAY AS PLAYER 2</button>
    <button class="role-btn btn-spectator" onclick="claimRole('Spectator')">WATCH AS SPECTATOR</button>
  </div>

  <div class="pool-container">
    <div class="header-bar">
      <div class="title-text">
        🎱 ROOM: <input type="text" id="roomInput" class="room-input" value="degens_101" onchange="changeRoom(this.value)" />
      </div>
      <div class="header-btns">
        <button class="nav-btn pocket-btn" id="pocketBtn" onclick="togglePockets()">POCKETS: BIG</button>
        <button class="nav-btn exit-btn" onclick="leaveRoom()">EXIT</button>
      </div>
    </div>

    <div class="status-panel">
      <div class="status-row">
        <span>ONLINE: <strong id="syncStatus" style="color:#ffe600;">CONNECTING...</strong></span>
        <span>POCKETS: <strong id="pocketLabel" style="color:#00ffcc;">BIG</strong></span>
      </div>
      <div class="status-row">
        <span>YOU: <strong id="myRoleDisplay" style="color:#00ffcc;">SELECTING...</strong></span>
        <span>TURN: <strong id="turnDisplay" style="color:#ffe600;">PLAYER 1</strong></span>
      </div>
      <div class="status-row">
        <span id="p1NameDisplay" style="color:#00ffcc;">P1: ---</span>
        <span id="p2NameDisplay" style="color:#ffe600;">P2: ---</span>
      </div>
      <div class="status-row">
        <span>YOUR GROUP: <strong id="groupDisplay" style="color:#00ffcc;">OPEN TABLE</strong></span>
      </div>
      <div class="timer-display" id="timerDisplay">Shot timer: --</div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="poolCanvas" width="360" height="190"></canvas>
      <div class="event-toast" id="eventToast"></div>
    </div>

    <div class="controls-container">
      <div class="aim-row">
        <button class="btn-ctrl" onclick="adjustAim(-0.1)">◀ ROTATE</button>
        <button class="btn-ctrl" onclick="adjustAim(0.1)">ROTATE ▶</button>
      </div>

      <button class="btn-shoot" onclick="executeShot()">SHOOT</button>
      <button class="btn-rack" onclick="rackEm()">RE-RACK</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://evlawscutifjpppbffbu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2bGF3c2N1dGlmanBwcGJmZmJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMTczMjcsImV4cCI6MjEwNDg5MzMyN30.kYvtFRDP_vTAWhWkzk7Q8MpepUrXJbWID_uWNXxstgk';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let deviceId = localStorage.getItem('pool_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('pool_device_id', deviceId);
    }

    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = urlParams.get('room') || "degens_101";
    document.getElementById('roomInput').value = roomCode;

    let localRole = null;
    let localName = localStorage.getItem('pool_player_name') || '';
    let p1Device = null;
    let p2Device = null;
    let p1Name = null;
    let p2Name = null;
    let realTimeChannel = null;

    let shotTimer = null;
    let shotTimeLeft = 30;
    const SHOT_TIME = 30;

    // Global pocket size (synced)
    let bigPockets = true;   // start with bigger pockets

    if (localName) {
      document.getElementById('playerNameInput').value = localName;
    }

    function changeRoom(newRoom) {
      if (!newRoom) return;
      roomCode = newRoom.trim();
      localRole = null;
      clearShotTimer();
      if (realTimeChannel) supabaseClient.removeChannel(realTimeChannel);
      if (window.syncPollInterval) clearInterval(window.syncPollInterval);
      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + encodeURIComponent(roomCode);
      window.history.pushState({path:newUrl}, '', newUrl);
      showToast(`Joined room: ${roomCode}`);
      initMultiplayer();
    }

    function leaveRoom() {
      window.location.href = 'index.html';
    }

    // ===== GLOBAL POCKET TOGGLE =====
    async function togglePockets() {
      bigPockets = !bigPockets;
      updatePocketUI();
      showToast(bigPockets ? "Big pockets enabled for everyone" : "Normal pockets enabled for everyone");
      await pushStateToServer();   // this makes it global
    }

    function updatePocketUI() {
      document.getElementById('pocketLabel').innerText = bigPockets ? "BIG" : "NORMAL";
      document.getElementById('pocketBtn').innerText = bigPockets ? "POCKETS: BIG" : "POCKETS: NORMAL";
    }

    function getPocketRadius() {
      return bigPockets ? 19 : 13;
    }

    const canvas = document.getElementById('poolCanvas');
    const ctx = canvas.getContext('2d');
    const toast = document.getElementById('eventToast');

    const pockets = [
      { x: 16, y: 16 }, { x: 180, y: 12 }, { x: 344, y: 16 },
      { x: 16, y: 174 }, { x: 180, y: 178 }, { x: 344, y: 174 }
    ];

    let shotFired = false;
    let turn = 'Player 1';
    let player1Group = null;
    let player2Group = null;
    let turnPocketedAny = false;
    let turnPocketedValid = false;
    let scratched = false;
    let gameOver = false;

    let cueBall = { x: 95, y: 95, vx: 0, vy: 0, r: 5.5, color: '#ffffff', isCue: true, type: 'cue', num: 0 };
    let balls = [cueBall];

    function generateInitialRack() {
      cueBall = { x: 95, y: 95, vx: 0, vy: 0, r: 5.5, color: '#ffffff', isCue: true, type: 'cue', num: 0 };
      balls = [cueBall];

      let rackX = 240, rackY = 95, spacing = 11.5;
      let ballNumbers = [1, 2, 9, 3, 8, 10, 4, 11, 12, 5, 6, 13, 14, 15, 7];
      let numIdx = 0;
      for (let col = 0; col < 5; col++) {
        for (let row = 0; row <= col; row++) {
          if (numIdx >= ballNumbers.length) break;
          let n = ballNumbers[numIdx];
          let bx = rackX + (col * spacing * 0.866);
          let by = rackY + (row * spacing) - (col * spacing / 2);
          let bType = (n === 8) ? 'black' : (n <= 7 ? 'solids' : 'stripes');
          let bColor = '#ffffff';
          if (n === 8) bColor = '#111111';
          else if (n === 1 || n === 9) bColor = '#f1c40f'; 
          else if (n === 2 || n === 10) bColor = '#2980b9'; 
          else if (n === 3 || n === 11) bColor = '#e74c3c'; 
          else if (n === 4 || n === 12) bColor = '#8e44ad'; 
          else if (n === 5 || n === 13) bColor = '#d35400'; 
          else if (n === 6 || n === 14) bColor = '#27ae60'; 
          else if (n === 7 || n === 15) bColor = '#c0392b'; 
          balls.push({ x: bx, y: by, vx: 0, vy: 0, r: 5.5, color: bColor, isCue: false, type: bType, num: n, isStripe: n > 8 });
          numIdx++;
        }
      }
    }
    generateInitialRack();

    let aimAngle = 0;
    let power = 6.8;

    function showToast(text) {
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }

    function adjustAim(amount) {
      if (gameOver || isAnyBallMoving() || shotFired) return;
      aimAngle += amount;
    }

    function executeShot() {
      if (gameOver) {
        showToast("Game over – press RE-RACK");
        return;
      }
      if (turn !== localRole) {
        showToast("Wait your turn");
        return;
      }
      if (!isAnyBallMoving() && !shotFired) {
        clearShotTimer();
        turnPocketedAny = false;
        turnPocketedValid = false;
        scratched = false;
        cueBall.vx = Math.cos(aimAngle) * power;
        cueBall.vy = Math.sin(aimAngle) * power;
        shotFired = true;
        pushStateToServer();
      }
    }

    function isAnyBallMoving() {
      return balls.some(b => Math.abs(b.vx) > 0.03 || Math.abs(b.vy) > 0.03);
    }

    // ===== TIMER =====
    function startShotTimer() {
      clearShotTimer();
      if (gameOver || localRole === 'Spectator') return;
      shotTimeLeft = SHOT_TIME;
      updateTimerDisplay();
      shotTimer = setInterval(() => {
        shotTimeLeft--;
        updateTimerDisplay();
        if (shotTimeLeft <= 0) {
          clearShotTimer();
          kickCurrentPlayer();
        }
      }, 1000);
    }

    function clearShotTimer() {
      if (shotTimer) {
        clearInterval(shotTimer);
        shotTimer = null;
      }
      document.getElementById('timerDisplay').innerText = 'Shot timer: --';
    }

    function updateTimerDisplay() {
      const el = document.getElementById('timerDisplay');
      el.style.color = shotTimeLeft <= 10 ? '#ff3333' : '#ffe600';
      el.innerText = `Shot timer: ${shotTimeLeft}s`;
    }

    async function kickCurrentPlayer() {
      showToast(`Time's up! ${turn === 'Player 1' ? (p1Name || 'Player 1') : (p2Name || 'Player 2')} was kicked`);
      if (turn === 'Player 1') {
        p1Device = null;
        p1Name = null;
      } else {
        p2Device = null;
        p2Name = null;
      }
      turn = turn === 'Player 1' ? 'Player 2' : 'Player 1';
      await pushStateToServer();
      if ((turn === 'Player 2' && localRole === 'Player 1') || (turn === 'Player 1' && localRole === 'Player 2')) {
        localRole = null;
        document.getElementById('roleModal').style.display = 'flex';
        document.getElementById('myRoleDisplay').innerText = 'SELECTING...';
      }
    }

    function handleBallPocketed(b) {
      if (gameOver) return;
      turnPocketedAny = true;

      if (b.num === 8) {
        const shooterName = turn === 'Player 1' ? (p1Name || 'Player 1') : (p2Name || 'Player 2');
        const opponentName = turn === 'Player 1' ? (p2Name || 'Player 2') : (p1Name || 'Player 1');
        const activeGroup = turn === 'Player 1' ? player1Group : player2Group;
        const remaining = balls.filter(item => !item.isCue && item.num !== 8 && item.type === activeGroup);

        if (activeGroup !== null && remaining.length === 0 && !scratched) {
          showToast(`${shooterName} wins!`);
        } else {
          showToast(`${shooterName} pocketed the 8 early!\n${opponentName} wins!`);
        }
        gameOver = true;
        shotFired = false;
        clearShotTimer();
        balls.forEach(ball => { ball.vx = 0; ball.vy = 0; });
        return;
      }

      if (player1Group === null) {
        if (turn === 'Player 1') {
          player1Group = b.type;
          player2Group = b.type === 'solids' ? 'stripes' : 'solids';
        } else {
          player2Group = b.type;
          player1Group = b.type === 'solids' ? 'stripes' : 'solids';
        }
        const myGroup = localRole === 'Player 1' ? player1Group : player2Group;
        document.getElementById('groupDisplay').innerText = myGroup ? myGroup.toUpperCase() : 'OPEN TABLE';
      }

      const activeGroup = turn === 'Player 1' ? player1Group : player2Group;
      if (b.type === activeGroup) {
        turnPocketedValid = true;
        showToast("Valid ball – keep shooting");
      } else {
        showToast("Opponent's ball");
      }
    }

    // ===== RE-RACK =====
    async function rackEm() {
      if (isAnyBallMoving()) {
        showToast("Wait for the balls to stop");
        return;
      }
      clearShotTimer();
      generateInitialRack();
      turn = 'Player 1';
      player1Group = null;
      player2Group = null;
      shotFired = false;
      scratched = false;
      gameOver = false;

      p1Device = null;
      p2Device = null;
      p1Name = null;
      p2Name = null;

      document.getElementById('groupDisplay').innerText = 'OPEN TABLE';
      document.getElementById('turnDisplay').innerText = 'PLAYER 1';
      document.getElementById('p1NameDisplay').innerText = 'P1: ---';
      document.getElementById('p2NameDisplay').innerText = 'P2: ---';

      await pushStateToServer();

      localRole = null;
      document.getElementById('myRoleDisplay').innerText = 'SELECTING...';
      document.getElementById('roleModal').style.display = 'flex';
      document.getElementById('selectP1Btn').innerText = 'PLAY AS PLAYER 1';
      document.getElementById('selectP2Btn').innerText = 'PLAY AS PLAYER 2';

      showToast("Table re-racked – seats are free");
    }

    async function pushStateToServer() {
      try {
        const payloadState = {
          balls: balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, num: b.num, isCue: b.isCue, color: b.color, type: b.type, isStripe: b.isStripe, r: b.r })),
          turn, player1Group, player2Group,
          p1Device, p2Device, p1Name, p2Name,
          gameOver,
          bigPockets          // ← this is what makes the pocket size global
        };
        await supabaseClient
          .from('pool_games')
          .upsert({ room_code: roomCode, game_state: payloadState, updated_at: new Date() }, { onConflict: 'room_code' });
      } catch (e) {
        console.error(e);
      }
    }

    async function initMultiplayer() {
      try {
        let { data } = await supabaseClient.from('pool_games').select('*').eq('room_code', roomCode);
        
        if (!data || data.length === 0) {
          generateInitialRack();
          await supabaseClient.from('pool_games').upsert({
            room_code: roomCode,
            game_state: {
              balls: balls.map(b => ({...b})),
              turn, player1Group, player2Group,
              p1Device: null, p2Device: null, p1Name: null, p2Name: null,
              gameOver: false,
              bigPockets: true
            },
            updated_at: new Date()
          }, { onConflict: 'room_code' });
          p1Device = p2Device = p1Name = p2Name = null;
          bigPockets = true;
        } else {
          let state = data[0].game_state || {};
          p1Device = state.p1Device || null;
          p2Device = state.p2Device || null;
          p1Name = state.p1Name || null;
          p2Name = state.p2Name || null;
          gameOver = state.gameOver || false;
          bigPockets = state.bigPockets !== undefined ? state.bigPockets : true;
          applyRemoteState(state);
        }

        updatePocketUI();

        if (p1Device === deviceId) {
          localRole = 'Player 1';
          localName = p1Name || localName;
          activateConnection();
          return;
        } else if (p2Device === deviceId) {
          localRole = 'Player 2';
          localName = p2Name || localName;
          activateConnection();
          return;
        }

        document.getElementById('modalRoomName').innerText = roomCode;
        document.getElementById('selectP1Btn').disabled = false;
        document.getElementById('selectP2Btn').disabled = false;
        document.getElementById('selectP1Btn').innerText = p1Device ? 'TAKE PLAYER 1 SEAT' : 'PLAY AS PLAYER 1';
        document.getElementById('selectP2Btn').innerText = p2Device ? 'TAKE PLAYER 2 SEAT' : 'PLAY AS PLAYER 2';
        document.getElementById('roleModal').style.display = 'flex';

      } catch (e) {
        document.getElementById('syncStatus').innerText = 'SYNC ERROR';
        document.getElementById('syncStatus').style.color = '#ff3333';
      }
    }

    async function claimRole(role) {
      const nameInput = document.getElementById('playerNameInput').value.trim();
      if (!nameInput && role !== 'Spectator') {
        showToast('Please enter a name');
        return;
      }

      localRole = role;
      localName = nameInput || 'Player';
      localStorage.setItem('pool_player_name', localName);
      document.getElementById('roleModal').style.display = 'none';

      let { data } = await supabaseClient.from('pool_games').select('game_state').eq('room_code', roomCode);
      let state = (data && data[0] && data[0].game_state) ? data[0].game_state : {};

      if (role === 'Player 1') {
        state.p1Device = deviceId;
        state.p1Name = localName;
      }
      if (role === 'Player 2') {
        state.p2Device = deviceId;
        state.p2Name = localName;
      }

      p1Device = state.p1Device;
      p2Device = state.p2Device;
      p1Name = state.p1Name;
      p2Name = state.p2Name;

      await supabaseClient.from('pool_games').upsert({
        room_code: roomCode,
        game_state: state,
        updated_at: new Date()
      }, { onConflict: 'room_code' });

      activateConnection();
      showToast(`${localName} joined as ${role}`);
      if (turn === localRole) startShotTimer();
    }

    function activateConnection() {
      updateRoleUI();
      document.getElementById('syncStatus').innerText = 'CONNECTED';
      document.getElementById('syncStatus').style.color = '#00ff66';

      if (realTimeChannel) supabaseClient.removeChannel(realTimeChannel);

      realTimeChannel = supabaseClient
        .channel(`room_${roomCode}`)
        .on('postgres_changes', {
          event: '*', schema: 'public', table: 'pool_games',
          filter: `room_code=eq.${roomCode}`
        }, (payload) => {
          if (payload.new && payload.new.game_state) {
            applyRemoteState(payload.new.game_state);
          }
        })
        .subscribe();

      if (window.syncPollInterval) clearInterval(window.syncPollInterval);
      window.syncPollInterval = setInterval(async () => {
        try {
          let { data } = await supabaseClient.from('pool_games').select('game_state').eq('room_code', roomCode);
          if (data && data[0] && data[0].game_state) {
            applyRemoteState(data[0].game_state);
          }
        } catch(e) {}
      }, 1000);

      if (turn === localRole && !gameOver) startShotTimer();
    }

    function updateRoleUI() {
      const roleDisp = document.getElementById('myRoleDisplay');
      if (localRole === 'Spectator') {
        roleDisp.innerText = 'SPECTATOR';
        roleDisp.style.color = '#ff007a';
      } else {
        roleDisp.innerText = (localName || localRole).toUpperCase();
        roleDisp.style.color = localRole === 'Player 1' ? '#00ffcc' : '#ffe600';
      }
      document.getElementById('p1NameDisplay').innerText = `P1: ${p1Name || '---'}`;
      document.getElementById('p2NameDisplay').innerText = `P2: ${p2Name || '---'}`;
    }

    function applyRemoteState(remoteState) {
      const oldTurn = turn;

      if (remoteState.p1Device !== undefined) p1Device = remoteState.p1Device;
      if (remoteState.p2Device !== undefined) p2Device = remoteState.p2Device;
      if (remoteState.p1Name !== undefined) p1Name = remoteState.p1Name;
      if (remoteState.p2Name !== undefined) p2Name = remoteState.p2Name;
      if (remoteState.gameOver !== undefined) gameOver = remoteState.gameOver;

      // Global pocket size
      if (remoteState.bigPockets !== undefined) {
        bigPockets = remoteState.bigPockets;
        updatePocketUI();
      }

      document.getElementById('p1NameDisplay').innerText = `P1: ${p1Name || '---'}`;
      document.getElementById('p2NameDisplay').innerText = `P2: ${p2Name || '---'}`;

      if (localRole === 'Player 1' && p1Device !== deviceId) {
        localRole = null;
        clearShotTimer();
        document.getElementById('roleModal').style.display = 'flex';
        document.getElementById('myRoleDisplay').innerText = 'SELECTING...';
      }
      if (localRole === 'Player 2' && p2Device !== deviceId) {
        localRole = null;
        clearShotTimer();
        document.getElementById('roleModal').style.display = 'flex';
        document.getElementById('myRoleDisplay').innerText = 'SELECTING...';
      }

      if (remoteState.balls && Array.isArray(remoteState.balls) && remoteState.balls.length > 0 && !isAnyBallMoving() && !shotFired) {
        balls = remoteState.balls.map(rb => ({...rb}));
        cueBall = balls.find(b => b.isCue) || cueBall;
      }

      if (remoteState.turn) {
        turn = remoteState.turn;
        document.getElementById('turnDisplay').innerText = turn === 'Player 1' ? (p1Name || 'PLAYER 1') : (p2Name || 'PLAYER 2');
        if (turn !== oldTurn && turn === localRole && !gameOver) {
          startShotTimer();
        }
      }

      if (remoteState.player1Group !== undefined) {
        player1Group = remoteState.player1Group;
        player2Group = remoteState.player2Group;
        if (player1Group) {
          const myGroup = localRole === 'Player 1' ? player1Group : player2Group;
          document.getElementById('groupDisplay').innerText = myGroup ? myGroup.toUpperCase() : 'OPEN TABLE';
        } else {
          document.getElementById('groupDisplay').innerText = 'OPEN TABLE';
        }
      }
    }

    function updateGame() {
      if (gameOver) {
        drawTable();
        requestAnimationFrame(updateGame);
        return;
      }

      let currentPocketRadius = getPocketRadius();
      for (let i = balls.length - 1; i >= 0; i--) {
        let b = balls[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.988;
        b.vy *= 0.988;
        if (Math.abs(b.vx) < 0.02) b.vx = 0;
        if (Math.abs(b.vy) < 0.02) b.vy = 0;

        if (b.x - b.r < 20) { b.x = 20 + b.r; b.vx *= -1; }
        if (b.x + b.r > 340) { b.x = 340 - b.r; b.vx *= -1; }
        if (b.y - b.r < 20) { b.y = 20 + b.r; b.vy *= -1; }
        if (b.y + b.r > 170) { b.y = 170 - b.r; b.vy *= -1; }

        pockets.forEach(p => {
          if (Math.hypot(b.x - p.x, b.y - p.y) < currentPocketRadius + 2) {
            if (b.isCue) {
              b.x = 95; b.y = 95; b.vx = 0; b.vy = 0;
              scratched = true;
              showToast("Cue ball scratched!");
            } else {
              handleBallPocketed(b);
              balls.splice(i, 1);
            }
          }
        });
      }

      // collisions
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          let b1 = balls[i], b2 = balls[j];
          let dx = b2.x - b1.x, dy = b2.y - b1.y;
          let dist = Math.hypot(dx, dy);
          let minDist = b1.r + b2.r;
          if (dist < minDist && dist > 0) {
            let nx = dx / dist, ny = dy / dist;
            let overlap = minDist - dist;
            b1.x -= nx * overlap * 0.5; b1.y -= ny * overlap * 0.5;
            b2.x += nx * overlap * 0.5; b2.y += ny * overlap * 0.5;
            let kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
            let p = 2 * (nx * kx + ny * ky) / 2;
            if (p > 0) {
              b1.vx -= p * nx * 0.96; b1.vy -= p * ny * 0.96;
              b2.vx += p * nx * 0.96; b2.vy += p * ny * 0.96;
            }
          }
        }
      }

      if (shotFired && !isAnyBallMoving()) {
        shotFired = false;
        let keepsTurn = turnPocketedValid && !scratched;
        if (!keepsTurn) {
          turn = turn === 'Player 1' ? 'Player 2' : 'Player 1';
          document.getElementById('turnDisplay').innerText = turn === 'Player 1' ? (p1Name || 'PLAYER 1') : (p2Name || 'PLAYER 2');
        } else {
          showToast("Keep shooting!");
        }
        pushStateToServer();
        if (turn === localRole && !gameOver) startShotTimer();
        else clearShotTimer();
      }

      drawTable();
      requestAnimationFrame(updateGame);
    }

    function drawTable() {
      let currentPocketRadius = getPocketRadius();
      ctx.fillStyle = '#0f5220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      pockets.forEach(p => {
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(p.x, p.y, currentPocketRadius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.strokeStyle = '#4a2c11';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, canvas.width - 14, canvas.height - 14);

      balls.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        if (b.isStripe) {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r * 0.55, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if (!isAnyBallMoving() && !shotFired && !gameOver) {
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(cueBall.x, cueBall.y);
        ctx.lineTo(cueBall.x + Math.cos(aimAngle) * 65, cueBall.y + Math.sin(aimAngle) * 65);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    updateGame();
    initMultiplayer();
  </script>
</body>
</html>
