<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Degen Spaceship Cockpit - Crisp Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            position: fixed;
            -webkit-font-smoothing: antialiased; /* Crisp font rendering */
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Subtle Clean Scanlines */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 999;
            background-size: 100% 3px;
            pointer-events: none;
        }

        .cockpit-view {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #030407;
            position: relative;
        }

        /* --- UPPER VIEWPORT WINDOW --- */
        .window-frame {
            flex: 1.2;
            background: #010205;
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 97% 100%, 3% 100%);
            border-bottom: 6px solid #080c14;
        }

        .stars {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(white 1.5px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.9;
            z-index: 1;
            animation: drift-stars 120s linear infinite;
        }
        @keyframes drift-stars {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        .distant-moon {
            position: absolute;
            width: min(220px, 45vw);
            height: min(220px, 45vw);
            background: radial-gradient(circle at 35% 35%, #94a3b8 0%, #334155 50%, #0f172a 90%);
            border-radius: 50%;
            top: 30%;
            left: 55%;
            transform: translate(-50%, -50%);
            box-shadow: inset -25px -25px 40px rgba(0, 0, 0, 0.9), 0 0 35px rgba(56, 189, 248, 0.2);
            z-index: 2;
        }

        .moon-crater {
            position: absolute;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 50%;
        }
        .mc1 { width: 25%; height: 12%; top: 25%; left: 25%; transform: rotate(-15deg); }
        .mc2 { width: 18%; height: 16%; top: 55%; left: 50%; }
        .mc3 { width: 30%; height: 14%; top: 45%; left: 15%; transform: rotate(20deg); }

        .distant-flag {
            position: absolute;
            top: 40%;
            left: 45%;
            font-size: min(24px, 6vw);
            z-index: 3;
        }


        /* --- LOWER DASHBOARD --- */
        .dashboard {
            min-height: 290px;
            max-height: 440px;
            background: linear-gradient(180deg, #0d111a 0%, #030407 100%);
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            padding: 12px;
            gap: 12px;
            border-top: 4px solid #1e293b;
            box-shadow: inset 0 25px 35px rgba(0,0,0,0.9);
            position: relative;
            z-index: 10;
        }

        .console-panel {
            background: #06090f;
            border: 2px solid #1e293b;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* CRISP Screens - No blur */
        .screen-monitor {
            width: 100%;
            height: clamp(95px, 14vh, 140px);
            background: #00040a;
            border: 2px solid #0284c7;
            border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(2, 132, 199, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .screen-content {
            color: #38bdf8;
            font-size: clamp(10px, 1.3vw, 12px);
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1.5;
            text-align: center;
            padding: 4px;
        }

        .center-console {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #080c14;
            border: 2px solid #27272a;
            border-radius: 6px;
            padding: 8px;
        }

        .warning-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            width: 100%;
            background: #020305;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #3f3f46;
        }

        .warn-light {
            height: clamp(14px, 2.5vh, 20px);
            background: #dc2626;
            border-radius: 2px;
            animation: pulse-light 1.5s infinite alternate;
        }
        .warn-light.orange {
            background: #ea580c;
        }
        @keyframes pulse-light {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* --- INTERACTIVE DIALS (Fixed & Working) --- */
        .dials-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 8px;
        }
        .dial-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .dial-label {
            font-size: 9px;
            color: #94a3b8;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .dial {
            width: clamp(50px, 9vw, 65px);
            height: clamp(50px, 9vw, 65px);
            border: 3px solid #64748b;
            border-radius: 50%;
            background: radial-gradient(circle, #0f172a 0%, #020617 80%);
            position: relative;
            box-shadow: inset 0 0 8px #000;
            cursor: pointer;
            touch-action: manipulation;
        }
        .dial::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px dashed #334155;
            border-radius: 50%;
        }
        .dial-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 42%;
            background: #22c55e;
            transform-origin: top center;
            transform: translate(-50%, 0) rotate(0deg);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .copium-dial .dial-needle {
            background: #a855f7;
        }
        .dial-value {
            font-size: 10px;
            color: #fff;
            font-weight: bold;
        }

        .switch-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .toggle-switch {
            height: 14px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 2px;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .action-btn {
            display: block;
            border: none;
            padding: clamp(6px, 1.5vh, 9px);
            border-radius: 4px;
            font-weight: bold;
            font-family: monospace;
            font-size: clamp(10px, 1.2vw, 11px);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            text-align: center;
            text-decoration: none;
            touch-action: manipulation;
        }
        
        .cmd-btn { background: #0ea5e9; color: #000; }
        .cmd-btn:hover { background: #38bdf8; }

        .wen-btn { background: #eab308; color: #000; }
        .wen-btn:hover { background: #facc15; }

        .return-btn { background: #22c55e; color: #000; }
        .return-btn:hover { background: #16a34a; }


        /* --- TERMINAL WINDOW --- */
        .cmd-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .cmd-window {
            width: min(650px, 100%);
            height: min(440px, 90vh);
            background: #020408;
            border: 2px solid #22c55e;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .cmd-header {
            background: #051b11;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #22c55e;
            color: #22c55e;
            font-weight: bold;
            font-size: 11px;
        }
        .cmd-close {
            background: #dc2626;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }
        .cmd-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            color: #22c55e;
            font-size: 12px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
        }
        .cmd-input-line {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #030806;
            border-top: 1px solid #14532d;
        }
        .cmd-input-line span { color: #22c55e; font-weight: bold; font-size: 11px; }
        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #22c55e;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            outline: none;
        }
        .prompt-list-help {
            color: #38bdf8;
            margin-bottom: 6px;
            border-bottom: 1px dashed #1e293b;
            padding-bottom: 6px;
        }

        /* --- MOBILE LAYOUT ADJUSTMENTS --- */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, auto);
                max-height: 58vh;
                overflow-y: auto;
                gap: 8px;
                padding: 8px;
            }
            .console-panel { height: 115px; }
            .screen-monitor { height: 50px; }
            .switch-grid { display: none; }
            .center-console { height: auto; padding: 6px; }
            .warning-grid { grid-template-columns: repeat(4, 1fr); }
            .window-frame { clip-path: none; border-bottom: 3px solid #080c14; }
        }
    </style>
</head>
<body>

    <div class="cockpit-view">
        <!-- TOP VIEWPORT WINDOW -->
        <div class="window-frame">
            <div class="stars"></div>
            <div class="distant-moon">
                <div class="moon-crater mc1"></div>
                <div class="moon-crater mc2"></div>
                <div class="moon-crater mc3"></div>
                <div class="distant-flag">🇺🇸</div>
            </div>
        </div>

        <!-- LOWER INSTRUMENT DASHBOARD -->
        <div class="dashboard">
            <!-- Left Console Panel -->
            <div class="console-panel">
                <div class="screen-monitor">
                    <div class="screen-content">
                        [SYSTEM: ULTRA_DEGEN]<br>
                        LIQUIDATION RISK: 99.8%<br>
                        STATUS: FULL SEND 🚀
                    </div>
                </div>
                <div class="switch-grid">
                    <div class="toggle-switch"></div>
                    <div class="toggle-switch" style="background: #7f1d1d;"></div>
                    <div class="toggle-switch"></div>
                    <div class="toggle-switch"></div>
                </div>
            </div>

            <!-- Center Console Panel (Dials & Warnings) -->
            <div class="center-console">
                <div class="warning-grid">
                    <div class="warn-light"></div>
                    <div class="warn-light orange"></div>
                    <div class="warn-light"></div>
                    <div class="warn-light orange"></div>
                    <div class="warn-light"></div>
                    <div class="warn-light orange"></div>
                    <div class="warn-light"></div>
                    <div class="warn-light orange"></div>
                </div>

                <!-- Interactive Dials for Hopium & Copium -->
                <div class="dials-container">
                    <div class="dial-box">
                        <span class="dial-label">HOPIUM</span>
                        <div class="dial" onclick="boostDial('hopium')" ontouchstart="boostDial('hopium')">
                            <div class="dial-needle" id="hopium-needle"></div>
                        </div>
                        <span class="dial-value" id="hopium-val">420%</span>
                    </div>

                    <div class="dial-box">
                        <span class="dial-label">COPIUM</span>
                        <div class="dial copium-dial" onclick="boostDial('copium')" ontouchstart="boostDial('copium')">
                            <div class="dial-needle" id="copium-needle"></div>
                        </div>
                        <span class="dial-value" id="copium-val">69%</span>
                    </div>
                </div>
            </div>

            <!-- Right Console Panel -->
            <div class="console-panel">
                <div class="screen-monitor" style="border-color: #0369a1;">
                    <div class="screen-content" style="color: #34d399;">
                        * TERMINAL READY *<br>
                        CORE TEMP: MELTING<br>
                        BRAINCELLS: 0
                    </div>
                </div>
                <div class="switch-grid">
                    <div class="toggle-switch"></div>
                    <div class="toggle-switch"></div>
                    <div class="toggle-switch" style="background: #14532d;"></div>
                    <div class="toggle-switch"></div>
                </div>
                
                <div class="action-btns">
                    <button class="action-btn cmd-btn" onclick="openTerminal()">Terminal 💻</button>
                    <button class="action-btn wen-btn" onclick="triggerWen()">WEN? 🪙</button>
                    <a href="index.html" class="action-btn return-btn">Bar 🍻</a>
                </div>
            </div>
        </div>
    </div>

    <!-- CMD TERMINAL MODAL WINDOW -->
    <div class="cmd-overlay" id="cmdOverlay">
        <div class="cmd-window">
            <div class="cmd-header">
                <span>DEGEN-OS v6.9.420</span>
                <button class="cmd-close" onclick="closeTerminal()">[X]</button>
            </div>
            <div class="cmd-body" id="cmdBody">
                <div class="prompt-list-help">
                    SYSTEM ONLINE. Tap or type a command:<br>
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('market')">market</b> | 
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('wife')">wife</b> | 
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('strategy')">strategy</b> | 
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('vibe')">vibe</b> | 
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('wen')">wen</b>
                </div>
            </div>
            <div class="cmd-input-line">
                <span>C:\DEGEN\></span>
                <input type="text" class="cmd-input" id="cmdInput" placeholder="type command..." onkeydown="handleCmd(event)">
            </div>
        </div>
    </div>

    <script>
        // --- WORKING DIAL LOGIC ---
        let hopiumDeg = 45;
        let hopiumLevel = 420;
        let copiumDeg = -30;
        let copiumLevel = 69;

        function boostDial(type) {
            if (type === 'hopium') {
                hopiumDeg = (hopiumDeg + 55) % 360;
                hopiumLevel += 133.7;
                document.getElementById('hopium-needle').style.transform = `translate(-50%, 0) rotate(${hopiumDeg}deg)`;
                document.getElementById('hopium-val').innerText = Math.floor(hopiumLevel) + '%';
            } else {
                copiumDeg = (copiumDeg + 55) % 360;
                copiumLevel += 88.8;
                document.getElementById('copium-needle').style.transform = `translate(-50%, 0) rotate(${copiumDeg}deg)`;
                document.getElementById('copium-val').innerText = Math.floor(copiumLevel) + '%';
            }
        }

        // --- WEN EASTER EGG BUTTON ---
        function triggerWen() {
            openTerminal();
            runPreset('wen');
        }

        // --- TERMINAL LOGIC ---
        function openTerminal() {
            document.getElementById('cmdOverlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('cmdInput').focus(); }, 100);
        }

        function closeTerminal() {
            document.getElementById('cmdOverlay').style.display = 'none';
        }

        function appendToTerminal(text, isUser = false) {
            const body = document.getElementById('cmdBody');
            const div = document.createElement('div');
            div.style.color = isUser ? '#38bdf8' : '#22c55e';
            div.innerHTML = (isUser ? 'C:\\DEGEN\\> ' : '') + text;
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
        }

        function handleCmd(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('cmdInput');
                const val = input.value.trim().toLowerCase();
                if (!val) return;
                
                appendToTerminal(val, true);
                input.value = '';
                processCommand(val);
            }
        }

        function runPreset(cmd) {
            appendToTerminal(cmd, true);
            processCommand(cmd);
        }

        function processCommand(cmd) {
            const responses = {
                'wen': "WEN LAMBO? WEN MOON? WEN RECOVERY? Answer: Never. You are trapped in this cockpit forever because you bought a layer-3 meme chain token with a telegram channel of 4 people. Enjoy the view.",
                'market': "CRITICAL ALERT: Your portfolio is down 94% today. However, technical analysis confirms a macro-pennant wedge formation on the 4-second chart. We are literally one green candle away from generational wealth.",
                'wife': "QUERY ERROR: Significant other status unknown. Last recorded communication: 'Why is there a hardware wallet taped to the microwave?' Relationship sentiment index: -1000%.",
                'strategy': "STEP 1: Sell furniture on Facebook Marketplace to buy high-leverage microcap tokens. STEP 2: Stare blindly at a blank Excel sheet until your eyes bleed. STEP 3: Blame market makers.",
                'vibe': "CABIN ATMOSPHERE: Pure uncut terminal velocity psychosis. The oxygen mix has been entirely replaced by nitrogen and pure unadulterated hubris. Strap in.",
                'help': "AVAILABLE COMMANDS: 'wen', 'market', 'wife', 'strategy', 'vibe', 'liquidation', 'rug'. Type any word for immediate unhinged spiritual guidance.",
                'liquidation': "WARNING: Margin call incoming. Your long position has been violently deleted from existence by an exchange clerk named 'Chad_99' laughing in a Telegram group chat.",
                'rug': "ANALYSIS COMPLETE: The dev abandoned the project and spent the liquidity pool on a jet ski in Dubai. You now own a community-led bag of absolute air. Congrats."
            };

            let reply = responses[cmd];
            if (!reply) {
                const defaults = [
                    "ERROR 404: Brain cells not found. Try typing 'wen', 'market', or 'strategy'.",
                    "SYSTEM OVERRIDE: That command makes zero sense, but your confidence is inspiring. Buy more bags.",
                    "ANALYSIS: Absolute nonsense input received. Rerouting processing power to maximize leverage capacity.",
                    "FATAL EXCEPTION: You've been staring at charts too long. Go touch grass."
                ];
                reply = defaults[Math.floor(Math.random() * defaults.length)];
            }

            setTimeout(() => {
                appendToTerminal(reply);
            }, 300);
        }
    </script>
</body>
</html>
