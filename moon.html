<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rugged Club Minting DApp</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1a1a1a;
      border: 2px solid #00ff66;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      text-align: center;
      width: 350px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 15px 0;
      background: #0d0d0d;
      border: 1px solid #00ff66;
      color: #fff;
      border-radius: 6px;
      font-family: inherit;
    }
    button {
      background: #00ff66;
      color: #0d0d0d;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      text-transform: uppercase;
    }
    button:hover {
      background: #00cc52;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🦍 RUGGED CLUB MINT 🚀</h2>
    <p>Drop your wallet address, anon. Don't get rekt.</p>
    
    <input type="text" id="walletInput" placeholder="0x... Paste your bag holder address">
    <br>
    <button onclick="handleMint()">Ape In / Mint</button>

    <div id="status"></div>
  </div>

  <script>
    const EDGE_FUNCTION_URL = "https://xmiyrbgpfdiqarxsuhzi.supabase.co/functions/v1/swift-action";

    async function handleMint() {
      const wallet = document.getElementById('walletInput').value.trim();
      const statusDiv = document.getElementById('status');

      if (!wallet || !wallet.startsWith("0x")) {
        statusDiv.innerHTML = "⚠️ Nice try, smooth brain. Drop a valid 0x wallet address.";
        statusDiv.style.color = "#ff3333";
        return;
      }

      statusDiv.innerHTML = "Firing up the mint cannon from our bag... 🚀";
      statusDiv.style.color = "#ffcc00";

      try {
        // Send wallet address directly to the Edge Function to mint and log
        const response = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            ownerWallet: wallet
          })
        });

        const result = await response.json();
        
        if (!response.ok) {
          throw new Error(result.error || "Backend rejected the mint request.");
        }

        statusDiv.innerHTML = `✅ LFG! SUCCESSFULLY MINTED TO YOUR BAG! 🌕<br><small>Tx: ${result.txHash ? result.txHash.slice(0, 10) + '...' : 'Done'}</small>`;
        statusDiv.style.color = "#00ff66";

      } catch (err) {
        console.error(err);
        if (err.message && err.message.toLowerCase().includes("already minted")) {
          statusDiv.innerHTML = "🛑 HOLD UP BROTHER! You already minted your bag! Greedy ape detected!";
        } else {
          statusDiv.innerHTML = `❌ REXXXT! Transaction failed: ${err.message}`;
        }
        statusDiv.style.color = "#ff3333";
      }
    }
  </script>

</body>
</html>
