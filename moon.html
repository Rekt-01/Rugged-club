<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rug Club | Airdrop</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #080c09;
            color: #22c55e;
            overflow-x: hidden;
        }
        .title-font {
            font-family: 'VT323', monospace;
        }
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }
        .glow-btn {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            transition: all 0.2s ease-in-out;
        }
        .glow-btn:hover {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.7);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between scanline p-4 md:p-6">

    <!-- Top Header -->
    <header class="w-full max-w-md mx-auto flex justify-between items-center py-4 border-b border-green-900/50">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🦍</span>
            <span class="title-font text-2xl tracking-wider text-green-400 font-bold">RUG_CLUB</span>
        </div>
        <div class="text-xs px-2.5 py-1 rounded bg-green-950/60 border border-green-800 text-green-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            APECHAIN LIVE
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md mx-auto my-auto py-8">
        <div class="glow-box bg-black/80 rounded-xl p-6 md:p-8 text-center relative backdrop-blur-md">
            
            <!-- Icon / Graphic -->
            <div class="text-5xl mb-3 animate-bounce">🚀</div>
            
            <!-- Title -->
            <h1 class="title-font text-4xl md:text-5xl tracking-widest text-green-400 mb-2 uppercase">
                RUG CLUB AIRDROP
            </h1>
            
            <!-- Subtitle -->
            <p class="text-green-500/80 text-sm md:text-base mb-6">
                Drop your wallet address, anon.<br>Don't get rekt.
            </p>

            <!-- Mint Form -->
            <form id="mintForm" class="space-y-4">
                <div class="relative">
                    <input 
                        type="text" 
                        id="walletAddress" 
                        placeholder="0x... paste your wallet address" 
                        required
                        class="w-full bg-green-950/20 border border-green-800/60 rounded-lg px-4 py-3.5 text-green-300 placeholder-green-700 focus:outline-none focus:border-green-400 focus:ring-1 focus:ring-green-400 text-sm md:text-base tracking-wider"
                    >
                </div>

                <button 
                    type="submit" 
                    id="mintBtn"
                    class="w-full glow-btn bg-green-500 hover:bg-green-400 text-black font-bold uppercase tracking-wider py-4 rounded-lg text-base md:text-lg transition cursor-pointer flex items-center justify-center space-x-2"
                >
                    <span>APE IN / MINT</span>
                </button>
            </form>

            <!-- Status / Feedback Box -->
            <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg border text-sm transition-all">
                <!-- Dynamically populated via JS -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mx-auto text-center py-4 text-xs text-green-700 border-t border-green-900/50">
        &copy; 2026 RUG_CLUB. SECURE AIRDROP PROTOCOL.
    </footer>

    <!-- Frontend Scripting Logic -->
    <script>
        const mintForm = document.getElementById('mintForm');
        const mintBtn = document.getElementById('mintBtn');
        const walletInput = document.getElementById('walletAddress');
        const statusMessage = document.getElementById('statusMessage');

        mintForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const recipientAddress = walletInput.value.trim();

            // Basic validation check
            if (!recipientAddress.startsWith('0x') || recipientAddress.length !== 42) {
                showStatus('REXXXT! Transaction failed: Invalid wallet address provided.', 'error');
                return;
            }

            // Lock UI and show processing state
            setLoading(true);
            showStatus('PROCESSING... Sending NFT straight to your bag...', 'info');

            try {
                // REPLACE THIS URL WITH YOUR ACTUAL SUPABASE EDGE FUNCTION ENDPOINT
                const SUPABASE_FUNCTION_URL = 'https://YOUR_PROJECT_ID.supabase.co/functions/v1/mint-nft';

                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ recipientAddress })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showStatus('GO CHECK YOUR WALLET! 🚀 NFT airdropped successfully.', 'success');
                    walletInput.value = ''; // Clear input on success
                } else {
                    throw new Error(data.error || 'Unknown server error occurred.');
                }

            } catch (err) {
                console.error(err);
                showStatus(`REXXXT! Mint failed: ${err.message}`, 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            if (isLoading) {
                mintBtn.disabled = true;
                mintBtn.innerHTML = '<span class="animate-pulse">MINTING ON-CHAIN...</span>';
                mintBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                mintBtn.disabled = false;
                mintBtn.innerHTML = 'APE IN / MINT';
                mintBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function showStatus(message, type) {
            statusMessage.classList.remove('hidden', 'border-green-500', 'bg-green-950/40', 'text-green-400', 'border-red-500', 'bg-red-950/40', 'text-red-400');
            
            if (type === 'success') {
                statusMessage.classList.add('border-green-500', 'bg-green-950/40', 'text-green-400');
            } else if (type === 'error') {
                statusMessage.classList.add('border-red-500', 'bg-red-950/40', 'text-red-400');
            } else {
                statusMessage.classList.add('border-green-800', 'bg-green-950/20', 'text-green-300');
            }

            statusMessage.textContent = message;
        }
    </script>
</body>
</html>
