<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Club - Zero-Gas NFT Claim</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0ea5e9;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            box-sizing: border-box;
            margin-bottom: 16px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        #statusMessage {
            margin-top: 16px;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Rugged Club</h2>
        <p>Paste your wallet address below and hit send to claim your free NFT on ApeChain.</p>

        <!-- Wallet Address Input & Send Button -->
        <input type="text" id="walletInput" placeholder="Paste your wallet address (0x...)" />
        <button class="btn" onclick="triggerClaim()">Send NFT</button>

        <div id="statusMessage"></div>
    </div>

    <script>
        // Your live Supabase Edge Function URL
        const SUPABASE_FUNCTION_URL = 'https://xmiyrbgpfdiqarxsuhzi.supabase.co/functions/v1/swift-action';

        async function triggerClaim() {
            const walletAddress = document.getElementById('walletInput').value.trim();
            const statusMsg = document.getElementById('statusMessage');

            // Basic validation for an Ethereum/ApeChain address format
            if (!walletAddress || !walletAddress.startsWith('0x') || walletAddress.length < 42) {
                statusMsg.style.color = "#f87171";
                statusMsg.innerText = "Please enter a valid 0x wallet address.";
                return;
            }

            statusMsg.style.color = "#38bdf8";
            statusMsg.innerText = "Processing your claim... Please wait.";

            try {
                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ userWallet: walletAddress })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusMsg.style.color = "#34d399";
                    statusMsg.innerText = "Success! NFT has been sent to your wallet.";
                    console.log("Transaction Hash:", data.txHash);
                } else {
                    statusMsg.style.color = "#f87171";
                    statusMsg.innerText = "Error: " + (data.error || "Claim failed.");
                }
            } catch (err) {
                console.error(err);
                statusMsg.style.color = "#f87171";
                statusMsg.innerText = "Network error connecting to backend.";
            }
        }
    </script>
</body>
</html>
