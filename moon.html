<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Degen Spaceship Cockpit - Elite Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #020205;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            -webkit-font-smoothing: antialiased;
        }
        
        /* CRT Scanline Overlay */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 999;
            background-size: 100% 3px;
            pointer-events: none;
        }

        .cockpit-view {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #020307;
            position: relative;
        }

        /* --- UPPER VIEWPORT WINDOW --- */
        .window-frame {
            height: 38vh;
            min-height: 180px;
            background: radial-gradient(circle at center, #070b19 0%, #010204 100%);
            position: relative;
            overflow: hidden;
            border-bottom: 6px solid #111827;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 5px 15px rgba(0,0,0,0.8);
        }

        .stars {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(white 1.5px, transparent 0);
            background-size: 35px 35px;
            opacity: 0.85;
            z-index: 1;
            animation: drift-stars 100s linear infinite;
        }
        @keyframes drift-stars {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        .distant-moon {
            position: absolute;
            width: min(170px, 38vw);
            height: min(170px, 38vw);
            background: radial-gradient(circle at 35% 35%, #94a3b8 0%, #334155 50%, #090d16 90%);
            border-radius: 50%;
            top: 45%;
            left: 55%;
            transform: translate(-50%, -50%);
            box-shadow: inset -20px -20px 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(56, 189, 248, 0.25);
            z-index: 2;
        }

        .moon-crater {
            position: absolute;
            background: rgba(10, 15, 25, 0.8);
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.9);
        }
        .mc1 { width: 26%; height: 14%; top: 25%; left: 22%; transform: rotate(-15deg); }
        .mc2 { width: 20%; height: 18%; top: 52%; left: 52%; }
        .mc3 { width: 32%; height: 15%; top: 42%; left: 15%; transform: rotate(20deg); }

        .distant-flag {
            position: absolute;
            top: 38%;
            left: 44%;
            font-size: min(22px, 5.5vw);
            z-index: 3;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
        }


        /* --- LOWER DASHBOARD (Fully Scrollable & Clean on Mobile) --- */
        .dashboard {
            flex: 1;
            background: linear-gradient(180deg, #0b0f19 0%, #04060a 100%);
            display: grid;
            grid-template-columns: 1fr 1.3fr 1fr;
            padding: 10px;
            gap: 10px;
            border-top: 3px solid #1f2937;
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.9);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            z-index: 10;
        }

        .console-panel {
            background: linear-gradient(145deg, #070a12, #04060a);
            border: 2px solid #1e293b;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 4px 6px rgba(0,0,0,0.4);
        }

        /* High-End Futuristic Screens */
        .screen-monitor {
            width: 100%;
            height: 85px;
            background: radial-gradient(circle, #001e3d 0%, #000814 100%);
            border: 2px solid #0284c7;
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(2, 132, 199, 0.4), 0 0 8px rgba(2, 132, 199, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .screen-monitor::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%);
            background-size: 100% 2px;
            pointer-events: none;
        }
        .screen-content {
            color: #38bdf8;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1.4;
            text-align: center;
            padding: 2px;
            text-shadow: 0 0 5px rgba(56, 189, 248, 0.8);
        }

        .center-console {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(145deg, #090e18, #05070d);
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .warning-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            width: 100%;
            background: #010204;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #1e293b;
        }

        .warn-light {
            height: 14px;
            background: #dc2626;
            border-radius: 2px;
            box-shadow: 0 0 6px #ef4444;
            animation: pulse-light 1.2s infinite alternate;
        }
        .warn-light.orange {
            background: #ea580c;
            box-shadow: 0 0 6px #f97316;
        }
        @keyframes pulse-light {
            0% { opacity: 0.4; }
            100% { opacity: 1; box-shadow: 0 0 10px #ff3300; }
        }

        /* --- INTERACTIVE DIALS --- */
        .dials-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 6px;
        }
        .dial-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .dial-label {
            font-size: 8px;
            color: #94a3b8;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .dial {
            width: 52px;
            height: 52px;
            border: 3px solid #475569;
            border-radius: 50%;
            background: radial-gradient(circle, #1e293b 0%, #020617 85%);
            position: relative;
            box-shadow: inset 0 0 8px #000, 0 3px 6px rgba(0,0,0,0.6);
            cursor: pointer;
            touch-action: manipulation;
        }
        .dial::before {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px dashed #64748b;
            border-radius: 50%;
        }
        .dial-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 38%;
            background: #22c55e;
            transform-origin: top center;
            transform: translate(-50%, 0) rotate(0deg);
            box-shadow: 0 0 6px #22c55e;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .copium-dial .dial-needle {
            background: #a855f7;
            box-shadow: 0 0 6px #a855f7;
        }
        .dial-value {
            font-size: 9px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 4px rgba(255,255,255,0.5);
        }

        .switch-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .toggle-switch {
            height: 12px;
            background: linear-gradient(90deg, #1e293b, #0f172a);
            border: 1px solid #475569;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Upgraded Slick Action Buttons */
        .action-btn {
            display: block;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 7px 4px;
            border-radius: 5px;
            font-weight: bold;
            font-family: monospace;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            text-align: center;
            text-decoration: none;
            touch-action: manipulation;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.3);
            transition: transform 0.1s ease;
        }
        .action-btn:active { transform: scale(0.96); }
        
        .cmd-btn { background: linear-gradient(180deg, #38bdf8, #0284c7); color: #000; text-shadow: 0 1px rgba(255,255,255,0.4); }
        .wen-btn { background: linear-gradient(180deg, #facc15, #ca8a04); color: #000; text-shadow: 0 1px rgba(255,255,255,0.4); }
        .return-btn { background: linear-gradient(180deg, #4ade80, #16a34a); color: #000; text-shadow: 0 1px rgba(255,255,255,0.4); }


        /* --- TERMINAL WINDOW MODAL --- */
        .cmd-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .cmd-window {
            width: min(650px, 100%);
            height: min(420px, 85vh);
            background: #020408;
            border: 2px solid #22c55e;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .cmd-header {
            background: #051b11;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #22c55e;
            color: #22c55e;
            font-weight: bold;
            font-size: 11px;
        }
        .cmd-close {
            background: #dc2626;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }
        .cmd-body {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            color: #22c55e;
            font-size: 11px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
        }
        .cmd-input-line {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #030806;
            border-top: 1px solid #14532d;
        }
        .cmd-input-line span { color: #22c55e; font-weight: bold; font-size: 11px; }
        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #22c55e;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            outline: none;
        }
        .prompt-list-help {
            color: #38bdf8;
            margin-bottom: 6px;
            border-bottom: 1px dashed #1e293b;
            padding-bottom: 6px;
        }

        /* --- MOBILE LAYOUT FIX --- */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, auto);
                gap: 8px;
                padding: 8px;
            }
            .console-panel { min-height: 125px; }
            .screen-monitor { height: 70px; }
            .switch-grid { display: none; } /* Reduces visual clutter on mobile screens */
            .window-frame { height: 32vh; }
        }
    </style>
</head>
<body>

    <div class="cockpit-view">
        <!-- TOP VIEWPORT WINDOW -->
        <div class="window-frame">
            <div class="stars"></div>
            <div class="distant-moon">
                <div class="moon-crater mc1"></div>
                <div class="moon-crater mc2"></div>
                <div class="moon-crater mc3"></div>
                <div class="distant-flag">🇺🇸</div>
            </div>
        </div>

        <!-- LOWER INSTRUMENT DASHBOARD -->
        <div class="dashboard">
            <!-- Left Console Panel -->
            <div class="console-panel">
                <div class="screen-monitor">
                    <div class="screen-content">
                        [SYSTEM: ULTRA_DEGEN]<br>
                        LIQUIDATION RISK: 99.8%<br>
                        STATUS: FULL SEND 🚀
                    </div>
                </div>
                <div class="switch-grid">
                    <div class="toggle-switch"></div>
                    <div class="toggle-switch" style="background: linear-gradient(90deg, #7f1d1d, #450a0a);"></div>
                    <div class="toggle-switch"></div>
                    <div class="toggle-switch"></div>
                </div>
            </div>

            <!-- Center Console Panel (Dials & Warnings) -->
            <div class="center-console">
                <div class="warning-grid">
                    <div class="warn-light"></div>
                    <div class="warn-light orange"></div>
                    <div class="warn-light"></div>
                    <div class="warn-light orange"></div>
                    <div class="warn-light"></div>
                    <div class="warn-light orange"></div>
                    <div class="warn-light"></div>
                    <div class="warn-light orange"></div>
                </div>

                <!-- Interactive Dials for Hopium & Copium -->
                <div class="dials-container">
                    <div class="dial-box">
                        <span class="dial-label">HOPIUM</span>
                        <div class="dial" onclick="boostDial('hopium')" ontouchstart="boostDial('hopium')">
                            <div class="dial-needle" id="hopium-needle"></div>
                        </div>
                        <span class="dial-value" id="hopium-val">420%</span>
                    </div>

                    <div class="dial-box">
                        <span class="dial-label">COPIUM</span>
                        <div class="dial copium-dial" onclick="boostDial('copium')" ontouchstart="boostDial('copium')">
                            <div class="dial-needle" id="copium-needle"></div>
                        </div>
                        <span class="dial-value" id="copium-val">69%</span>
                    </div>
                </div>
            </div>

            <!-- Right Console Panel -->
            <div class="console-panel">
                <div class="screen-monitor" style="border-color: #0369a1;">
                    <div class="screen-content" style="color: #34d399; text-shadow: 0 0 5px rgba(52,211,153,0.8);">
                        * TERMINAL READY *<br>
                        CORE TEMP: MELTING<br>
                        BRAINCELLS: 0
                    </div>
                </div>
                <div class="switch-grid">
                    <div class="toggle-switch"></div>
                    <div class="toggle-switch"></div>
                    <div class="toggle-switch" style="background: linear-gradient(90deg, #14532d, #052e16);"></div>
                    <div class="toggle-switch"></div>
                </div>
                
                <div class="action-btns">
                    <button class="action-btn cmd-btn" onclick="openTerminal()">Terminal 💻</button>
                    <button class="action-btn wen-btn" onclick="triggerWen()">WEN? 🪙</button>
                    <a href="index.html" class="action-btn return-btn">Bar 🍻</a>
                </div>
            </div>
        </div>
    </div>

    <!-- CMD TERMINAL WINDOW MODAL -->
    <div class="cmd-overlay" id="cmdOverlay">
        <div class="cmd-window">
            <div class="cmd-header">
                <span>DEGEN-OS v6.9.420</span>
                <button class="cmd-close" onclick="closeTerminal()">[X]</button>
            </div>
            <div class="cmd-body" id="cmdBody">
                <div class="prompt-list-help">
                    SYSTEM ONLINE. Tap/type a command:<br>
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('market')">market</b> | 
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('wife')">wife</b> | 
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('strategy')">strategy</b> | 
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('vibe')">vibe</b> | 
                    - <b style="cursor:pointer; color:#38bdf8;" onclick="runPreset('wen')">wen</b>
                </div>
            </div>
            <div class="cmd-input-line">
                <span>C:\DEGEN\></span>
                <input type="text" class="cmd-input" id="cmdInput" placeholder="type command..." onkeydown="handleCmd(event)">
            </div>
        </div>
    </div>

    <script>
        // --- DIAL LOGIC ---
        let hopiumDeg = 45;
        let hopiumLevel = 420;
        let copiumDeg = -30;
        let copiumLevel = 69;

        function boostDial(type) {
            if (type === 'hopium') {
                hopiumDeg = (hopiumDeg + 55) % 360;
                hopiumLevel += 133.7;
                document.getElementById('hopium-needle').style.transform = `translate(-50%, 0) rotate(${hopiumDeg}deg)`;
                document.getElementById('hopium-val').innerText = Math.floor(hopiumLevel) + '%';
            } else {
                copiumDeg = (copiumDeg + 55) % 360;
                copiumLevel += 88.8;
                document.getElementById('copium-needle').style.transform = `translate(-50%, 0) rotate(${copiumDeg}deg)`;
                document.getElementById('copium-val').innerText = Math.floor(copiumLevel) + '%';
            }
        }

        // --- WEN EASTER EGG ---
        function triggerWen() {
            openTerminal();
            runPreset('wen');
        }

        // --- TERMINAL LOGIC ---
        function openTerminal() {
            document.getElementById('cmdOverlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('cmdInput').focus(); }, 100);
        }

        function closeTerminal() {
            document.getElementById('cmdOverlay').style.display = 'none';
        }

        function appendToTerminal(text, isUser = false) {
            const body = document.getElementById('cmdBody');
            const div = document.createElement('div');
            div.style.color = isUser ? '#38bdf8' : '#22c55e';
            div.innerHTML = (isUser ? 'C:\\DEGEN\\> ' : '') + text;
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
        }

        function handleCmd(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('cmdInput');
                const val = input.value.trim().toLowerCase();
                if (!val) return;
                
                appendToTerminal(val, true);
                input.value = '';
                processCommand(val);
            }
        }

        function runPreset(cmd) {
            appendToTerminal(cmd, true);
            processCommand(cmd);
        }

        function processCommand(cmd) {
            const responses = {
                'wen': "WEN LAMBO? WEN MOON? WEN RECOVERY? Answer: Never. You are trapped in this cockpit forever because you bought a layer-3 meme chain token with a telegram channel of 4 people. Enjoy the view.",
                'market': "CRITICAL ALERT: Your portfolio is down 94% today. However, technical analysis confirms a macro-pennant wedge formation on the 4-second chart. We are literally one green candle away from generational wealth.",
                'wife': "QUERY ERROR: Significant other status unknown. Last recorded communication: 'Why is there a hardware wallet taped to the microwave?' Relationship sentiment index: -1000%.",
                'strategy': "STEP 1: Sell furniture on Facebook Marketplace to buy high-leverage microcap tokens. STEP 2: Stare blindly at a blank Excel sheet until your eyes bleed. STEP 3: Blame market makers.",
                'vibe': "CABIN ATMOSPHERE: Pure uncut terminal velocity psychosis. The oxygen mix has been entirely replaced by nitrogen and pure unadulterated hubris. Strap in.",
                'help': "AVAILABLE COMMANDS: 'wen', 'market', 'wife', 'strategy', 'vibe', 'liquidation', 'rug'. Type any word for immediate unhinged spiritual guidance.",
                'liquidation': "WARNING: Margin call incoming. Your long position has been violently deleted from existence by an exchange clerk named 'Chad_99' laughing in a Telegram group chat.",
                'rug': "ANALYSIS COMPLETE: The dev abandoned the project and spent the liquidity pool on a jet ski in Dubai. You now own a community-led bag of absolute air. Congrats."
            };

            let reply = responses[cmd];
            if (!reply) {
                const defaults = [
                    "ERROR 404: Brain cells not found. Try typing 'wen', 'market', or 'strategy'.",
                    "SYSTEM OVERRIDE: That command makes zero sense, but your confidence is inspiring. Buy more bags.",
                    "ANALYSIS: Absolute nonsense input received. Rerouting processing power to maximize leverage capacity.",
                    "FATAL EXCEPTION: You've been staring at charts too long. Go touch grass."
                ];
                reply = defaults[Math.floor(Math.random() * defaults.length)];
            }

            setTimeout(() => {
                appendToTerminal(reply);
            }, 300);
        }
    </script>
</body>
</html>
