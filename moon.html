<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUGGED CLUB | MOON ROOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #05050a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #2a0815 0%, #05050a 100%);
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.15);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        .badge {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        h2 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        h2 span {
            color: #ef4444;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .highlight {
            color: #f87171;
            font-weight: 600;
        }
        .graveyard-box {
            background: #090d16;
            border: 1px dashed #334155;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .graveyard-box h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #cbd5e1;
        }
        .timer {
            font-size: 20px;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 1px;
        }
        .btn {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            transform: translateY(-1px);
        }
        .footer-note {
            font-size: 12px;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">💀 MOON ROOM • LOCKED</div>
        <h2>TOO LATE, <span>SO SAD</span></h2>
        <p>You wandered off the path. The main claim portal on <span class="highlight">ApeChain</span> is elsewhere.</p>

        <div class="graveyard-box">
            <h3>Next Degen Play:</h3>
            <div class="timer" id="fakeTimer">SOON™</div>
        </div>

        <a href="index.html" class="btn">RETURN TO MAIN DROP 🚀</a>
        <p class="footer-note">Don't get lost next time.</p>
    </div>

    <script>
        let seconds = 69;
        setInterval(() => {
            seconds--;
            if (seconds <= 0) seconds = 420;
            document.getElementById('fakeTimer').innerText = `COMING NEVER (${seconds}s)`;
        }, 1000);
    </script>
</body>
</html>
