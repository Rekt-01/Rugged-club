<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Adventure Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 4px solid #444;
            background-color: #206020;
        }

        canvas {
            display: block;
            background-color: #206020;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .bar-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: white;
            border: 2px solid #fff;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            z-index: 10;
        }
        .bar-btn:hover { background: #c0392b; }

        /* Mobile Touch Controls */
        #touch-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            padding: 10px 20px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .dpad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 5px;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }
        .touch-btn:active, .touch-btn.pressed {
            background: rgba(255, 255, 255, 0.5);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }

        .actions {
            display: flex;
            align-items: center;
        }

        #btn-sword {
            width: 90px;
            height: 90px;
            background: rgba(231, 76, 60, 0.6);
            border: 2px solid #ff6b6b;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
        }
        #btn-sword:active {
            background: rgba(231, 76, 60, 0.9);
        }

        @media (min-width: 768px) {
            #touch-controls { display: none; } /* Hide on desktop if using keyboard */
        }
    </style>
</head>
<body>

    <div id="game-container">
        <a href="index.html" class="bar-btn">Return to Bar</a>
        <canvas id="gameCanvas" width="480" height="360"></canvas>
    </div>

    <!-- On-screen mobile touch pad -->
    <div id="touch-controls">
        <div class="dpad">
            <div class="touch-btn" id="btn-up">▲</div>
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-down">▼</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="actions">
            <div class="touch-btn" id="btn-sword">SWORD</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State
        let gameState = "PLAYING"; // PLAYING, WON, GAMEOVER
        let score = 0;
        let hasKey = false;

        // Player object
        const player = {
            x: 220,
            y: 280,
            width: 20,
            height: 24,
            speed: 2.5,
            dir: "DOWN", // UP, DOWN, LEFT, RIGHT
            hp: 6,       // 3 hearts (2 hp each)
            maxHp: 6,
            isAttacking: false,
            attackTimer: 0
        };

        // World Objects: Trees, Walls, Locked Door, Chest
        const obstacles = [
            // Border walls
            { x: 0, y: 0, w: 480, h: 20, type: "wall" },
            { x: 0, y: 340, w: 480, h: 20, type: "wall" },
            { x: 0, y: 0, w: 20, h: 360, type: "wall" },
            { x: 460, y: 0, w: 20, h: 360, type: "wall" },
            
            // Obstacles & Trees in the overworld
            { x: 100, y: 80, w: 60, h: 40, type: "tree" },
            { x: 300, y: 80, w: 80, h: 40, type: "tree" },
            { x: 100, y: 200, w: 40, h: 60, type: "tree" },
            { x: 320, y: 200, w: 60, h: 60, type: "tree" },

            // Dungeon structure center divider
            { x: 200, y: 140, w: 80, h: 20, type: "wall" },
            // Locked Door
            { x: 220, y: 140, w: 40, h: 20, type: "door", locked: true }
        ];

        // Key location
        let key = { x: 380, y: 60, w: 16, h: 16, collected: false };

        // Treasure Chest location
        const chest = { x: 232, y: 50, w: 24, h: 24, opened: false };

        // Enemies
        let enemies = [
            { x: 80, y: 150, w: 20, h: 20, speed: 1, hp: 2, dirTimer: 0, dx: 1, dy: 0 },
            { x: 380, y: 280, w: 20, h: 20, speed: 1.2, hp: 2, dirTimer: 0, dx: 0, dy: -1 },
            { x: 230, y: 90, w: 20, h: 20, speed: 1.5, hp: 2, dirTimer: 0, dx: -1, dy: 1 } // Inside dungeon
        ];

        // Input tracking
        const keys = { up: false, down: false, left: false, right: false };

        window.addEventListener("keydown", (e) => {
            if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = true;
            if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = true;
            if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
            if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
            if (e.code === "Space") triggerAttack();
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
            if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = false;
            if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
            if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
        });

        // Setup Touch Controls
        function bindTouch(id, keyName) {
            const el = document.getElementById(id);
            el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyName] = true; el.classList.add("pressed"); });
            el.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; el.classList.remove("pressed"); });
            el.addEventListener("mousedown", (e) => { keys[keyName] = true; el.classList.add("pressed"); });
            el.addEventListener("mouseup", (e) => { keys[keyName] = false; el.classList.remove("pressed"); });
        }
        bindTouch("btn-up", "up");
        bindTouch("btn-down", "down");
        bindTouch("btn-left", "left");
        bindTouch("btn-right", "right");

        document.getElementById("btn-sword").addEventListener("touchstart", (e) => { e.preventDefault(); triggerAttack(); });
        document.getElementById("btn-sword").addEventListener("mousedown", (e) => { triggerAttack(); });

        function triggerAttack() {
            if (gameState !== "PLAYING") return;
            if (!player.isAttacking) {
                player.isAttacking = true;
                player.attackTimer = 15; // Duration of sword frame
            }
        }

        // Collision checking helper
        function checkRectCollision(r1, r2) {
            return r1.x < r2.x + r2.w &&
                   r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h &&
                   r1.y + r1.h > r2.y;
        }

        function update() {
            if (gameState !== "PLAYING") return;

            // Handle Attack Timer
            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) {
                    player.isAttacking = false;
                }
            }

            // Player Movement
            let vx = 0;
            let vy = 0;
            if (keys.up) { vy = -player.speed; player.dir = "UP"; }
            if (keys.down) { vy = player.speed; player.dir = "DOWN"; }
            if (keys.left) { vx = -player.speed; player.dir = "LEFT"; }
            if (keys.right) { vx = player.speed; player.dir = "RIGHT"; }

            // Move X and check collision
            player.x += vx;
            let playerBox = { x: player.x, y: player.y, w: player.width, h: player.height };
            for (let obs of obstacles) {
                if (obs.type === "door" && obs.locked === false) continue; // Walk through unlocked door
                if (checkRectCollision(playerBox, obs)) {
                    if (obs.type === "door" && hasKey) {
                        obs.locked = false; // Open door!
                    } else {
                        player.x -= vx; // revert
                        break;
                    }
                }
            }

            // Move Y and check collision
            player.y += vy;
            playerBox = { x: player.x, y: player.y, w: player.width, h: player.height };
            for (let obs of obstacles) {
                if (obs.type === "door" && obs.locked === false) continue;
                if (checkRectCollision(playerBox, obs)) {
                    if (obs.type === "door" && hasKey) {
                        obs.locked = false;
                    } else {
                        player.y -= vy; // revert
                        break;
                    }
                }
            }

            // Check Key collection
            if (!key.collected && checkRectCollision(playerBox, key)) {
                key.collected = true;
                hasKey = true;
            }

            // Check Chest collection (Win Condition)
            if (hasKey && !chest.opened && checkRectCollision(playerBox, chest)) {
                chest.opened = true;
                gameState = "WON";
            }

            // Sword Attack Collision with Enemies
            if (player.isAttacking) {
                let swordBox = { x: player.x, y: player.y, w: player.width, h: player.height };
                if (player.dir === "UP") swordBox.y -= 20;
                if (player.dir === "DOWN") swordBox.y += 20;
                if (player.dir === "LEFT") swordBox.x -= 20;
                if (player.dir === "RIGHT") swordBox.x += 20;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (checkRectCollision(swordBox, enemies[i])) {
                        enemies[i].hp--;
                        if (enemies[i].hp <= 0) {
                            enemies.splice(i, 1); // Defeat enemy
                            score += 100;
                        }
                    }
                }
            }

            // Enemy AI & Movement
            for (let en of enemies) {
                en.dirTimer++;
                if (en.dirTimer > 80) {
                    en.dirTimer = 0;
                    const dirs = [{dx: 1, dy: 0}, {dx: -1, dy: 0}, {dx: 0, dy: 1}, {dx: 0, dy: -1}];
                    const chosen = dirs[Math.floor(Math.random() * dirs.length)];
                    en.dx = chosen.dx;
                    en.dy = chosen.dy;
                }

                en.x += en.dx * en.speed;
                let enBox = { x: en.x, y: en.y, w: en.w, h: en.h };
                for (let obs of obstacles) {
                    if (obs.type === "door" && obs.locked === false) continue;
                    if (checkRectCollision(enBox, obs)) { en.x -= en.dx * en.speed; en.dx *= -1; break; }
                }

                en.y += en.dy * en.speed;
                enBox = { x: en.x, y: en.y, w: en.w, h: en.h };
                for (let obs of obstacles) {
                    if (obs.type === "door" && obs.locked === false) continue;
                    if (checkRectCollision(enBox, obs)) { en.y -= en.dy * en.speed; en.dy *= -1; break; }
                }

                // Check damage to player
                if (checkRectCollision(playerBox, en)) {
                    player.hp--;
                    player.x -= en.dx * 15;
                    player.y -= en.dy * 15;
                    if (player.hp <= 0) {
                        gameState = "GAMEOVER";
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ground
            ctx.fillStyle = "#206020";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Obstacles
            for (let obs of obstacles) {
                if (obs.type === "tree") {
                    ctx.fillStyle = "#144014";
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = "#1e7a1e";
                    ctx.fillRect(obs.x + 4, obs.y + 4, obs.w - 8, obs.h - 8);
                } else if (obs.type === "wall") {
                    ctx.fillStyle = "#555555";
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = "#333333";
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                } else if (obs.type === "door") {
                    if (obs.locked) {
                        ctx.fillStyle = "#8b4513";
                        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                        ctx.fillStyle = "#f1c40f";
                        ctx.fillRect(obs.x + 16, obs.y + 6, 8, 8);
                    }
                }
            }

            // Draw Key
            if (!key.collected) {
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(key.x + 4, key.y + 4, 8, 8);
                ctx.fillRect(key.x + 2, key.y + 10, 12, 4);
            }

            // Draw Chest
            ctx.fillStyle = chest.opened ? "#27ae60" : "#d35400";
            ctx.fillRect(chest.x, chest.y, chest.w, chest.h);
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(chest.x + 8, chest.y + 8, 8, 8);

            // Draw Enemies
            for (let en of enemies) {
                ctx.fillStyle = "#c0392b";
                ctx.fillRect(en.x, en.y, en.w, en.h);
                ctx.fillStyle = "#fff";
                ctx.fillRect(en.x + 3, en.y + 5, 4, 4);
                ctx.fillRect(en.x + 13, en.y + 5, 4, 4);
            }

            // Draw Player
            ctx.fillStyle = "#3498db";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Player Cap
            ctx.fillStyle = "#27ae60";
            if (player.dir === "UP") ctx.fillRect(player.x + 4, player.y, 12, 8);
            if (player.dir === "DOWN") ctx.fillRect(player.x + 4, player.y, 12, 8);
            if (player.dir === "LEFT") ctx.fillRect(player.x, player.y + 4, 8, 12);
            if (player.dir === "RIGHT") ctx.fillRect(player.x + 12, player.y + 4, 8, 12);

            // Draw Sword Slash
            if (player.isAttacking) {
                ctx.fillStyle = "#ecf0f1";
                let sx = player.x, sy = player.y, sw = 0, sh = 0;
                if (player.dir === "UP") { sx = player.x - 4; sy = player.y - 16; sw = 28; sh = 16; }
                if (player.dir === "DOWN") { sx = player.x - 4; sy = player.y + player.height; sw = 28; sh = 16; }
                if (player.dir === "LEFT") { sx = player.x - 16; sy = player.y - 4; sw = 16; sh = 32; }
                if (player.dir === "RIGHT") { sx = player.x + player.width; sy = player.y - 4; sw = 16; sh = 32; }
                ctx.fillRect(sx, sy, sw, sh);
            }

            // Draw HUD
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, canvas.width, 35);

            for (let i = 0; i < player.maxHp / 2; i++) {
                let hx = 20 + i * 25;
                let hy = 10;
                ctx.fillStyle = (i * 2 < player.hp) ? "#e74c3c" : "#555";
                ctx.font = "16px sans-serif";
                ctx.fillText("❤️", hx, hy + 14);
            }

            ctx.fillStyle = "#fff";
            ctx.font = "12px 'Courier New'";
            ctx.fillText("KEY: " + (hasKey ? "🔑 (UNLOCKED)" : "🔒 (NEEDED)"), 180, 22);
            ctx.fillText("SCORE: " + score, 360, 22);

            // Game Over / Win Screens
            if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 28px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "#fff";
                ctx.font = "14px 'Courier New'";
                ctx.fillText("Refresh page to try again", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
            } else if (gameState === "WON") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#f1c40f";
                ctx.font = "bold 28px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("VICTORY!", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "#fff";
                ctx.font = "14px 'Courier New'";
                ctx.fillText("You opened the treasure chest!", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
