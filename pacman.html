<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StarHopper - Free HTML5 Platformer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 850px;
    aspect-ratio: 16 / 9;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .hud {
    position: absolute;
    top: 12px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    font-weight: 700;
    font-size: 15px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .hud-group {
    display: flex;
    gap: 14px;
    align-items: center;
    background: rgba(15, 23, 42, 0.75);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    pointer-events: auto;
  }
  button.hud-btn {
    background: #334155;
    color: #fff;
    border: none;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.hud-btn:hover { background: #475569; }
  /* Mobile Touch Controls */
  .touch-controls {
    position: absolute;
    bottom: 14px;
    left: 16px;
    right: 16px;
    display: none;
    justify-content: space-between;
    pointer-events: none;
  }
  @media (pointer: coarse) {
    .touch-controls { display: flex; }
  }
  .touch-cluster { display: flex; gap: 12px; pointer-events: auto; }
  .touch-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.35);
    color: white;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    touch-action: manipulation;
  }
  .touch-btn:active { background: rgba(56, 189, 248, 0.5); }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="canvas" width="800" height="450"></canvas>

  <div class="hud">
    <div class="hud-group">
      <span id="ui-level">World 1-1</span>
      <span style="color:#fbbf24">★ <span id="ui-stars">0/0</span></span>
      <span style="color:#38bdf8">Score: <span id="ui-score">0</span></span>
    </div>
    <div class="hud-group">
      <button class="hud-btn" id="btn-mute">🔊 Sound</button>
      <button class="hud-btn" id="btn-restart">↻ Restart</button>
    </div>
  </div>

  <div class="touch-controls">
    <div class="touch-cluster">
      <div class="touch-btn" id="t-left">◀</div>
      <div class="touch-btn" id="t-right">▶</div>
    </div>
    <div class="touch-cluster">
      <div class="touch-btn" id="t-jump">▲</div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // UI Elements
  const uiLevel = document.getElementById('ui-level');
  const uiStars = document.getElementById('ui-stars');
  const uiScore = document.getElementById('ui-score');
  const btnMute = document.getElementById('btn-mute');
  const btnRestart = document.getElementById('btn-restart');

  // --- Web Audio Synth (100% Copyright-Free Procedural Sound) ---
  let audioCtx = null;
  let muted = false;

  function playSound(type) {
    if (muted) return;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'jump') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.14);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
      osc.start(now);
      osc.stop(now + 0.14);
    } else if (type === 'star') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.07);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
      osc.start(now);
      osc.stop(now + 0.22);
    } else if (type === 'stomp') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.12);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'spring') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(750, now + 0.22);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
      osc.start(now);
      osc.stop(now + 0.22);
    } else if (type === 'hurt') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(55, now + 0.25);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'win') {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + i * 0.08);
        g.gain.setValueAtTime(0.1, now + i * 0.08);
        g.gain.linearRampToValueAtTime(0.005, now + i * 0.08 + 0.2);
        o.start(now + i * 0.08);
        o.stop(now + i * 0.08 + 0.2);
      });
    }
  }

  btnMute.addEventListener('click', () => {
    muted = !muted;
    btnMute.textContent = muted ? '🔇 Muted' : '🔊 Sound';
    btnMute.blur();
  });

  // --- Input Handling ---
  const keys = { left: false, right: false, jump: false };
  let jumpPressedJustNow = false;

  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
    if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
      if (!keys.jump) jumpPressedJustNow = true;
      keys.jump = true;
      e.preventDefault();
    }
    if (['ArrowLeft', 'ArrowRight', 'ArrowDown'].includes(e.code)) e.preventDefault();
  });

  window.addEventListener('keyup', (e) => {
    if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
    if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) keys.jump = false;
  });

  // Touch Buttons
  const bindTouch = (id, keyName) => {
    const el = document.getElementById(id);
    const start = (e) => {
      e.preventDefault();
      if (keyName === 'jump' && !keys.jump) jumpPressedJustNow = true;
      keys[keyName] = true;
    };
    const end = (e) => { e.preventDefault(); keys[keyName] = false; };
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
  };
  bindTouch('t-left', 'left');
  bindTouch('t-right', 'right');
  bindTouch('t-jump', 'jump');

  // --- Level Definitions ---
  const LEVELS = [
    {
      name: "1-1: Emerald Valley",
      skyTop: "#0f172a", skyBot: "#1e3a5f",
      platColor: "#10b981", platTop: "#34d399",
      spawn: { x: 60, y: 320 },
      platforms: [
        { x: 0, y: 390, w: 500, h: 80 },
        { x: 570, y: 390, w: 420, h: 80 },
        { x: 240, y: 300, w: 120, h: 18 },
        { x: 430, y: 240, w: 130, h: 18 },
        { x: 680, y: 290, w: 140, h: 18 },
        { x: 1060, y: 340, w: 160, h: 18, vx: 2, minX: 1020, maxX: 1240 },
        { x: 1440, y: 390, w: 550, h: 80 },
        { x: 1580, y: 270, w: 140, h: 18 }
      ],
      springs: [
        { x: 920, y: 376, w: 32, h: 14 }
      ],
      spikes: [
        { x: 730, y: 376, w: 60, h: 14 }
      ],
      stars: [
        { x: 290, y: 260 }, { x: 485, y: 200 },
        { x: 740, y: 250 }, { x: 1140, y: 290 },
        { x: 1640, y: 230 }
      ],
      enemies: [
        { x: 620, y: 362, w: 28, h: 28, minX: 580, maxX: 710, vx: 1.6 },
        { x: 1500, y: 362, w: 28, h: 28, minX: 1460, maxX: 1750, vx: 2.0 }
      ],
      goal: { x: 1880, y: 320, w: 42, h: 70 }
    },
    {
      name: "1-2: Crystal Cavern",
      skyTop: "#1a103c", skyBot: "#3b1d5e",
      platColor: "#6366f1", platTop: "#a5b4fc",
      spawn: { x: 60, y: 320 },
      platforms: [
        { x: 0, y: 390, w: 340, h: 80 },
        { x: 400, y: 330, w: 130, h: 18, vy: 1.6, minY: 200, maxY: 360 },
        { x: 600, y: 240, w: 160, h: 18 },
        { x: 830, y: 350, w: 280, h: 100 },
        { x: 1180, y: 290, w: 140, h: 18, vx: 2.4, minX: 1150, maxX: 1380 },
        { x: 1550, y: 230, w: 130, h: 18 },
        { x: 1740, y: 370, w: 450, h: 90 }
      ],
      springs: [
        { x: 1050, y: 336, w: 32, h: 14 }
      ],
      spikes: [
        { x: 890, y: 336, w: 75, h: 14 },
        { x: 1860, y: 356, w: 60, h: 14 }
      ],
      stars: [
        { x: 455, y: 180 }, { x: 670, y: 200 },
        { x: 990, y: 290 }, { x: 1260, y: 240 },
        { x: 1605, y: 190 }, { x: 1960, y: 310 }
      ],
      enemies: [
        { x: 620, y: 212, w: 28, h: 28, minX: 605, maxX: 730, vx: 1.5 },
        { x: 1770, y: 342, w: 28, h: 28, minX: 1750, maxX: 1845, vx: 1.8 }
      ],
      goal: { x: 2090, y: 300, w: 42, h: 70 }
    },
    {
      name: "1-3: Solar Citadel",
      skyTop: "#31102f", skyBot: "#7c2d12",
      platColor: "#f59e0b", platTop: "#fde047",
      spawn: { x: 50, y: 320 },
      platforms: [
        { x: 0, y: 390, w: 280, h: 80 },
        { x: 340, y: 340, w: 110, h: 18, vx: 2.5, minX: 310, maxX: 520 },
        { x: 670, y: 290, w: 110, h: 18, vy: -2.0, minY: 170, maxY: 350 },
        { x: 860, y: 220, w: 180, h: 18 },
        { x: 1120, y: 370, w: 360, h: 90 },
        { x: 1550, y: 310, w: 120, h: 18, vx: 2.8, minX: 1520, maxX: 1760 },
        { x: 1920, y: 360, w: 420, h: 90 }
      ],
      springs: [
        { x: 220, y: 376, w: 32, h: 14 },
        { x: 1420, y: 356, w: 32, h: 14 }
      ],
      spikes: [
        { x: 920, y: 206, w: 60, h: 14 },
        { x: 1220, y: 356, w: 90, h: 14 }
      ],
      stars: [
        { x: 410, y: 280 }, { x: 715, y: 150 },
        { x: 890, y: 175 }, { x: 1010, y: 175 },
        { x: 1265, y: 290 }, { x: 1640, y: 250 },
        { x: 2060, y: 310 }
      ],
      enemies: [
        { x: 1140, y: 342, w: 28, h: 28, minX: 1125, maxX: 1205, vx: 1.8 },
        { x: 1320, y: 342, w: 28, h: 28, minX: 1315, maxX: 1405, vx: 2.0 },
        { x: 1960, y: 332, w: 28, h: 28, minX: 1935, maxX: 2180, vx: 2.5 }
      ],
      goal: { x: 2240, y: 290, w: 42, h: 70 }
    }
  ];

  // --- Game State ---
  let currentLevelIdx = 0;
  let score = 0;
  let levelData = null;
  let particles = [];
  let bannerTimer = 0;
  let bannerText = "";
  let cameraX = 0;

  const player = {
    x: 60, y: 300, w: 28, h: 34,
    vx: 0, vy: 0,
    onGround: false,
    coyoteTimer: 0,
    jumpsLeft: 2,
    facing: 1
  };

  function cloneLevel(idx) {
    const raw = LEVELS[idx];
    return {
      name: raw.name,
      skyTop: raw.skyTop,
      skyBot: raw.skyBot,
      platColor: raw.platColor,
      platTop: raw.platTop,
      spawn: { ...raw.spawn },
      platforms: raw.platforms.map(p => ({ ...p })),
      springs: raw.springs.map(s => ({ ...s, bounceAnim: 0 })),
      spikes: raw.spikes.map(s => ({ ...s })),
      stars: raw.stars.map(s => ({ ...s, collected: false, bob: Math.random() * 6 })),
      enemies: raw.enemies.map(e => ({ ...e, alive: true })),
      goal: { ...raw.goal }
    };
  }

  function loadLevel(idx, announce = true) {
    currentLevelIdx = idx % LEVELS.length;
    levelData = cloneLevel(currentLevelIdx);
    player.x = levelData.spawn.x;
    player.y = levelData.spawn.y;
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    player.jumpsLeft = 2;
    cameraX = 0;
    if (announce) {
      bannerText = levelData.name;
      bannerTimer = 110;
    }
    updateHUD();
  }

  function updateHUD() {
    uiLevel.textContent = levelData.name;
    const collected = levelData.stars.filter(s => s.collected).length;
    uiStars.textContent = `${collected}/${levelData.stars.length}`;
    uiScore.textContent = score;
  }

  btnRestart.addEventListener('click', () => {
    loadLevel(currentLevelIdx, true);
    btnRestart.blur();
  });

  function spawnParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 25 + Math.random() * 15,
        color,
        size: 3 + Math.random() * 3
      });
    }
  }

  function rectIntersect(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // --- Main Physics & Update Loop ---
  function update() {
    if (bannerTimer > 0) bannerTimer--;

    // 1. Update Moving Platforms
    for (const p of levelData.platforms) {
      if (p.vx) {
        p.x += p.vx;
        if (p.x < p.minX || p.x + p.w > p.maxX) p.vx *= -1;
      }
      if (p.vy) {
        p.y += p.vy;
        if (p.y < p.minY || p.y > p.maxY) p.vy *= -1;
      }
    }

    // 2. Horizontal Movement
    const accel = player.onGround ? 0.65 : 0.42;
    const maxSpeed = 4.6;
    if (keys.left) {
      player.vx = Math.max(player.vx - accel, -maxSpeed);
      player.facing = -1;
    } else if (keys.right) {
      player.vx = Math.min(player.vx + accel, maxSpeed);
      player.facing = 1;
    } else {
      player.vx *= player.onGround ? 0.78 : 0.92;
      if (Math.abs(player.vx) < 0.08) player.vx = 0;
    }

    // 3. Jump & Double Jump
    if (player.onGround) {
      player.coyoteTimer = 7;
      player.jumpsLeft = 2;
    } else if (player.coyoteTimer > 0) {
      player.coyoteTimer--;
    }

    if (jumpPressedJustNow) {
      if (player.coyoteTimer > 0) {
        player.vy = -10.5;
        player.onGround = false;
        player.coyoteTimer = 0;
        player.jumpsLeft = 1;
        playSound('jump');
        spawnParticles(player.x + player.w / 2, player.y + player.h, '#94a3b8', 6);
      } else if (player.jumpsLeft > 0) {
        player.vy = -9.6;
        player.jumpsLeft--;
        playSound('jump');
        spawnParticles(player.x + player.w / 2, player.y + player.h, '#38bdf8', 8);
      }
      jumpPressedJustNow = false;
    }

    // Variable jump height when releasing button early
    if (!keys.jump && player.vy < -4) {
      player.vy *= 0.85;
    }

    // Gravity
    player.vy = Math.min(player.vy + 0.48, 12);

    // Apply X & Check Horizontal Collisions
    player.x += player.vx;
    if (player.x < 0) { player.x = 0; player.vx = 0; }

    for (const p of levelData.platforms) {
      if (rectIntersect(player, p)) {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }

    // Apply Y & Check Vertical Collisions
    const prevBottom = player.y + player.h;
    player.y += player.vy;
    player.onGround = false;

    for (const p of levelData.platforms) {
      if (rectIntersect(player, p)) {
        if (player.vy >= 0 && prevBottom <= p.y + 14) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          // Carry player with moving platform
          if (p.vx) player.x += p.vx;
          if (p.vy) player.y += p.vy;
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }

    // 4. Springs
    for (const s of levelData.springs) {
      if (s.bounceAnim > 0) s.bounceAnim--;
      if (rectIntersect(player, s)) {
        player.vy = -14.2;
        player.onGround = false;
        player.jumpsLeft = 1;
        s.bounceAnim = 12;
        playSound('spring');
        spawnParticles(s.x + s.w / 2, s.y, '#f43f5e', 10);
      }
    }

    // 5. Stars (Collectibles)
    for (const st of levelData.stars) {
      st.bob += 0.08;
      if (!st.collected) {
        const starBox = { x: st.x - 10, y: st.y - 10, w: 20, h: 20 };
        if (rectIntersect(player, starBox)) {
          st.collected = true;
          score += 100;
          playSound('star');
          spawnParticles(st.x, st.y, '#fbbf24', 14);
          updateHUD();
        }
      }
    }

    // 6. Enemies
    for (const en of levelData.enemies) {
      if (!en.alive) continue;
      en.x += en.vx;
      if (en.x < en.minX || en.x + en.w > en.maxX) en.vx *= -1;

      if (rectIntersect(player, en)) {
        // Stomp from above
        if (player.vy > 0 && player.y + player.h - player.vy <= en.y + 14) {
          en.alive = false;
          player.vy = -9.5;
          score += 200;
          playSound('stomp');
          spawnParticles(en.x + en.w / 2, en.y + en.h / 2, '#ef4444', 15);
          updateHUD();
        } else {
          killPlayer();
          return;
        }
      }
    }

    // 7. Spikes & Bottom Pit
    for (const sp of levelData.spikes) {
      if (rectIntersect(player, sp)) {
        killPlayer();
        return;
      }
    }
    if (player.y > canvas.height + 80) {
      killPlayer();
      return;
    }

    // 8. Goal Portal
    if (rectIntersect(player, levelData.goal)) {
      playSound('win');
      score += 500;
      spawnParticles(levelData.goal.x + 20, levelData.goal.y + 35, '#38bdf8', 25);
      if (currentLevelIdx + 1 < LEVELS.length) {
        loadLevel(currentLevelIdx + 1, true);
      } else {
        loadLevel(0, false);
        bannerText = "YOU BEAT ALL WORLDS! ★ PLAY AGAIN";
        bannerTimer = 180;
      }
      return;
    }

    // 9. Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.15;
      pt.life--;
      if (pt.life <= 0) particles.splice(i, 1);
    }

    // 10. Smooth Camera Follow
    const targetCamX = Math.max(0, player.x - canvas.width * 0.35);
    cameraX += (targetCamX - cameraX) * 0.12;
  }

  function killPlayer() {
    playSound('hurt');
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#38bdf8', 18);
    player.x = levelData.spawn.x;
    player.y = levelData.spawn.y;
    player.vx = 0;
    player.vy = 0;
  }

  // --- Rendering ---
  function drawStarShape(cx, cy, spikes, outerR, innerR, color) {
    let rot = (Math.PI / 2) * 3;
    let x = cx;
    let y = cy;
    const step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerR;
      y = cy + Math.sin(rot) * outerR;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerR;
      y = cy + Math.sin(rot) * innerR;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function draw() {
    // Sky Gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, levelData.skyTop);
    grad.addColorStop(1, levelData.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Parallax Background Mountains
    ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
    for (let i = 0; i < 7; i++) {
      const mx = ((i * 260) - (cameraX * 0.2) % 260);
      ctx.beginPath();
      ctx.moveTo(mx - 120, canvas.height);
      ctx.lineTo(mx + 40, 170 + (i % 2) * 45);
      ctx.lineTo(mx + 200, canvas.height);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(-Math.floor(cameraX), 0);

    // Draw Platforms
    for (const p of levelData.platforms) {
      ctx.fillStyle = levelData.platColor;
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 6);
      ctx.fill();

      ctx.fillStyle = levelData.platTop;
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, 6, [6, 6, 0, 0]);
      ctx.fill();
    }

    // Draw Springs
    for (const s of levelData.springs) {
      const stretch = s.bounceAnim > 0 ? -4 : 0;
      ctx.fillStyle = "#cbd5e1";
      ctx.fillRect(s.x + 6, s.y + 5 + stretch, s.w - 12, s.h - 5 - stretch);
      ctx.fillStyle = "#f43f5e";
      ctx.beginPath();
      ctx.roundRect(s.x, s.y + stretch, s.w, 7, 3);
      ctx.fill();
    }

    // Draw Spikes
    ctx.fillStyle = "#94a3b8";
    for (const sp of levelData.spikes) {
      const toothW = 15;
      const count = Math.floor(sp.w / toothW);
      for (let i = 0; i < count; i++) {
        const sx = sp.x + i * toothW;
        ctx.beginPath();
        ctx.moveTo(sx, sp.y + sp.h);
        ctx.lineTo(sx + toothW / 2, sp.y);
        ctx.lineTo(sx + toothW, sp.y + sp.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Draw Collectible Stars
    for (const st of levelData.stars) {
      if (st.collected) continue;
      const sy = st.y + Math.sin(st.bob) * 4;
      drawStarShape(st.x, sy, 5, 11, 5, "#fbbf24");
    }

    // Draw Enemies
    for (const en of levelData.enemies) {
      if (!en.alive) continue;
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.roundRect(en.x, en.y, en.w, en.h, 6);
      ctx.fill();
      // Eyes
      ctx.fillStyle = "#fff";
      const eyeOffset = en.vx > 0 ? 4 : -2;
      ctx.fillRect(en.x + 6 + eyeOffset, en.y + 7, 5, 6);
      ctx.fillRect(en.x + 16 + eyeOffset, en.y + 7, 5, 6);
    }

    // Draw Goal Portal
    const g = levelData.goal;
    ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
    ctx.beginPath();
    ctx.roundRect(g.x - 4, g.y - 4, g.w + 8, g.h + 4, 20);
    ctx.fill();
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(g.x, g.y, g.w, g.h, 18);
    ctx.stroke();

    // Draw Player
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.roundRect(player.x, player.y, player.w, player.h, 7);
    ctx.fill();

    // Player Eyes
    ctx.fillStyle = "#0f172a";
    const lookX = player.facing === 1 ? 14 : 4;
    ctx.fillRect(player.x + lookX, player.y + 9, 4, 7);
    ctx.fillRect(player.x + lookX + 7, player.y + 9, 4, 7);

    // Draw Particles
    for (const pt of particles) {
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
    }

    ctx.restore();

    // Level Announcement Banner
    if (bannerTimer > 0) {
      ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
      ctx.fillRect(0, canvas.height / 2 - 36, canvas.width, 72);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 24px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(bannerText, canvas.width / 2, canvas.height / 2 + 2);
      ctx.font = "13px system-ui, sans-serif";
      ctx.fillStyle = "#94a3b8";
      ctx.fillText("Arrow Keys / WASD to Move & Double-Jump", canvas.width / 2, canvas.height / 2 + 24);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loadLevel(0, true);
  requestAnimationFrame(loop);
})();
</script>
