<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Legend of the Lost Grove</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #game-container {
    position: relative;
    border: 4px solid #3a3a5c;
    box-shadow: 0 0 30px rgba(80, 120, 255, 0.25), inset 0 0 20px rgba(0,0,0,0.5);
    background: #1a2a1a;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #1a3a1a;
  }
  #hud-bar {
    width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #1a1a2e;
    border: 2px solid #3a3a5c;
    font-size: 13px;
    color: #c0c0e0;
  }
  #touch-controls {
    display: none;
    width: 100%;
    max-width: 480px;
    justify-content: space-between;
    padding: 8px 16px;
  }
  @media (max-width: 700px), (pointer: coarse) {
    #touch-controls { display: flex; }
  }
  .dpad {
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px;
    gap: 4px;
  }
  .touch-btn {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .touch-btn:active, .touch-btn.pressed { background: rgba(255,255,255,0.4); }
  #btn-up { grid-column: 2; grid-row: 1; }
  #btn-left { grid-column: 1; grid-row: 2; }
  #btn-down { grid-column: 2; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }
  #btn-sword {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: rgba(220, 60, 50, 0.55);
    border: 2px solid #ff6b6b;
    font-size: 14px;
  }
  #btn-sword:active { background: rgba(220, 60, 50, 0.85); }
  .title {
    font-size: 18px;
    color: #7ec8ff;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(100,180,255,0.5);
  }
</style>
</head>
<body>
<div id="wrapper">
  <div class="title">LEGEND OF THE LOST GROVE</div>
  <div id="game-container">
    <canvas id="c" width="480" height="360"></canvas>
  </div>
  <div id="hud-bar">
    <span id="hearts">❤❤❤</span>
    <span id="rupees">◆ 0</span>
    <span id="key-status">🔑 —</span>
  </div>
  <div id="touch-controls">
    <div class="dpad">
      <div class="touch-btn" id="btn-up">▲</div>
      <div class="touch-btn" id="btn-left">◀</div>
      <div class="touch-btn" id="btn-down">▼</div>
      <div class="touch-btn" id="btn-right">▶</div>
    </div>
    <div class="actions">
      <div class="touch-btn" id="btn-sword">SWORD</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480, H = 360;

// ===== INPUT =====
const keys = { up:0, down:0, left:0, right:0 };
function bind(id, k) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); keys[k]=1; el.classList.add('pressed'); };
  const up   = e => { e.preventDefault(); keys[k]=0; el.classList.remove('pressed'); };
  el.addEventListener('touchstart', down); el.addEventListener('touchend', up);
  el.addEventListener('mousedown', down); el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}
bind('btn-up','up'); bind('btn-down','down'); bind('btn-left','left'); bind('btn-right','right');
document.getElementById('btn-sword').addEventListener('touchstart', e => { e.preventDefault(); attack(); });
document.getElementById('btn-sword').addEventListener('mousedown', attack);

window.addEventListener('keydown', e => {
  if (e.code==='ArrowUp'||e.code==='KeyW') keys.up=1;
  if (e.code==='ArrowDown'||e.code==='KeyS') keys.down=1;
  if (e.code==='ArrowLeft'||e.code==='KeyA') keys.left=1;
  if (e.code==='ArrowRight'||e.code==='KeyD') keys.right=1;
  if (e.code==='Space') { e.preventDefault(); attack(); }
});
window.addEventListener('keyup', e => {
  if (e.code==='ArrowUp'||e.code==='KeyW') keys.up=0;
  if (e.code==='ArrowDown'||e.code==='KeyS') keys.down=0;
  if (e.code==='ArrowLeft'||e.code==='KeyA') keys.left=0;
  if (e.code==='ArrowRight'||e.code==='KeyD') keys.right=0;
});

// ===== GAME STATE =====
let state = 'PLAY'; // PLAY, WON, DEAD
let score = 0;
let hasKey = false;
let shake = 0;
let camX = 0, camY = 0;

// Player
const P = {
  x: 240, y: 280, w: 16, h: 20,
  speed: 2.2, dir: 2, // 0U 1R 2D 3L
  hp: 6, maxHp: 6,
  inv: 0, atk: 0, atkCool: 0
};

// Map is larger than screen – simple room system via zones
// We'll use a 3-room horizontal layout conceptually, but one big map
const MAP_W = 960, MAP_H = 360;

// Obstacles (walls, trees, bushes)
const solids = [
  // Outer borders
  {x:0,y:0,w:MAP_W,h:16}, {x:0,y:MAP_H-16,w:MAP_W,h:16},
  {x:0,y:0,w:16,h:MAP_H}, {x:MAP_W-16,y:0,w:16,h:MAP_H},
  // Room dividers (with openings)
  {x:460,y:0,w:20,h:140}, {x:460,y:220,w:20,h:140},
  // Trees / obstacles room 1
  {x:80,y:60,w:40,h:40}, {x:160,y:100,w:32,h:32},
  {x:300,y:50,w:48,h:36}, {x:100,y:200,w:36,h:48},
  {x:340,y:220,w:40,h:40},
  // Room 2 (middle)
  {x:520,y:70,w:50,h:40}, {x:620,y:160,w:36,h:50},
  {x:700,y:60,w:44,h:36}, {x:560,y:250,w:60,h:40},
  // Room 3 (right – dungeon feel)
  {x:820,y:80,w:60,h:20}, {x:820,y:80,w:20,h:80},
  {x:900,y:80,w:20,h:80}, {x:820,y:140,w:100,h:20},
];

// Locked door (between room 2 and 3)
const door = {x:460, y:140, w:20, h:80, locked:true};

// Key
const keyObj = {x:700, y:280, w:14, h:14, got:false};

// Chest (win)
const chest = {x:860, y:100, w:24, h:20, open:false};

// Pickups
let pickups = [
  {x:120,y:280,type:'rupee'}, {x:280,y:160,type:'rupee'},
  {x:540,y:120,type:'rupee'}, {x:680,y:200,type:'heart'},
  {x:200,y:80,type:'rupee'}, {x:780,y:260,type:'rupee'}
];

// Enemies
let enemies = [
  {x:150,y:150,w:16,h:16,hp:2,spd:0.9,type:'wander',dx:1,dy:0,t:0,hurt:0},
  {x:320,y:250,w:16,h:16,hp:2,spd:1.0,type:'wander',dx:0,dy:1,t:0,hurt:0},
  {x:580,y:100,w:16,h:16,hp:3,spd:1.3,type:'chase',dx:0,dy:0,t:0,hurt:0},
  {x:650,y:280,w:16,h:16,hp:2,spd:1.1,type:'wander',dx:-1,dy:0,t:0,hurt:0},
  {x:880,y:220,w:18,h:18,hp:4,spd:1.4,type:'chase',dx:0,dy:0,t:0,hurt:0}, // mini boss-ish
];

// ===== HELPERS =====
function rects(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function solidAt(x,y,w,h){
  const box = {x,y,w,h};
  for(const s of solids) if(rects(box,s)) return true;
  if(door.locked && rects(box,door)) return true;
  return false;
}

function attack(){
  if(state!=='PLAY' || P.atkCool>0) return;
  P.atk = 12;
  P.atkCool = 18;
}

// ===== UPDATE =====
function update(){
  if(state!=='PLAY') return;

  if(P.inv>0) P.inv--;
  if(P.atk>0) P.atk--;
  if(P.atkCool>0) P.atkCool--;
  if(shake>0) shake--;

  // Movement
  let vx=0, vy=0;
  if(keys.up){ vy=-P.speed; P.dir=0; }
  if(keys.down){ vy=P.speed; P.dir=2; }
  if(keys.left){ vx=-P.speed; P.dir=3; }
  if(keys.right){ vx=P.speed; P.dir=1; }
  if(vx&&vy){ vx*=0.707; vy*=0.707; }

  // X
  if(vx){
    if(!solidAt(P.x+vx, P.y, P.w, P.h)) P.x += vx;
  }
  // Y
  if(vy){
    if(!solidAt(P.x, P.y+vy, P.w, P.h)) P.y += vy;
  }
  P.x = clamp(P.x,16,MAP_W-16-P.w);
  P.y = clamp(P.y,16,MAP_H-16-P.h);

  // Door unlock
  if(door.locked && hasKey && rects({x:P.x-4,y:P.y-4,w:P.w+8,h:P.h+8}, door)){
    door.locked = false;
  }

  // Key
  if(!keyObj.got && rects(P,keyObj)){
    keyObj.got = true;
    hasKey = true;
  }

  // Chest
  if(hasKey && !chest.open && rects(P,chest)){
    chest.open = true;
    state = 'WON';
  }

  // Pickups
  for(let i=pickups.length-1;i>=0;i--){
    const p = pickups[i];
    if(rects(P,p)){
      if(p.type==='rupee'){ score+=20; }
      if(p.type==='heart' && P.hp<P.maxHp){ P.hp = Math.min(P.maxHp, P.hp+2); }
      pickups.splice(i,1);
    }
  }

  // Sword hitbox
  if(P.atk>0){
    let sx=P.x, sy=P.y, sw=16, sh=16;
    if(P.dir===0){ sy-=18; sw=20; sh=16; sx-=2; }
    if(P.dir===2){ sy+=P.h; sw=20; sh=16; sx-=2; }
    if(P.dir===3){ sx-=18; sw=16; sh=22; sy-=1; }
    if(P.dir===1){ sx+=P.w; sw=16; sh=22; sy-=1; }
    const sword = {x:sx,y:sy,w:sw,h:sh};
    for(const e of enemies){
      if(e.hp>0 && e.hurt<=0 && rects(sword,e)){
        e.hp--;
        e.hurt = 12;
        // knockback
        const kx = P.dir===1?6 : P.dir===3?-6 : 0;
        const ky = P.dir===2?6 : P.dir===0?-6 : 0;
        e.x += kx*3; e.y += ky*3;
        if(e.hp<=0){ score+=50; }
        shake = 6;
      }
    }
  }

  // Enemies
  for(const e of enemies){
    if(e.hp<=0) continue;
    if(e.hurt>0) e.hurt--;

    if(e.type==='wander'){
      e.t++;
      if(e.t>70){
        e.t=0;
        const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
        e.dx=d[0]; e.dy=d[1];
      }
      const nx=e.x+e.dx*e.spd, ny=e.y+e.dy*e.spd;
      if(!solidAt(nx,e.y,e.w,e.h)) e.x=nx; else e.dx*=-1;
      if(!solidAt(e.x,ny,e.w,e.h)) e.y=ny; else e.dy*=-1;
    } else { // chase
      const dx = P.x - e.x, dy = P.y - e.y;
      const dist = Math.hypot(dx,dy)||1;
      if(dist<180){
        const nx = e.x + (dx/dist)*e.spd;
        const ny = e.y + (dy/dist)*e.spd;
        if(!solidAt(nx,e.y,e.w,e.h)) e.x=nx;
        if(!solidAt(e.x,ny,e.w,e.h)) e.y=ny;
      }
    }

    // Damage player
    if(P.inv<=0 && rects(P,e)){
      P.hp--;
      P.inv = 50;
      shake = 10;
      // knockback player
      const dx = P.x - e.x, dy = P.y - e.y;
      const d = Math.hypot(dx,dy)||1;
      P.x += (dx/d)*18;
      P.y += (dy/d)*18;
      if(P.hp<=0) state='DEAD';
    }
  }

  // Camera
  camX = clamp(P.x - W/2 + P.w/2, 0, MAP_W-W);
  camY = clamp(P.y - H/2 + P.h/2, 0, MAP_H-H);
}

// ===== DRAW =====
function drawRect(x,y,w,h,col){
  ctx.fillStyle=col;
  ctx.fillRect(Math.floor(x-camX), Math.floor(y-camY), w, h);
}

function draw(){
  // Clear
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0,0,W,H);

  // Screen shake
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake*1.5, (Math.random()-0.5)*shake*1.5);
  }

  // Ground pattern
  ctx.fillStyle = '#163016';
  for(let gx=0; gx<MAP_W; gx+=32){
    for(let gy=0; gy<MAP_H; gy+=32){
      if(((gx+gy)/32)%2===0) drawRect(gx,gy,32,32,'#163016');
    }
  }

  // Solids (trees / walls)
  for(const s of solids){
    // simple tree look if roughly square
    if(s.w<70 && s.h<70){
      drawRect(s.x,s.y,s.w,s.h,'#0d2a0d');
      drawRect(s.x+4,s.y+4,s.w-8,s.h-8,'#1e5c1e');
      drawRect(s.x+s.w/2-3,s.y+s.h-8,6,8,'#3a2a1a'); // trunk hint
    } else {
      drawRect(s.x,s.y,s.w,s.h,'#2a2a3a');
      ctx.strokeStyle='#1a1a28';
      ctx.strokeRect(Math.floor(s.x-camX),Math.floor(s.y-camY),s.w,s.h);
    }
  }

  // Door
  if(door.locked){
    drawRect(door.x,door.y,door.w,door.h,'#5c3a1e');
    drawRect(door.x+6,door.y+30,8,8,'#f1c40f'); // keyhole
  } else {
    // open – just darker floor
    drawRect(door.x,door.y,door.w,door.h,'#0f280f');
  }

  // Key
  if(!keyObj.got){
    drawRect(keyObj.x+2,keyObj.y,10,6,'#f1c40f');
    drawRect(keyObj.x+4,keyObj.y+6,6,8,'#e0b000');
  }

  // Chest
  drawRect(chest.x,chest.y,chest.w,chest.h, chest.open?'#27ae60':'#c0392b');
  drawRect(chest.x+6,chest.y+6,12,8,'#f1c40f');

  // Pickups
  for(const p of pickups){
    if(p.type==='rupee'){
      drawRect(p.x+2,p.y,8,10,'#2ecc71');
      drawRect(p.x+3,p.y+2,6,6,'#58d68d');
    } else {
      ctx.fillStyle='#e74c3c';
      ctx.font='12px sans-serif';
      ctx.fillText('♥', Math.floor(p.x-camX), Math.floor(p.y-camY+12));
    }
  }

  // Enemies
  for(const e of enemies){
    if(e.hp<=0) continue;
    const col = e.hurt>0 ? '#ffaaaa' : (e.type==='chase'?'#c0392b':'#8e44ad');
    drawRect(e.x,e.y,e.w,e.h,col);
    // eyes
    drawRect(e.x+3,e.y+4,3,3,'#fff');
    drawRect(e.x+e.w-6,e.y+4,3,3,'#fff');
  }

  // Player
  if(P.inv===0 || Math.floor(P.inv/3)%2===0){
    // body
    drawRect(P.x,P.y,P.w,P.h,'#3498db');
    // hat / hair
    if(P.dir===0) drawRect(P.x+2,P.y,12,6,'#27ae60');
    if(P.dir===2) drawRect(P.x+2,P.y,12,6,'#27ae60');
    if(P.dir===3) drawRect(P.x,P.y+2,6,12,'#27ae60');
    if(P.dir===1) drawRect(P.x+10,P.y+2,6,12,'#27ae60');
    // face hint
    drawRect(P.x+4,P.y+8,3,3,'#fdebd0');
    drawRect(P.x+9,P.y+8,3,3,'#fdebd0');
  }

  // Sword slash
  if(P.atk>0){
    ctx.fillStyle = '#ecf0f1';
    let sx=P.x, sy=P.y, sw=16, sh=16;
    if(P.dir===0){ sy-=16; sw=20; sh=14; sx-=2; }
    if(P.dir===2){ sy+=P.h; sw=20; sh=14; sx-=2; }
    if(P.dir===3){ sx-=16; sw=14; sh=20; sy-=2; }
    if(P.dir===1){ sx+=P.w; sw=14; sh=20; sy-=2; }
    drawRect(sx,sy,sw,sh,'#ecf0f1');
    // tip highlight
    drawRect(sx+sw/2-2,sy+sh/2-2,4,4,'#bdc3c7');
  }

  ctx.restore();

  // HUD overlay (screen space)
  // hearts
  let heartStr = '';
  for(let i=0;i<P.maxHp/2;i++){
    heartStr += (i*2 < P.hp) ? '❤' : '♡';
  }
  document.getElementById('hearts').textContent = heartStr;
  document.getElementById('rupees').textContent = '◆ ' + score;
  document.getElementById('key-status').textContent = hasKey ? '🔑 YES' : '🔑 —';

  // End screens
  if(state==='DEAD'){
    ctx.fillStyle='rgba(0,0,0,0.8)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e74c3c';
    ctx.font='bold 32px Courier New';
    ctx.textAlign='center';
    ctx.fillText('GAME OVER', W/2, H/2-10);
    ctx.fillStyle='#fff';
    ctx.font='14px Courier New';
    ctx.fillText('Refresh to try again', W/2, H/2+24);
  }
  if(state==='WON'){
    ctx.fillStyle='rgba(0,0,0,0.8)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f1c40f';
    ctx.font='bold 32px Courier New';
    ctx.textAlign='center';
    ctx.fillText('YOU WIN!', W/2, H/2-16);
    ctx.fillStyle='#fff';
    ctx.font='14px Courier New';
    ctx.fillText('The treasure is yours — Score: '+score, W/2, H/2+18);
    ctx.fillText('Refresh to play again', W/2, H/2+42);
  }
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
