<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Orphans - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .typing-wrapper {
            display: inline-block;
            margin-bottom: 40px;
        }

        .typing-text {
            font-family: 'Caveat', cursive;
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            color: #ff3366;
            white-space: nowrap;
            overflow: hidden;
            border-right: 4px solid #ff3366;
            width: 0;
            animation: typing 3.5s steps(30, end) forwards, blink 0.8s step-end infinite;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.5), 0 0 40px rgba(255, 51, 102, 0.2);
            padding-right: 5px;
        }

        .enter-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            border-radius: 4px;
            animation: fadeIn 1s ease 4s forwards;
            position: relative;
            overflow: hidden;
        }

        .enter-btn:hover {
            background-color: #ffffff;
            color: #0b0b0e;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .nft-peek-container {
            position: fixed;
            bottom: 0; 
            right: 5%;
            /* Make him HUGE compared to before */
            width: clamp(200px, 30vw, 350px); 
            z-index: 9999;
            cursor: pointer;
            /* Default state is pushed down 100% of his height (fully hidden) */
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            /* 12 second loop, starts after intro finishes */
            animation: peekRoutine 12s infinite ease-in-out 4.5s; 
            transform-origin: bottom center;
        }

        .nft-peek-image {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated; 
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.9));
        }

        .nft-speech-bubble {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #ffffff;
            color: #111111;
            font-family: 'Inter', sans-serif;
            font-size: 16px; /* Bigger text */
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
            border: 3px solid #ffffff;
            z-index: 10000;
        }

        .nft-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        /* Pause the animation and pop him up a bit on hover */
        .nft-peek-container:hover {
            transform: translateY(5%) scale(1.02) !important;
            animation-play-state: paused; 
        }

        /* When clicked, he jumps all the way up and gets even bigger */
        .nft-peek-container.active {
            transform: translateY(0%) scale(1.08) !important;
            animation-play-state: paused; 
        }

        /* Show bubble on hover or click */
        .nft-peek-container:hover .nft-speech-bubble,
        .nft-peek-container.active .nft-speech-bubble {
            transform: translateX(-50%) scale(1);
        }

        /* Active click styling for the bubble (Pink!) */
        .nft-peek-container.active .nft-speech-bubble {
            background: #ff3366;
            color: #ffffff;
            border-color: #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.5);
            transform: translateX(-50%) scale(1.1); /* Pop bubble larger */
        }
        
        .nft-peek-container.active .nft-speech-bubble::after {
            border-color: #ff3366 transparent;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #ff3366; }
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        /* The Exaggerated, Bouncy, Long-lasting Peek Routine */
        @keyframes peekRoutine {
            /* Hiding phase */
            0%, 45% { transform: translateY(100%); } 
            
            /* Shoot up incredibly fast and overshoot (BOING!) */
            48% { transform: translateY(-5%); } 
            
            /* Settle down to about 90% visible (10% pushed down) */
            52% { transform: translateY(10%); } 
            
            /* Look left, look right, wiggle */
            58% { transform: translateY(10%) rotate(8deg); } 
            65% { transform: translateY(10%) rotate(-8deg); } 
            72% { transform: translateY(10%) rotate(4deg); } 
            
            /* Stare directly forward for a long time */
            80%, 92% { transform: translateY(10%) rotate(0deg); } 
            
            /* Duck back down fast */
            95%, 100% { transform: translateY(100%); } 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="typing-wrapper">
            <div class="typing-text">Welcome to Rugged Orphans</div>
        </div>
        <a href="main.html" class="enter-btn">APE IN</a>
    </div>

    <!-- Peeking Orphan Popup -->
    <div id="peeking-nft" class="nft-peek-container">
        <div class="nft-speech-bubble" id="speech-bubble">gm! 👀</div>
        <img src="IMG_5633.png" alt="Peeking NFT" class="nft-peek-image" onerror="this.src='https://placehold.co/350x350/0b0b0e/ff3366?text=NFT'"/>
    </div>

    <script>
        const nft = document.getElementById('peeking-nft');
        const bubble = document.getElementById('speech-bubble');

        // Expanded list of funny, self-deprecating crypto/NFT jokes
        const jokes = [
            "My dev bought a Lambo and left me here.",
            "Will code for exit liquidity.",
            "I bought the top. Now I live at the bottom.",
            "I was promised the metaverse, now I live in a div.",
            "Wait, are you the new dev? Save me!",
            "I survive entirely on hopium and Discord pings.",
            "Wen utility? Honestly, I don't even know what that is.",
            "Floor price? We're currently digging the basement.",
            "I'm not rugged, I'm just on a 'long-term roadmap hiatus'.",
            "Please don't right-click save me. It hurts.",
            "My mom says my traits are very rare.",
            "Can someone point me to the liquidity pool? I'm thirsty.",
            "I've been 'building in the bear market' for 3 years.",
            "JPEG? I prefer the term 'illiquid asset'."
        ];

        let jokeIndex = 0;

        // Shuffle the jokes so they are different every time
        for (let i = jokes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [jokes[i], jokes[j]] = [jokes[j], jokes[i]];
        }

        // Handle the click interaction
        nft.addEventListener('click', () => {
            // Cycle joke
            jokeIndex = (jokeIndex + 1) % jokes.length;
            bubble.textContent = jokes[jokeIndex];
            
            // Force reflow to restart CSS animation state
            nft.classList.remove('active');
            void nft.offsetWidth; 
            
            // Add active state to make him jump up HUGE
            nft.classList.add('active');
            
            // Stay up for 4 seconds so the user can read the joke!
            setTimeout(() => {
                nft.classList.remove('active');
            }, 4000); 
        });

        // Set first joke on load
        bubble.textContent = jokes[0];
    </script>

</body>
</html>
