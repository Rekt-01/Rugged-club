<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Retro Arcade Club</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 1200px;
    }

    .clubhouse-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('clubhouse.JPG') center/cover no-repeat;
      transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
    }

    /* Interactive Hotspots General Style */
    .hotspot {
      position: absolute;
      z-index: 2;
      cursor: pointer;
      display: none; /* Hidden until doors open */
      border: 2px dashed rgba(255, 255, 255, 0);
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .hotspot::after {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .hotspot:hover::after {
      opacity: 1;
    }

    /* Arcade Cabinet Hotspot */
    .arcade-hotspot {
      top: 42%;
      left: 51%;
      width: 6%;
      height: 18%;
    }

    .arcade-hotspot:hover {
      border-color: #ffe600;
      box-shadow: 0 0 15px #ffe600;
      background: rgba(255, 230, 0, 0.15);
    }

    .arcade-hotspot::after {
      content: 'PLAY PAC-MAN';
      background: #ffe600;
      color: #000;
    }

    /* Sofa Hotspot (Discord Link) */
    .sofa-hotspot {
      top: 64%;
      left: 28%;
      width: 38%;
      height: 25%;
    }

    .sofa-hotspot:hover {
      border-color: #5865F2;
      box-shadow: 0 0 15px #5865F2;
      background: rgba(88, 101, 242, 0.2);
    }

    .sofa-hotspot::after {
      content: 'JOIN DISCORD';
      background: #5865F2;
      color: #fff;
    }

    /* Pool Table Hotspot */
    .pool-hotspot {
      top: 52%;
      left: 55%;
      width: 12%;
      height: 15%;
    }

    .pool-hotspot:hover {
      border-color: #00ff66;
      box-shadow: 0 0 15px #00ff66;
      background: rgba(0, 255, 102, 0.15);
    }

    .pool-hotspot::after {
      content: 'PLAY POOL';
      background: #00ff66;
      color: #000;
    }

    /* Framed Wall Poster Hotspot (OpenSea Link) */
    .opensea-poster {
      top: 27%;
      left: 71.5%;
      width: 5%;
      height: 12%;
      background: url('nft.png') center/cover no-repeat;
      border: 2px solid #2081e2;
      box-shadow: 0 0 8px rgba(32, 129, 226, 0.5);
    }

    .opensea-poster:hover {
      border-color: #2081e2;
      box-shadow: 0 0 18px #2081e2;
      transform: scale(1.05);
    }

    .opensea-poster::after {
      content: 'VIEW OPENSEA COLLECTION';
      background: #2081e2;
      color: #fff;
    }

    /* Doors & Entrance Setup */
    .doors-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      display: flex;
      perspective: 1500px;
      cursor: pointer;
    }

    .door {
      width: 50%;
      height: 100%;
      background: #3b2314;
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.3), transparent 20%, transparent 80%, rgba(0,0,0,0.4)),
        repeating-linear-gradient(0deg, transparent, transparent 150px, rgba(0,0,0,0.2) 151px);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .door-left {
      transform-origin: left center;
      border-right: 4px solid #1a0f08;
    }

    .door-right {
      transform-origin: right center;
      border-left: 4px solid #1a0f08;
    }

    .handle {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 80px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      transform: translateY(-50%);
    }

    .door-left .handle { right: 30px; }
    .door-right .handle { left: 30px; }

    .enter-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.7);
      padding: 15px 30px;
      border: 2px solid #ff007f;
      border-radius: 8px;
      box-shadow: 0 0 15px #ff007f;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    /* Open States */
    .viewport.open .door-left { transform: rotateY(-105deg); }
    .viewport.open .door-right { transform: rotateY(105deg); }
    .viewport.open .clubhouse-bg { transform: scale(1.15); }
    .viewport.open .enter-prompt { opacity: 0; }
    .viewport.open .doors-container { pointer-events: none; }
    .viewport.open .hotspot { display: block; }

    /* Game Modal Window */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 800px;
      height: 500px;
      background: #000;
      border: 4px solid #00ff66;
      border-radius: 12px;
      box-shadow: 0 0 25px #00ff66;
      overflow: hidden;
    }

    .modal-content.pacman-style {
      max-width: 480px;
      height: 600px;
      border-color: #ffe600;
      box-shadow: 0 0 25px #ffe600;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 11;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="viewport" id="scene">
    <div class="clubhouse-bg"></div>
    
    <div class="hotspot arcade-hotspot" onclick="openGame('pacman')"></div>
    <div class="hotspot pool-hotspot" onclick="openGame('pool')"></div>
    
    <a href="https://opensea.io/collection/legods" target="_blank" class="hotspot opensea-poster"></a>

    <a href="https://discord.gg/your-invite-code" target="_blank" class="hotspot sofa-hotspot"></a>

    <div class="enter-prompt">Click to Enter</div>
    <div class="doors-container" onclick="openDoors()">
      <div class="door door-left">
        <div class="handle"></div>
      </div>
      <div class="door door-right">
        <div class="handle"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="gameModal">
    <span class="close-btn" onclick="closeGame()">&times;</span>
    <div class="modal-content" id="modalContent">
      <iframe id="gameFrame" src="" title="Interactive Game"></iframe>
    </div>
  </div>

  <script>
    function openDoors() {
      document.getElementById('scene').classList.add('open');
    }

    function openGame(gameType) {
      const modal = document.getElementById('gameModal');
      const modalContent = document.getElementById('modalContent');
      const gameFrame = document.getElementById('gameFrame');

      if (gameType === 'pacman') {
        modalContent.className = 'modal-content pacman-style';
        gameFrame.src = 'https://pacman.place';
      } else if (gameType === 'pool') {
        modalContent.className = 'modal-content';
        gameFrame.src = 'https://html5.gamedistribution.com/rvvAS3083656/?gd_sdk_referrer_url=https://gamedistribution.com/games/8-ball-pool-1';
      }

      modal.style.display = 'flex';
    }

    function closeGame() {
      const modal = document.getElementById('gameModal');
      const gameFrame = document.getElementById('gameFrame');
      modal.style.display = 'none';
      gameFrame.src = '';
    }
  </script>

</body>
</html>
