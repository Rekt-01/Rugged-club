<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Orphans - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
            max-width: 100vw;
        }
        
        /* Cursive typewriter container - adjusted for small mobile screens */
        .typing-text {
            font-family: 'Caveat', cursive;
            font-size: clamp(1.5rem, 6vw, 4.5rem);
            color: #ff3366;
            margin-bottom: 40px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #ff3366;
            width: 0;
            margin-left: auto;
            margin-right: auto;
            animation: typing 3.5s steps(30, end) forwards, blink 0.75s step-end infinite;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }
        
        /* Enter button styling */
        .enter-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            /* Fades in right as typing finishes */
            animation: fadeIn 1s ease 3.5s forwards; 
        }
        .enter-btn:hover {
            background-color: #ffffff;
            color: #0b0b0e;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* --- TRICKSTER NFT PEEK-A-BOO STYLES --- */
        .nft-peek-container {
            position: fixed;
            bottom: 0; /* Anchored to the very bottom */
            right: 5%;
            /* Huge sizing: scales perfectly between mobile (min 160px) and PC (max 350px) */
            width: clamp(160px, 45vw, 350px); 
            z-index: 9999;
            cursor: pointer;
            user-select: none;
            /* Starts completely hidden below the screen */
            transform: translateY(120%); 
            /* Starts exactly at 3.5s when typing finishes */
            animation: tricksterPeek 14s infinite cubic-bezier(0.25, 1, 0.5, 1) 3.5s; 
            -webkit-tap-highlight-color: transparent; /* Removes blue tap box on mobile */
        }

        .nft-peek-image {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated; 
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.8));
        }

        .nft-speech-bubble {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #ffffff;
            color: #111111;
            font-family: 'Inter', sans-serif;
            font-size: clamp(12px, 3.5vw, 16px);
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }

        .nft-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        /* The Trickster Animation Sequence */
        @keyframes tricksterPeek {
            0%   { transform: translateY(120%); } /* Hidden */
            3%   { transform: translateY(65%); }  /* Just the eyes peek... */
            6%   { transform: translateY(65%); }  /* Staring... */
            8%   { transform: translateY(5%) rotate(-4deg); } /* BOOM! 95% visible */
            10%  { transform: translateY(5%) rotate(4deg); }  /* Wiggle */
            12%  { transform: translateY(5%) rotate(-2deg); } /* Wiggle */
            14%  { transform: translateY(120%); } /* FAKE OUT! Ducks down fast */
            16%  { transform: translateY(0%) rotate(6deg) scale(1.05); } /* Pops back up instantly, 100% visible! */
            20%  { transform: translateY(0%) rotate(0deg) scale(1.05); } /* Stares at you */
            24%  { transform: translateY(120%); } /* Slinks back down into the abyss */
            100% { transform: translateY(120%); } /* Wait for the next round */
        }

        /* PC Hover states pop the bubble */
        .nft-peek-container:hover .nft-speech-bubble {
            transform: translateX(-50%) scale(1);
        }

        /* Active click styling - stays up for mobile/PC clicks */
        .nft-peek-container.active {
            transform: translateY(0%) scale(1.1) !important;
            animation-play-state: paused !important;
        }
        .nft-peek-container.active .nft-speech-bubble {
            transform: translateX(-50%) scale(1);
            background: #ff3366;
            color: #ffffff;
        }
        .nft-peek-container.active .nft-speech-bubble::after {
            border-color: #ff3366 transparent;
        }

        /* Text Animations */
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #ff3366; } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="typing-text">Welcome to Rugged Orphans</div>
        <a href="main.html" class="enter-btn">APE IN</a>
    </div>

    <!-- Trickster Orphan Popup -->
    <div id="peeking-nft" class="nft-peek-container">
        <div class="nft-speech-bubble" id="speech-bubble">gm! 👀</div>
        <img src="IMG_5633.png" alt="Peeking NFT" class="nft-peek-image" />
    </div>

    <script>
        const nft = document.getElementById('peeking-nft');
        const bubble = document.getElementById('speech-bubble');
        let clickTimeout;

        const quotes = [
            "You gonna APE IN or just stare? 🦍",
            "My dev left me...",
            "I sold the bottom! 📉",
            "Stop poking me!",
            "Liquidity locked... I think.",
            "Wen Binance listing? 🚀",
            "I survived the bear market for this?",
            "Sir, this is a Wendy's.",
            "Are we rich yet? 👀"
        ];

        let quoteIndex = 0;

        nft.addEventListener('click', () => {
            // Cycle the quotes
            quoteIndex = (quoteIndex + 1) % quotes.length;
            bubble.textContent = quotes[quoteIndex];
            
            // Reset animation to jump him up
            nft.classList.remove('active');
            void nft.offsetWidth; // Force a CSS reflow
            nft.classList.add('active');
            
            // Clear previous timeouts if clicked multiple times rapidly
            clearTimeout(clickTimeout);
            
            // Keeps him frozen on screen for 4 seconds so mobile users can read it!
            clickTimeout = setTimeout(() => {
                nft.classList.remove('active');
            }, 4000); 
        });
    </script>

</body>
</html>
