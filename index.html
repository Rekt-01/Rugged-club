<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Orphans - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
            max-width: 100vw;
        }
        
        /* Cursive typewriter container */
        .typing-text {
            font-family: 'Caveat', cursive;
            font-size: clamp(1.5rem, 6vw, 4.5rem);
            color: #ff3366;
            margin-bottom: 40px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #ff3366;
            width: 0;
            margin-left: auto;
            margin-right: auto;
            animation: typing 3.5s steps(30, end) forwards, blink 0.75s step-end infinite;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }
        
        /* Enter button styling */
        .enter-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            animation: fadeIn 1s ease 3.5s forwards; 
        }
        .enter-btn:hover {
            background-color: #ffffff;
            color: #0b0b0e;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* --- UPGRADED DEGEN NFT PEEK-A-BOO STYLES --- */
        .nft-peek-container {
            position: fixed;
            bottom: 0; 
            right: 5%;
            width: clamp(160px, 45vw, 350px); 
            z-index: 9999;
            cursor: pointer;
            user-select: none;
            transform: translateY(120%); /* Starts hidden */
            /* One smooth entrance animation */
            animation: slickEntrance 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; 
            -webkit-tap-highlight-color: transparent; 
        }

        .nft-peek-image {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated; 
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.8));
            /* Constant idle breathing animation AFTER entrance finishes */
            animation: idleBob 3s infinite ease-in-out 3.5s;
        }

        /* Speech Bubble */
        .nft-speech-bubble {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #ffffff;
            color: #111111;
            font-family: 'Inter', sans-serif;
            font-size: clamp(11px, 3vw, 15px);
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
            z-index: 10;
        }

        .nft-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        /* Upgraded Slick Entrance Animation */
        @keyframes slickEntrance {
            0%   { transform: translateY(120%); } /* Hidden */
            20%  { transform: translateY(70%); }  /* Peek eyes */
            40%  { transform: translateY(70%); }  /* Stare */
            50%  { transform: translateY(0%) rotate(-5deg); } /* BOOM Jump up */
            60%  { transform: translateY(0%) rotate(5deg); }  /* Wiggle */
            65%  { transform: translateY(0%) rotate(0deg); }  /* Settle */
            75%  { transform: translateY(100%); } /* FAKE OUT DROP */
            100% { transform: translateY(0%) scale(1); }    /* FINAL SETTLE */
        }

        /* Idle Breathing while static */
        @keyframes idleBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(10px) rotate(1deg); }
        }

        /* Talking state triggered by JS */
        .nft-peek-container.talking .nft-speech-bubble {
            transform: translateX(-50%) scale(1);
        }
        
        /* Angry/Pink state for clicks */
        .nft-peek-container.talking.angry .nft-speech-bubble {
            background: #ff3366;
            color: #ffffff;
        }
        .nft-peek-container.talking.angry .nft-speech-bubble::after {
            border-color: #ff3366 transparent;
        }

        /* Quick bounce animation for manual clicks */
        .nft-peek-container.bouncing {
            transform: translateY(-30px) scale(1.05) !important;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #ff3366; } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="typing-text">Welcome to Rugged Orphans</div>
        <a href="main.html" class="enter-btn">APE IN</a>
    </div>

    <!-- Degen Orphan Popup -->
    <div id="peeking-nft" class="nft-peek-container">
        <div class="nft-speech-bubble" id="speech-bubble">gm! 👀</div>
        <img src="IMG_5633.png" alt="Peeking NFT" class="nft-peek-image" />
    </div>

    <script>
        const nft = document.getElementById('peeking-nft');
        const bubble = document.getElementById('speech-bubble');
        
        let hideTimeout;

        // ELITE NFT DEGEN SLANG QUOTES
        const quotes = [
            "Dev just vanished with the multisig keys 💀",
            "Metadata wasn't even revealed yet... pain.",
            "Minted 50, gas cost my kidney, 99% tax honeypot 📉",
            "Bro said 'long-term utility' and blocked me",
            "Blur bidders are haunting my sleep paralysis",
            "My portfolio is a registered federal crime scene",
            "Floor is absolute zero, but my hopium is infinite",
            "Where's the metadata?! It's a blank grey square!",
            "Even OpenSea thinks my bags are a joke",
            "Locked in the liquidity pool like a POW 🪖",
            "Just one more presale bro, I swear I'll make it back",
            "Team tokens vesting? More like resting in peace",
            "SBF took my college fund to buy League skins",
            "Is this a soft rug or a hard rug? Asking for a friend"
        ];

        function sayRandomQuote(isClick = false) {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            bubble.textContent = randomQuote;
            
            nft.classList.add('talking');
            
            if (isClick) {
                nft.classList.add('angry'); // Turn pink if clicked
            } else {
                nft.classList.remove('angry'); // Stay white if auto
            }

            clearTimeout(hideTimeout);
            
            // Hide the bubble after 4 seconds
            hideTimeout = setTimeout(() => {
                nft.classList.remove('talking');
                nft.classList.remove('angry');
            }, 4000);
        }

        // --- AUTO TALKING LOOP ---
        // Start loop right after entrance animation finishes (approx 3.7s)
        setTimeout(() => {
            sayRandomQuote(); // Says first thing
            setInterval(() => {
                sayRandomQuote();
            }, 7000); // Spits out degen thought every 7 seconds
        }, 3800);

        // --- CLICK INTERACTION ---
        nft.addEventListener('click', () => {
            sayRandomQuote(true); // Force pink angry quote
            
            // Do a quick manual bounce
            nft.classList.remove('bouncing');
            void nft.offsetWidth; // Reflow trick to restart anim
            nft.classList.add('bouncing');
            
            setTimeout(() => {
                nft.classList.remove('bouncing');
            }, 300); // Settles back down quickly
        });
    </script>

</body>
</html>
