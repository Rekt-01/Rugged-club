<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rugged Bar v6.1</title>
  <style>
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 0, 122, 0.5);
    }

    /* Container for Canvas / Scene */
    #bar-container {
      position: relative;
      width: 800px;
      height: 500px;
      background-color: #1a1a1a;
      border: 4px solid #333;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Degen Flashing Tag CSS */
    @keyframes degenFlash {
      0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.3; transform: translateX(-50%) scale(1.05); }
    }

    .degen-tag {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      color: #ff007a;
      text-shadow: 0 0 5px rgba(255, 0, 122, 0.8);
      animation: degenFlash 1.2s infinite ease-in-out;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

    /* Hotspot Navigation Links Bar */
    .nav-bar {
      margin-top: 20px;
      display: flex;
      gap: 30px;
    }

    .hotspot-link {
      position: relative;
      display: inline-block;
      color: #00ffcc;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 14px;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      transition: background 0.2s, border-color 0.2s;
    }

    .hotspot-link:hover {
      background: #333;
      border-color: #00ffcc;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }
  </style>
</head>
<body>

  <h1>THE RUGGED BAR v6.1</h1>

  <div id="bar-container">
    <canvas id="barCanvas" width="800" height="500"></canvas>
  </div>

  <div class="nav-bar">
    <!-- Discord Hotspot -->
    <a href="#discord" class="hotspot-link">
      <span class="degen-tag">NGMI?</span>
      Discord Lounge
    </a>

    <!-- OpenSea Hotspot -->
    <a href="#opensea" class="hotspot-link">
      <span class="degen-tag">Ape In</span>
      OpenSea Floor
    </a>

    <!-- ApeChain Tracker Hotspot -->
    <a href="#apechain" class="hotspot-link">
      <span class="degen-tag">Zero to Zero</span>
      ApeChain Tracker
    </a>

    <!-- Pac-Man Hotspot -->
    <a href="#pacman" class="hotspot-link">
      <span class="degen-tag">Rekt Arcade</span>
      Pac-Man
    </a>
  </div>

  <script>
    const canvas = document.getElementById('barCanvas');
    const ctx = canvas.getContext('2d');

    let glowOffset = 0;

    function drawBar() {
      // Clear canvas
      ctx.fillStyle = '#1e1e24';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw a moody bar counter
      ctx.fillStyle = '#2d1b0e';
      ctx.fillRect(100, 350, 600, 100);

      ctx.fillStyle = '#4a2e18';
      ctx.fillRect(100, 335, 600, 15);

      // Neon sign glow effect on the wall
      glowOffset += 0.05;
      let alpha = 0.5 + Math.sin(glowOffset) * 0.2;
      
      ctx.font = 'bold 28px Courier New';
      ctx.fillStyle = `rgba(255, 0, 122, ${alpha})`;
      ctx.textAlign = 'center';
      ctx.fillText("V6.1: ALL FUNDS SAFU (PROBABLY)", canvas.width / 2, 100);

      requestAnimationFrame(drawBar);
    }

    drawBar();
  </script>

</body>
</html>
