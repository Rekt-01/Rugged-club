<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Retro Arcade Club</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 1200px;
    }

    .clubhouse-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('clubhouse.JPG') center/cover no-repeat;
      transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
    }

    /* Interactive Arcade Hotspot */
    .arcade-hotspot {
      position: absolute;
      top: 42%;
      left: 51%;
      width: 6%;
      height: 18%;
      z-index: 2;
      cursor: pointer;
      display: none; /* Hidden until doors open */
      border: 2px dashed rgba(255, 230, 0, 0);
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .arcade-hotspot:hover {
      border-color: #ffe600;
      box-shadow: 0 0 15px #ffe600;
      background: rgba(255, 230, 0, 0.15);
    }

    .arcade-hotspot::after {
      content: 'PLAY PAC-MAN';
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffe600;
      color: #000;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .arcade-hotspot:hover::after {
      opacity: 1;
    }

    /* Doors & Entrance Setup */
    .doors-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      display: flex;
      perspective: 1500px;
      cursor: pointer;
    }

    .door {
      width: 50%;
      height: 100%;
      background: #3b2314;
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.3), transparent 20%, transparent 80%, rgba(0,0,0,0.4)),
        repeating-linear-gradient(0deg, transparent, transparent 150px, rgba(0,0,0,0.2) 151px);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .door-left {
      transform-origin: left center;
      border-right: 4px solid #1a0f08;
    }

    .door-right {
      transform-origin: right center;
      border-left: 4px solid #1a0f08;
    }

    .handle {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 80px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      transform: translateY(-50%);
    }

    .door-left .handle { right: 30px; }
    .door-right .handle { left: 30px; }

    .enter-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.7);
      padding: 15px 30px;
      border: 2px solid #ff007f;
      border-radius: 8px;
      box-shadow: 0 0 15px #ff007f;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    /* Open States */
    .viewport.open .door-left { transform: rotateY(-105deg); }
    .viewport.open .door-right { transform: rotateY(105deg); }
    .viewport.open .clubhouse-bg { transform: scale(1.15); }
    .viewport.open .enter-prompt { opacity: 0; }
    .viewport.open .doors-container { pointer-events: none; }
    .viewport.open .arcade-hotspot { display: block; }

    /* Game Modal Window */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 480px;
      height: 600px;
      background: #000;
      border: 4px solid #ffe600;
      border-radius: 12px;
      box-shadow: 0 0 25px #ffe600;
      overflow: hidden;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 11;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="viewport" id="scene">
    <div class="clubhouse-bg"></div>
    
    <div class="arcade-hotspot" onclick="openGame()"></div>

    <div class="enter-prompt">Click to Enter</div>
    <div class="doors-container" onclick="openDoors()">
      <div class="door door-left">
        <div class="handle"></div>
      </div>
      <div class="door door-right">
        <div class="handle"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="gameModal">
    <span class="close-btn" onclick="closeGame()">&times;</span>
    <div class="modal-content">
      <iframe src="https://pacman.place" title="Pac-Man Game"></iframe>
    </div>
  </div>

  <script>
    function openDoors() {
      document.getElementById('scene').classList.add('open');
    }

    function openGame() {
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('gameModal').style.display = 'none';
    }
  </script>

</body>
</html>
