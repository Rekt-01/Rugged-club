<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>The Retro Arcade Club</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 1200px;
    }

    .clubhouse-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('clubhouse.JPG') center/cover no-repeat;
      transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
    }

    /* Embedded NFT Frame Image on Wall */
    .nft-frame-img {
      position: absolute;
      top: 27.5%;
      left: 71.8%;
      width: 4.8%;
      height: 11.5%;
      object-fit: cover;
      border-radius: 2px;
      z-index: 1;
      pointer-events: none;
      transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Interactive Hotspots */
    .hotspot {
      position: absolute;
      z-index: 2;
      cursor: pointer;
      display: none; /* Hidden until doors open */
      border: 2px dashed rgba(255, 255, 255, 0);
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .hotspot::after {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    @media (hover: hover) {
      .hotspot:hover::after {
        opacity: 1;
      }
    }

    /* Arcade Cabinet Hotspot (Center-Right Arcade Machine) */
    .arcade-hotspot {
      top: 41%;
      left: 51.5%;
      width: 5.5%;
      height: 20%;
    }

    .arcade-hotspot:hover, .arcade-hotspot:active {
      border-color: #ffe600;
      box-shadow: 0 0 15px #ffe600;
      background: rgba(255, 230, 0, 0.15);
    }

    .arcade-hotspot::after {
      content: 'PLAY PAC-MAN';
      background: #ffe600;
      color: #000;
    }

    /* Pool Table Hotspot (Green Felt Table) */
    .pool-hotspot {
      top: 51%;
      left: 55.5%;
      width: 11.5%;
      height: 14%;
    }

    .pool-hotspot:hover, .pool-hotspot:active {
      border-color: #00ff66;
      box-shadow: 0 0 15px #00ff66;
      background: rgba(0, 255, 102, 0.15);
    }

    .pool-hotspot::after {
      content: 'PLAY POOL';
      background: #00ff66;
      color: #000;
    }

    /* Sofa Hotspot (Discord Link) */
    .sofa-hotspot {
      top: 62%;
      left: 28%;
      width: 38%;
      height: 25%;
    }

    .sofa-hotspot:hover, .sofa-hotspot:active {
      border-color: #5865F2;
      box-shadow: 0 0 15px #5865F2;
      background: rgba(88, 101, 242, 0.2);
    }

    .sofa-hotspot::after {
      content: 'JOIN DISCORD';
      background: #5865F2;
      color: #fff;
    }

    /* Framed Wall Poster Hotspot (OpenSea Link) */
    .opensea-poster {
      top: 26%;
      left: 71%;
      width: 6.5%;
      height: 14%;
    }

    .opensea-poster:hover, .opensea-poster:active {
      border: 2px solid #2081e2;
      box-shadow: 0 0 18px #2081e2;
    }

    .opensea-poster::after {
      content: 'OPENSEA COLLECTION';
      background: #2081e2;
      color: #fff;
    }

    /* Doors & Entrance Setup */
    .doors-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      display: flex;
      perspective: 1500px;
      cursor: pointer;
    }

    .door {
      width: 50%;
      height: 100%;
      background: #3b2314;
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.3), transparent 20%, transparent 80%, rgba(0,0,0,0.4)),
        repeating-linear-gradient(0deg, transparent, transparent 150px, rgba(0,0,0,0.2) 151px);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .door-left {
      transform-origin: left center;
      border-right: 4px solid #1a0f08;
    }

    .door-right {
      transform-origin: right center;
      border-left: 4px solid #1a0f08;
    }

    .handle {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 80px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      transform: translateY(-50%);
    }

    .door-left .handle { right: 30px; }
    .door-right .handle { left: 30px; }

    .enter-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.8);
      padding: 12px 24px;
      border: 2px solid #ff007f;
      border-radius: 8px;
      box-shadow: 0 0 15px #ff007f;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.5s ease;
      text-align: center;
      width: max-content;
    }

    /* Open States */
    .viewport.open .door-left { transform: rotateY(-105deg); }
    .viewport.open .door-right { transform: rotateY(105deg); }
    .viewport.open .clubhouse-bg,
    .viewport.open .nft-frame-img { transform: scale(1.15); }
    .viewport.open .enter-prompt { opacity: 0; }
    .viewport.open .doors-container { pointer-events: none; }
    .viewport.open .hotspot { display: block; }

    /* Game Modal Window */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      position: relative;
      width: 95%;
      max-width: 900px;
      height: 80vh;
      background: #000;
      border: 3px solid #00ff66;
      border-radius: 12px;
      box-shadow: 0 0 25px #00ff66;
      overflow: hidden;
    }

    .modal-content.pacman-style {
      max-width: 500px;
      height: 85vh;
      border-color: #ffe600;
      box-shadow: 0 0 25px #ffe600;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #fff;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 11;
      line-height: 1;
      padding: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="viewport" id="scene">
    <div class="clubhouse-bg"></div>
    
    <img src="nft.png" class="nft-frame-img" alt="LEGODS NFT">
    
    <div class="hotspot arcade-hotspot" onclick="openGame('pacman')"></div>
    <div class="hotspot pool-hotspot" onclick="openGame('pool')"></div>
    
    <a href="https://opensea.io/collection/legods" target="_blank" class="hotspot opensea-poster"></a>

    <a href="https://discord.gg/your-invite-code" target="_blank" class="hotspot sofa-hotspot"></a>

    <div class="enter-prompt">Tap to Enter</div>
    <div class="doors-container" onclick="openDoors()">
      <div class="door door-left">
        <div class="handle"></div>
      </div>
      <div class="door door-right">
        <div class="handle"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="gameModal">
    <span class="close-btn" onclick="closeGame()">&times;</span>
    <div class="modal-content" id="modalContent">
      <iframe id="gameFrame" src="" title="Interactive Game" allow="autoplay; payment; microphone; camera; gyroscope; accelerometer"></iframe>
    </div>
  </div>

  <script>
    function openDoors() {
      document.getElementById('scene').classList.add('open');
    }

    function openGame(gameType) {
      const modal = document.getElementById('gameModal');
      const modalContent = document.getElementById('modalContent');
      const gameFrame = document.getElementById('gameFrame');

      if (gameType === 'pacman') {
        modalContent.className = 'modal-content pacman-style';
        // Fully mobile-compatible open source HTML5 Pac-Man
        gameFrame.src = 'https://pacman-js.vercel.app/';
      } else if (gameType === 'pool') {
        modalContent.className = 'modal-content';
        // Fully mobile-compatible open source HTML5 Pool game
        gameFrame.src = 'https://play.gamepix.com/8-ball-pool/embed?sid=88001';
      }

      modal.style.display = 'flex';
    }

    function closeGame() {
      const modal = document.getElementById('gameModal');
      const gameFrame = document.getElementById('gameFrame');
      modal.style.display = 'none';
      gameFrame.src = '';
    }
  </script>

</body>
</html>
