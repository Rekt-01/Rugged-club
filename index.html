<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>The Retro Arcade Club</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 1200px;
    }

    .scene-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio Lock */
      max-height: 100vh;
      max-width: 177.78vh;
    }

    .clubhouse-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('clubhouse.JPG') center/cover no-repeat;
      transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
    }

    /* Embedded NFT Frame Image on Wall */
    .nft-frame-img {
      position: absolute;
      top: 18.5%;
      left: 71.5%;
      width: 5.2%;
      height: 14%;
      object-fit: cover;
      border-radius: 2px;
      z-index: 1;
      pointer-events: none;
      transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Animated Neon Lights Overlays */
    @keyframes neonFlicker {
      0%, 100% { opacity: 1; box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f, inset 0 0 10px #ff007f; }
      50% { opacity: 0.3; box-shadow: 0 0 2px #ff007f, inset 0 0 2px #ff007f; }
      52% { opacity: 1; box-shadow: 0 0 18px #ff007f, 0 0 35px #ff007f; }
      54% { opacity: 0.2; box-shadow: none; }
      56% { opacity: 0.9; box-shadow: 0 0 12px #ff007f; }
    }

    @keyframes yellowGlow {
      0%, 100% { opacity: 0.9; box-shadow: 0 0 15px #ffe600, 0 0 30px #ffe600; }
      50% { opacity: 0.3; box-shadow: 0 0 4px #ffe600; }
    }

    .neon-light {
      position: absolute;
      pointer-events: none;
      border-radius: 4px;
      z-index: 1;
    }

    .neon-arcade {
      top: 42%;
      left: 49%;
      width: 7.5%;
      height: 4%;
      background: rgba(255, 230, 0, 0.2);
      animation: yellowGlow 2s infinite ease-in-out;
    }

    .neon-sign {
      top: 15%;
      left: 30%;
      width: 12%;
      height: 6%;
      background: rgba(255, 0, 127, 0.25);
      border: 1px solid #ff007f;
      animation: neonFlicker 3s infinite;
    }

    /* Interactive Hotspots */
    .hotspot {
      position: absolute;
      z-index: 2;
      cursor: pointer;
      display: none;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .hotspot::after {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    @media (hover: hover) {
      .hotspot:hover::after { opacity: 1; }
    }

    .arcade-hotspot { top: 42%; left: 49%; width: 7.5%; height: 26%; }
    .arcade-hotspot:hover, .arcade-hotspot:active { border-color: #ffe600; box-shadow: 0 0 15px #ffe600; background: rgba(255, 230, 0, 0.2); }
    .arcade-hotspot::after { content: 'PLAY PAC-MAN'; background: #ffe600; color: #000; }

    .pool-hotspot { top: 55%; left: 58.5%; width: 17.5%; height: 19%; }
    .pool-hotspot:hover, .pool-hotspot:active { border-color: #00ff66; box-shadow: 0 0 15px #00ff66; background: rgba(0, 255, 102, 0.2); }
    .pool-hotspot::after { content: 'PLAY POOL'; background: #00ff66; color: #000; }

    .sofa-hotspot { top: 60%; left: 21%; width: 25%; height: 28%; }
    .sofa-hotspot:hover, .sofa-hotspot:active { border-color: #5865F2; box-shadow: 0 0 15px #5865F2; background: rgba(88, 101, 242, 0.2); }
    .sofa-hotspot::after { content: 'JOIN DISCORD'; background: #5865F2; color: #fff; }

    .opensea-poster { top: 18.5%; left: 71.5%; width: 5.2%; height: 14%; }
    .opensea-poster:hover, .opensea-poster:active { border: 2px solid #2081e2; box-shadow: 0 0 18px #2081e2; }
    .opensea-poster::after { content: 'OPENSEA COLLECTION'; background: #2081e2; color: #fff; }

    /* Doors & Entrance Setup */
    .doors-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3; display: flex; perspective: 1500px; cursor: pointer;
    }

    .door {
      width: 50%; height: 100%; background: #3b2314;
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.3), transparent 20%, transparent 80%, rgba(0,0,0,0.4)),
        repeating-linear-gradient(0deg, transparent, transparent 150px, rgba(0,0,0,0.2) 151px);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative; transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .door-left { transform-origin: left center; border-right: 4px solid #1a0f08; }
    .door-right { transform-origin: right center; border-left: 4px solid #1a0f08; }

    .handle {
      position: absolute; top: 50%; width: 18px; height: 80px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border-radius: 10px; box-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      transform: translateY(-50%);
    }

    .door-left .handle { right: 30px; }
    .door-right .handle { left: 30px; }

    .enter-prompt {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-size: 1.2rem; letter-spacing: 2px;
      text-transform: uppercase; background: rgba(0,0,0,0.8);
      padding: 12px 24px; border: 2px solid #ff007f; border-radius: 8px;
      box-shadow: 0 0 15px #ff007f; z-index: 4; pointer-events: none;
      transition: opacity 0.5s ease; text-align: center;
    }

    .viewport.open .door-left { transform: rotateY(-105deg); }
    .viewport.open .door-right { transform: rotateY(105deg); }
    .viewport.open .clubhouse-bg,
    .viewport.open .nft-frame-img { transform: scale(1.1); }
    .viewport.open .enter-prompt { opacity: 0; }
    .viewport.open .doors-container { pointer-events: none; }
    .viewport.open .hotspot { display: block; }

    /* Custom Game Modal Window */
    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.94);
      z-index: 10; justify-content: center; align-items: center;
      flex-direction: column;
    }

    .modal-content {
      position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000; border: 3px solid #00ff66; border-radius: 12px;
      box-shadow: 0 0 25px #00ff66; padding: 12px; max-width: 95vw;
    }

    .modal-content.pacman-style {
      border-color: #ffe600; box-shadow: 0 0 25px #ffe600;
    }

    .close-btn {
      position: absolute; top: -45px; right: 0; color: #fff;
      font-size: 2.2rem; font-weight: bold; cursor: pointer; padding: 5px;
    }

    canvas { background: #111; border-radius: 8px; touch-action: none; }

    /* Mobile Controls */
    .mobile-controls { display: flex; flex-direction: column; align-items: center; margin-top: 10px; width: 100%; }
    .dpad-row { display: flex; justify-content: center; gap: 10px; margin: 3px 0; }
    .btn-ctrl {
      width: 50px; height: 50px; background: rgba(255, 255, 255, 0.15);
      border: 2px solid #fff; border-radius: 8px; color: #fff;
      font-size: 1.2rem; font-weight: bold; display: flex;
      justify-content: center; align-items: center; cursor: pointer;
    }
    .btn-ctrl:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.95); }
    .btn-shoot {
      width: 120px; height: 45px; background: #00ff66; color: #000;
      font-weight: bold; font-size: 1rem; border: none; border-radius: 25px;
      margin-top: 8px; cursor: pointer; box-shadow: 0 0 10px #00ff66;
    }
    .btn-shoot:active { transform: scale(0.95); background: #00cc52; }
  </style>
</head>
<body>

  <div class="viewport" id="scene">
    <div class="scene-container">
      <div class="clubhouse-bg"></div>
      
      <div class="neon-light neon-arcade"></div>
      <div class="neon-light neon-sign"></div>

      <img src="nft.png" class="nft-frame-img" alt="LEGODS NFT">
      
      <div class="hotspot arcade-hotspot" onclick="openGame('pacman')"></div>
      <div class="hotspot pool-hotspot" onclick="openGame('pool')"></div>
      <a href="https://opensea.io/collection/legods" target="_blank" class="hotspot opensea-poster"></a>
      <a href="https://discord.gg/your-invite-code" target="_blank" class="hotspot sofa-hotspot"></a>
    </div>

    <div class="enter-prompt">Tap to Enter</div>
    <div class="doors-container" onclick="openDoors()">
      <div class="door door-left"><div class="handle"></div></div>
      <div class="door door-right"><div class="handle"></div></div>
    </div>
  </div>

  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalContent">
      <span class="close-btn" onclick="closeGame()">&times;</span>
      <canvas id="gameCanvas" width="320" height="320"></canvas>
      <div class="mobile-controls" id="controlsContainer"></div>
    </div>
  </div>

  <script>
    function openDoors() {
      document.getElementById('scene').classList.add('open');
    }

    let activeGameLoop = null;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const controlsContainer = document.getElementById('controlsContainer');

    function openGame(gameType) {
      document.getElementById('gameModal').style.display = 'flex';

      if (gameType === 'pacman') {
        document.getElementById('modalContent').className = 'modal-content pacman-style';
        startPacman();
      } else if (gameType === 'pool') {
        document.getElementById('modalContent').className = 'modal-content';
        startPool();
      }
    }

    function closeGame() {
      document.getElementById('gameModal').style.display = 'none';
      if (activeGameLoop) cancelAnimationFrame(activeGameLoop);
    }

    function startPacman() {
      canvas.width = 320; canvas.height = 320;
      let player = { x: 160, y: 160, size: 12, dx: 0, dy: 0, speed: 2.5, score: 0 };
      let ghost = { x: 40, y: 40, size: 12, dx: 1.5, dy: 1.5 };
      let dots = [];

      for (let r = 30; r < 300; r += 30) {
        for (let c = 30; c < 300; c += 30) {
          dots.push({ x: r, y: c, active: true });
        }
      }

      controlsContainer.innerHTML = `
        <div class="dpad-row">
          <div class="btn-ctrl" onclick="movePlayer(0, -1)">▲</div>
        </div>
        <div class="dpad-row">
          <div class="btn-ctrl" onclick="movePlayer(-1, 0)">◀</div>
          <div class="btn-ctrl" onclick="movePlayer(0, 1)">▼</div>
          <div class="btn-ctrl" onclick="movePlayer(1, 0)">▶</div>
        </div>
      `;

      window.movePlayer = (dirX, dirY) => {
        player.dx = dirX * player.speed;
        player.dy = dirY * player.speed;
      };

      function update() {
        player.x += player.dx; player.y += player.dy;
        if (player.x < 15) player.x = 305; if (player.x > 305) player.x = 15;
        if (player.y < 15) player.y = 305; if (player.y > 305) player.y = 15;

        ghost.x += ghost.dx; ghost.y += ghost.dy;
        if (ghost.x <= 20 || ghost.x >= 300) ghost.dx *= -1;
        if (ghost.y <= 20 || ghost.y >= 300) ghost.dy *= -1;

        dots.forEach(d => {
          if (d.active && Math.hypot(player.x - d.x, player.y - d.y) < 12) {
            d.active = false; player.score += 10;
          }
        });

        if (Math.hypot(player.x - ghost.x, player.y - ghost.y) < 18) {
          player.x = 160; player.y = 160; player.dx = 0; player.dy = 0; player.score = 0;
        }

        draw();
        activeGameLoop = requestAnimationFrame(update);
      }

      function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        dots.forEach(d => {
          if (d.active) {
            ctx.fillStyle = '#ffb8ae'; ctx.beginPath();
            ctx.arc(d.x, d.y, 3, 0, Math.PI * 2); ctx.fill();
          }
        });

        ctx.fillStyle = '#ffe600'; ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0.2 * Math.PI, 1.8 * Math.PI);
        ctx.lineTo(player.x, player.y); ctx.fill();

        ctx.fillStyle = '#ff0000'; ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, ghost.size, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif';
        ctx.fillText('SCORE: ' + player.score, 15, 25);
      }

      window.onkeydown = (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, -1);
        if (e.key === 'ArrowDown') movePlayer(0, 1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
      };

      update();
    }

    function startPool() {
      canvas.width = 320; canvas.height = 180;
      let cueBall = { x: 80, y: 90, vx: 0, vy: 0, r: 7, color: '#fff' };
      let aimAngle = 0;
      let balls = [
        cueBall,
        { x: 220, y: 90, vx: 0, vy: 0, r: 7, color: '#ffcc00' },
        { x: 235, y: 82, vx: 0, vy: 0, r: 7, color: '#ff3333' },
        { x: 235, y: 98, vx: 0, vy: 0, r: 7, color: '#ffcc00' },
        { x: 250, y: 74, vx: 0, vy: 0, r: 7, color: '#ff3333' },
        { x: 250, y: 90, vx: 0, vy: 0, r: 7, color: '#111' },
        { x: 250, y: 106, vx: 0, vy: 0, r: 7, color: '#ffcc00' }
      ];

      controlsContainer.innerHTML = `
        <div class="dpad-row">
          <div class="btn-ctrl" onclick="rotateAim(-0.15)">↺ AIM</div>
          <div class="btn-ctrl" onclick="rotateAim(0.15)">AIM ↻</div>
        </div>
        <button class="btn-shoot" onclick="shootCue()">SHOOT!</button>
      `;

      window.rotateAim = (rad) => { aimAngle += rad; };
      window.shootCue = () => {
        if (Math.abs(cueBall.vx) < 0.1 && Math.abs(cueBall.vy) < 0.1) {
          cueBall.vx = Math.cos(aimAngle) * 7;
          cueBall.vy = Math.sin(aimAngle) * 7;
        }
      };

      function update() {
        balls.forEach((b1, i) => {
          b1.x += b1.vx; b1.y += b1.vy;
          b1.vx *= 0.98; b1.vy *= 0.98;

          if (b1.x - b1.r < 10 || b1.x + b1.r > 310) b1.vx *= -1;
          if (b1.y - b1.r < 10 || b1.y + b1.r > 170) b1.vy *= -1;

          for (let j = i + 1; j < balls.length; j++) {
            let b2 = balls[j];
            let dist = Math.hypot(b2.x - b1.x, b2.y - b1.y);
            if (dist < b1.r + b2.r) {
              let angle = Math.atan2(b2.y - b1.y, b2.x - b1.x);
              let speed1 = Math.hypot(b1.vx, b1.vy);
              b1.vx = -Math.cos(angle) * speed1 * 0.8;
              b1.vy = -Math.sin(angle) * speed1 * 0.8;
              b2.vx = Math.cos(angle) * speed1 * 0.8;
              b2.vy = Math.sin(angle) * speed1 * 0.8;
            }
          }
        });

        draw();
        activeGameLoop = requestAnimationFrame(update);
      }

      function draw() {
        ctx.fillStyle = '#0f5220'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#5c3a21'; ctx.lineWidth = 10;
        ctx.strokeRect(5, 5, 310, 170);

        balls.forEach(b => {
          ctx.fillStyle = b.color; ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
        });

        if (Math.abs(cueBall.vx) < 0.1 && Math.abs(cueBall.vy) < 0.1) {
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
          ctx.moveTo(cueBall.x, cueBall.y);
          ctx.lineTo(cueBall.x + Math.cos(aimAngle) * 40, cueBall.y + Math.sin(aimAngle) * 40);
          ctx.stroke();
        }
      }

      update();
    }
  </script>

</body>
</html>
