<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Orphans - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
            max-width: 100vw;
        }
        
        /* Cursive typewriter container */
        .typing-text {
            font-family: 'Caveat', cursive;
            font-size: clamp(1.5rem, 6vw, 4.5rem);
            color: #ff3366;
            margin-bottom: 40px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #ff3366;
            width: 0;
            margin-left: auto;
            margin-right: auto;
            /* Takes 3.5s total to type */
            animation: typing 3.5s steps(30, end) forwards, blink 0.75s step-end infinite;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }
        
        /* Enter button styling */
        .enter-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            animation: fadeIn 1s ease 3.5s forwards; 
        }
        .enter-btn:hover {
            background-color: #ffffff;
            color: #0b0b0e;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* --- DEGEN NFT PEEK-A-BOO STYLES --- */
        .nft-peek-container {
            position: fixed;
            bottom: 0; 
            right: 5%;
            width: clamp(160px, 45vw, 350px); 
            z-index: 9999;
            cursor: pointer;
            user-select: none;
            transform: translateY(120%); /* Hidden */
            /* Starts at 0.1s (exactly when the 'W' is printed), ends forwards (stays on screen) */
            animation: tricksterEntrance 3.4s cubic-bezier(0.25, 1, 0.5, 1) 0.1s forwards; 
            -webkit-tap-highlight-color: transparent; 
        }

        .nft-peek-image {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated; 
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.8));
            /* Adds a slight idle breathing animation AFTER he settles on screen */
            animation: idleBob 3s infinite ease-in-out 3.5s;
        }

        .nft-speech-bubble {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #ffffff;
            color: #111111;
            font-family: 'Inter', sans-serif;
            font-size: clamp(11px, 3vw, 15px);
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }

        .nft-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        /* The Trickster Entrance Sequence */
        @keyframes tricksterEntrance {
            0%   { transform: translateY(120%); } /* Hidden */
            15%  { transform: translateY(65%); }  /* Eyes peek... */
            30%  { transform: translateY(65%); }  /* Staring... */
            45%  { transform: translateY(5%) rotate(-4deg); } /* Jump scare */
            55%  { transform: translateY(5%) rotate(4deg); }  /* Wiggle */
            65%  { transform: translateY(5%) rotate(-2deg); } /* Wiggle */
            75%  { transform: translateY(120%); } /* FAKE OUT! Ducks down fast */
            85%  { transform: translateY(0%) rotate(6deg) scale(1.05); } /* BAM! */
            100% { transform: translateY(0%) rotate(0deg) scale(1); } /* Settles forever */
        }

        /* Idle Breathing */
        @keyframes idleBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(8px); }
        }

        /* Bubble logic: triggers via JS class */
        .nft-peek-container.talking .nft-speech-bubble {
            transform: translateX(-50%) scale(1);
        }
        
        /* Bubble colors on click vs auto-talk */
        .nft-peek-container.talking.angry .nft-speech-bubble {
            background: #ff3366;
            color: #ffffff;
        }
        .nft-peek-container.talking.angry .nft-speech-bubble::after {
            border-color: #ff3366 transparent;
        }

        /* Bounce animation for manual clicks */
        .nft-peek-container.bouncing {
            transform: translateY(-20px) scale(1.05) !important;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Text Animations */
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #ff3366; } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="typing-text">Welcome to Rugged Orphans</div>
        <a href="main.html" class="enter-btn">APE IN</a>
    </div>

    <!-- Degen Orphan Popup -->
    <div id="peeking-nft" class="nft-peek-container">
        <div class="nft-speech-bubble" id="speech-bubble">gm! 👀</div>
        <img src="IMG_5633.png" alt="Peeking NFT" class="nft-peek-image" />
    </div>

    <script>
        const nft = document.getElementById('peeking-nft');
        const bubble = document.getElementById('speech-bubble');
        
        let hideTimeout;

        // Peak degen schizo thoughts
        const quotes = [
            "Dev just bought a Lambo with our liquidity 😭",
            "Contract renounced? Yeah right.",
            "Who the hell is selling?!",
            "Is it a soft rug or a hard rug?",
            "Deployer just minted 10T more tokens 🚩",
            "It's just a 'marketing wallet' bro, chill.",
            "I survived the bear market for this?!",
            "Wait... where did the liquidity pool go?",
            "Ape first, read contract never 🦍",
            "Another day, another honeypot 🍯",
            "My dev left me... again.",
            "Are we the bad actors? 👀",
            "Just one more presale bro, I swear.",
            "SBF took my college fund.",
            "Team tokens are vested... right?",
            "It’s a feature, not a drainer 💀"
        ];

        function sayRandomQuote(isClick = false) {
            // Pick a random degen quote
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            bubble.textContent = randomQuote;
            
            // Show bubble
            nft.classList.add('talking');
            
            if (isClick) {
                nft.classList.add('angry'); // Make it pink if clicked
            } else {
                nft.classList.remove('angry'); // Keep white if auto
            }

            clearTimeout(hideTimeout);
            
            // Hide the bubble after 3.5 seconds
            hideTimeout = setTimeout(() => {
                nft.classList.remove('talking');
                nft.classList.remove('angry');
            }, 3500);
        }

        // --- AUTO TALKING LOOP ---
        // Wait 3.5 seconds for his entrance animation to finish, then start the loop
        setTimeout(() => {
            // Says the first thing right after he settles
            sayRandomQuote();
            
            // Randomly spits out a new degen thought every 6 seconds forever
            setInterval(() => {
                sayRandomQuote();
            }, 6000);
            
        }, 3600);

        // --- CLICK INTERACTION ---
        nft.addEventListener('click', () => {
            sayRandomQuote(true); // True makes the bubble pink for clicks
            
            // Do a quick manual bounce
            nft.classList.remove('bouncing');
            void nft.offsetWidth; // Reflow trick
            nft.classList.add('bouncing');
            
            setTimeout(() => {
                nft.classList.remove('bouncing');
            }, 300); // Settles back down quickly
        });
    </script>

</body>
</html>
