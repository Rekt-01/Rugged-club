<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged Orphans - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
            max-width: 100vw;
        }
        
        /* Cursive typewriter container */
        .typing-text {
            font-family: 'Caveat', cursive;
            font-size: clamp(1.5rem, 6vw, 4.5rem);
            color: #ff3366;
            margin-bottom: 40px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #ff3366;
            width: 0;
            margin-left: auto;
            margin-right: auto;
            animation: typing 3.5s steps(30, end) forwards, blink 0.75s step-end infinite;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }
        
        /* Enter button styling */
        .enter-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            animation: fadeIn 1s ease 3.5s forwards; 
        }
        .enter-btn:hover {
            background-color: #ffffff;
            color: #0b0b0e;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* --- DEGEN NFT PEEK-A-BOO STYLES --- */
        .nft-peek-container {
            position: fixed;
            bottom: 0; 
            right: 5%;
            width: clamp(160px, 45vw, 350px); 
            z-index: 9999;
            cursor: pointer;
            user-select: none;
            transform: translateY(120%); 
            animation: tricksterEntrance 3.4s cubic-bezier(0.25, 1, 0.5, 1) 0.1s forwards; 
            -webkit-tap-highlight-color: transparent; 
        }

        .nft-peek-image {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated; 
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.8));
            animation: idleBob 3s infinite ease-in-out 3.5s;
        }

        /* Speech Bubble */
        .nft-speech-bubble {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #ffffff;
            color: #111111;
            font-family: 'Inter', sans-serif;
            font-size: clamp(11px, 3vw, 14px);
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
            z-index: 10;
        }

        .nft-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        /* --- SURPRISE FEATURE: THE LIVE DEGEN TERMINAL TICKER --- */
        .degen-tracker {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%) translateY(30px) scale(0);
            background: rgba(11, 11, 14, 0.9);
            border: 1px solid #ff3366;
            color: #00ff66;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(9px, 2vw, 11px);
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 9;
        }

        /* Trigger states for bubble and tracker */
        .nft-peek-container.talking .nft-speech-bubble,
        .nft-peek-container.talking .degen-tracker {
            transform: translateX(-50%) scale(1) translateY(0);
        }

        .nft-peek-container.talking.angry .nft-speech-bubble {
            background: #ff3366;
            color: #ffffff;
        }
        .nft-peek-container.talking.angry .nft-speech-bubble::after {
            border-color: #ff3366 transparent;
        }
        .nft-peek-container.talking.angry .degen-tracker {
            color: #ff3366;
            border-color: #00ff66;
        }

        /* Entrance Animation */
        @keyframes tricksterEntrance {
            0%   { transform: translateY(120%); } 
            15%  { transform: translateY(65%); }  
            30%  { transform: translateY(65%); }  
            45%  { transform: translateY(5%) rotate(-4deg); } 
            55%  { transform: translateY(5%) rotate(4deg); }  
            65%  { transform: translateY(5%) rotate(-2deg); } 
            75%  { transform: translateY(120%); } 
            85%  { transform: translateY(0%) rotate(6deg) scale(1.05); } 
            100% { transform: translateY(0%) rotate(0deg) scale(1); } 
        }

        @keyframes idleBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(8px); }
        }

        .nft-peek-container.bouncing {
            transform: translateY(-20px) scale(1.05) !important;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #ff3366; } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="typing-text">Welcome to Rugged Orphans</div>
        <a href="main.html" class="enter-btn">APE IN</a>
    </div>

    <!-- Degen Orphan Popup with Live Ticker Feature -->
    <div id="peeking-nft" class="nft-peek-container">
        <div class="nft-speech-bubble" id="speech-bubble">gm! 👀</div>
        <div class="degen-tracker" id="degen-tracker">FLOOR: 0.0000 ETH | PAIN: 100%</div>
        <img src="IMG_5633.png" alt="Peeking NFT" class="nft-peek-image" />
    </div>

    <script>
        const nft = document.getElementById('peeking-nft');
        const bubble = document.getElementById('speech-bubble');
        const tracker = document.getElementById('degen-tracker');
        
        let hideTimeout;

        // Elite NFT Degen Slang Quotes
        const quotes = [
            "Dev just vanished with the multisig keys 💀",
            "Metadata wasn't even revealed yet... pain.",
            "Minted 50, gas cost my kidney, 99% tax honeypot 📉",
            "Bro said 'long-term utility' and blocked me",
            "Blur bidders are haunting my sleep paralysis",
            "My portfolio is a registered federal crime scene",
            "Floor is absolute zero, but my hopium is infinite",
            "Where's the metadata?! It's a blank grey square!",
            "Even OpenSea thinks my bags are a joke",
            "Locked in the liquidity pool like a POW 🪖",
            "Just one more presale bro, I swear I'll make it back",
            "Team tokens vesting? More like resting in peace",
            "SBF took my college fund to buy League skins",
            "Is this a soft rug or a hard rug? Asking for a friend"
        ];

        // Live Ticker Stats to cycle with the quotes
        const trackerStats = [
            "FLOOR: 0.0000 ETH | STATUS: COOKED",
            "GAS: 69,420 GWEI | AGONY: MAXIMUM",
            "HOLDERS: 3 (Me, Dev, Dev's Mom)",
            "LIQUIDITY: RUGGED 🦀",
            "COPIUM RESERVES: CRITICAL ⚠️",
            "DEV WALLET: DUMPING ACTIVE 🚨",
            "PAPER HANDS: DETECTED 🧻"
        ];

        function sayRandomQuote(isClick = false) {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            const randomStat = trackerStats[Math.floor(Math.random() * trackerStats.length)];
            
            bubble.textContent = randomQuote;
            tracker.textContent = randomStat;
            
            nft.classList.add('talking');
            
            if (isClick) {
                nft.classList.add('angry');
            } else {
                nft.classList.remove('angry');
            }

            clearTimeout(hideTimeout);
            
            hideTimeout = setTimeout(() => {
                nft.classList.remove('talking');
                nft.classList.remove('angry');
            }, 3500);
        }

        // Start auto-talking loop right after entrance
        setTimeout(() => {
            sayRandomQuote();
            setInterval(() => {
                sayRandomQuote();
            }, 6000);
        }, 3600);

        // Click interaction
        nft.addEventListener('click', () => {
            sayRandomQuote(true);
            
            nft.classList.remove('bouncing');
            void nft.offsetWidth; 
            nft.classList.add('bouncing');
            
            setTimeout(() => {
                nft.classList.remove('bouncing');
            }, 300);
        });
    </script>

</body>
</html>
