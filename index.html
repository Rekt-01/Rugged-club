<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Retro Arcade Club</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Scene Viewport */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 1200px; /* Gives depth to the 3D door rotation */
    }

    /* Clubhouse Background Image */
    .clubhouse-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('clubhouse.JPG') center/cover no-repeat;
      transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
    }

    /* Door Container with 3D Perspective */
    .doors-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      perspective: 1500px;
      cursor: pointer;
    }

    /* Individual Door Panels */
    .door {
      width: 50%;
      height: 100%;
      background: #3b2314;
      background-image: 
        linear-gradient(90deg, rgba(0,0,0,0.3), transparent 20%, transparent 80%, rgba(0,0,0,0.4)),
        repeating-linear-gradient(0deg, transparent, transparent 150px, rgba(0,0,0,0.2) 151px);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      position: relative;
      transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .door-left {
      transform-origin: left center;
      border-right: 4px solid #1a0f08;
    }

    .door-right {
      transform-origin: right center;
      border-left: 4px solid #1a0f08;
    }

    /* Handles */
    .handle {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 80px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.6);
      transform: translateY(-50%);
    }

    .door-left .handle { right: 30px; }
    .door-right .handle { left: 30px; }

    /* Click Prompt Overlay */
    .enter-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.7);
      padding: 15px 30px;
      border: 2px solid #ff007f;
      border-radius: 8px;
      box-shadow: 0 0 15px #ff007f;
      z-index: 3;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    /* OPEN STATE ANIMATIONS */
    .viewport.open .door-left {
      transform: rotateY(-105deg);
    }

    .viewport.open .door-right {
      transform: rotateY(105deg);
    }

    .viewport.open .clubhouse-bg {
      transform: scale(1.15); /* Walk-in forward movement effect */
    }

    .viewport.open .enter-prompt {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="viewport" id="scene">
    <div class="clubhouse-bg"></div>
    <div class="enter-prompt" id="prompt">Click to Enter</div>
    <div class="doors-container" onclick="openDoors()">
      <div class="door door-left">
        <div class="handle"></div>
      </div>
      <div class="door door-right">
        <div class="handle"></div>
      </div>
    </div>
  </div>

  <script>
    function openDoors() {
      const scene = document.getElementById('scene');
      scene.classList.add('open');
    }
  </script>

</body>
</html>
