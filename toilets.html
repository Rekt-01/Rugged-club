<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>The Rugged Bar v14.3 - Toilets</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #020205;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .viewport {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden; perspective: 1200px;
    }

    .scene-container {
      position: absolute; top: 50%; left: 50%;
      width: 100vw; height: 177.78vw;
      max-height: 100vh; max-width: 56.25vh;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: #000;
    }

    @media (min-aspect-ratio: 9/16) {
      .scene-container { width: 56.25vh; height: 100vh; }
    }

    /* --- TOILET ENVIRONMENT --- */
    .toilet-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #111; /* Fallback if toilet.JPG is missing */
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* Hotspot representing the latch/door handle to return to the bar */
    .stall-lock-hotspot {
      position: absolute;
      top: 45%;
      left: 40%;
      width: 20%;
      height: 15%;
      z-index: 3;
      cursor: pointer;
      border: 2px dashed rgba(0, 255, 102, 0.4);
      background: rgba(0, 255, 102, 0.1);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: #00ff66;
      font-family: monospace;
      font-size: 0.7rem;
      font-weight: bold;
      text-align: center;
      transition: all 0.3s ease;
    }

    .stall-lock-hotspot:hover {
      background: rgba(0, 255, 102, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="scene-container">
      
      <!-- Toilet background image container -->
      <div class="toilet-bg"></div>
      
      <!-- Interactive Latch Link back to index.html -->
      <a href="index.html" class="stall-lock-hotspot" title="Unlock Stall & Return to Bar">
        UNLATCH & EXIT
      </a>
      
    </div>
  </div>

</body>
</html>
