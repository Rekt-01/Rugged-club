<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>The Rugged Bar v14.2 - Restroom</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #020205;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .viewport {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scene-container {
      position: absolute; top: 50%; left: 50%;
      width: 100vw; height: 177.78vw;
      max-height: 100vh; max-width: 56.25vh;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: url('toilet.jpg') center center / cover no-repeat;
    }

    @media (min-aspect-ratio: 9/16) {
      .scene-container { width: 56.25vh; height: 100vh; }
    }

    /* --- INTERACTIVE HOTSPOTS --- */
    .hotspot {
      position: absolute;
      z-index: 5;
      cursor: pointer;
      background: transparent;
      border: none;
      transition: background 0.2s ease;
    }

    /* Hidden button on the stall latch/lock mechanism */
    .stall-lock-hotspot {
      top: 42%;
      right: 23%;
      width: 15%;
      height: 8%;
    }
    .stall-lock-hotspot:hover, .stall-lock-hotspot:active {
      background: rgba(0, 255, 102, 0.2);
      border-radius: 6px;
    }

    /* "LORE" graffiti hotspot on the left wall */
    .lore-hotspot {
      top: 56%;
      left: 3%;
      width: 12%;
      height: 7%;
    }
    .lore-hotspot:hover, .lore-hotspot:active {
      background: rgba(255, 0, 122, 0.25);
      border-radius: 4px;
    }

    /* --- POPUP WINDOW MODAL --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      position: relative;
      background: #0d0d12;
      border: 2px solid #ff007a;
      border-radius: 12px;
      padding: 30px 20px 20px 20px;
      width: 90vw;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 122, 0.5);
      font-family: monospace;
    }

    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      color: #fff;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn:hover {
      color: #ff007a;
    }

    .modal-title {
      color: #ff007a;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(255, 0, 122, 0.6);
      letter-spacing: 1px;
    }

    .modal-body-text {
      color: #ccc;
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .modal-action-btn {
      background: #ff007a;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      font-family: monospace;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 122, 0.5);
    }
    .modal-action-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="scene-container">
      
      <!-- Hidden hotspot over the bathroom stall lock/latch pointing back to the bar -->
      <a href="index.html?doors=open" class="hotspot stall-lock-hotspot" title="Unlock Stall & Return to Bar"></a>

      <!-- Hotspot covering the "LORE" text on the left wall -->
      <button class="hotspot lore-hotspot" onclick="openLoreModal()" title="Inspect Lore"></button>

    </div>
  </div>

  <!-- Lore Popup Window Modal -->
  <div class="modal" id="loreModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeLoreModal()">&times;</span>
      <div class="modal-title">📜 RESTROOM LORE ARCHIVE</div>
      <div class="modal-body-text" id="loreTextContainer">
        "It is said that whoever stares long enough into the 404 Degen graffiti while holding a heavy bag will unlock the secrets of the next market cycle... (Add your custom lore content here later!)"
      </div>
      <button class="modal-action-btn" onclick="closeLoreModal()">CLOSE WRITING</button>
    </div>
  </div>

  <script>
    function openLoreModal() {
      document.getElementById('loreModal').style.display = 'flex';
    }

    function closeLoreModal() {
      document.getElementById('loreModal').style.display = 'none';
    }
  </script>

</body>
</html>
